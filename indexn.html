<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>DPBI 2026 - Seleksi Nasional Duta Pelajar Berbudaya Indonesia</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: 'Plus Jakarta Sans', 'Poppins', sans-serif;
      background: radial-gradient(circle at 0% 0%, rgba(212,175,55,0.08) 0%, rgba(255,255,255,0) 70%),
                  radial-gradient(circle at 100% 100%, rgba(212,175,55,0.05) 0%, rgba(255,255,255,0) 70%),
                  linear-gradient(145deg, #FAFBFD 0%, #F4F6F9 100%);
      min-height: 100vh;
      position: relative;
      overflow-x: hidden;
    }

    /* Ornamen gold glow */
    .gold-glow-left {
      position: fixed;
      top: -20%;
      left: -15%;
      width: 70%;
      height: 70%;
      background: radial-gradient(circle, rgba(212,175,55,0.25) 0%, rgba(212,175,55,0) 70%);
      border-radius: 50%;
      pointer-events: none;
      z-index: 0;
      filter: blur(50px);
    }
    .gold-glow-right {
      position: fixed;
      bottom: -20%;
      right: -15%;
      width: 70%;
      height: 70%;
      background: radial-gradient(circle, rgba(212,175,55,0.2) 0%, rgba(212,175,55,0) 70%);
      border-radius: 50%;
      pointer-events: none;
      z-index: 0;
      filter: blur(60px);
    }

    .app-container {
      position: relative;
      z-index: 10;
      max-width: 1440px;
      margin: 0 auto;
      padding: 28px 36px;
    }

    /* Premium Glassmorphism */
    .glass-premium {
      background: rgba(255, 255, 255, 0.86);
      backdrop-filter: blur(18px);
      border-radius: 32px;
      border: 1px solid rgba(255, 255, 255, 0.6);
      box-shadow: 0 25px 45px -12px rgba(0, 0, 0, 0.12), 0 2px 4px rgba(255,255,255,0.5);
      transition: all 0.3s cubic-bezier(0.2, 0.9, 0.4, 1.1);
    }

    .btn-gold-premium {
      background: linear-gradient(115deg, #C9A227 0%, #D4AF37 45%, #F4D35E 100%);
      border: none;
      padding: 14px 32px;
      font-weight: 700;
      border-radius: 60px;
      color: #1F2937;
      transition: all 0.25s;
      box-shadow: 0 12px 24px -8px rgba(201, 162, 39, 0.4);
      cursor: pointer;
      font-size: 1rem;
      letter-spacing: 0.3px;
    }
    .btn-gold-premium:hover {
      transform: translateY(-3px);
      box-shadow: 0 20px 32px -8px rgba(201, 162, 39, 0.5);
      background: linear-gradient(115deg, #B48C1A, #D4AF37, #FDE16D);
    }

    .btn-outline-premium {
      background: transparent;
      border: 2px solid #D4AF37;
      color: #C9A227;
      padding: 12px 28px;
      border-radius: 60px;
      font-weight: 600;
      cursor: pointer;
      transition: 0.2s;
    }
    .btn-outline-premium:hover {
      background: rgba(212,175,55,0.1);
      transform: translateY(-2px);
    }

    .input-premium {
      border: 1.5px solid rgba(212,175,55,0.3);
      border-radius: 60px;
      padding: 14px 24px;
      font-size: 1rem;
      width: 100%;
      background: rgba(255,255,255,0.95);
      transition: all 0.2s;
      font-family: 'Plus Jakarta Sans', sans-serif;
    }
    .input-premium:focus {
      outline: none;
      border-color: #D4AF37;
      box-shadow: 0 0 0 4px rgba(212, 175, 55, 0.15);
    }

    /* Timer floating premium */
    .timer-floating {
      position: fixed;
      top: 28px;
      right: 36px;
      background: rgba(0, 0, 0, 0.85);
      backdrop-filter: blur(12px);
      padding: 10px 24px;
      border-radius: 60px;
      color: #FFDF8C;
      font-weight: 800;
      font-size: 1.3rem;
      z-index: 200;
      font-family: monospace;
      border: 1px solid rgba(212, 175, 55, 0.7);
      box-shadow: 0 10px 20px rgba(0,0,0,0.2);
      letter-spacing: 1px;
    }

    .option-card {
      background: #FEFCF8;
      border-radius: 28px;
      padding: 16px 24px;
      margin: 14px 0;
      cursor: pointer;
      border: 1px solid #EFE8DB;
      transition: all 0.2s;
      font-weight: 500;
    }
    .option-card.selected {
      border: 2px solid #D4AF37;
      background: linear-gradient(120deg, #FFFBF0, #FFF7E4);
      box-shadow: 0 10px 20px rgba(201, 162, 39, 0.12);
    }

    .soal-nav-pill {
      background: #F1F2F6;
      border-radius: 60px;
      padding: 10px 0;
      font-weight: 700;
      cursor: pointer;
      text-align: center;
      min-width: 52px;
      transition: 0.15s;
    }
    .soal-nav-pill.answered { background: #D4AF37; color: white; box-shadow: 0 4px 10px rgba(212,175,55,0.4); }
    .soal-nav-pill.active { border: 2px solid #C9A227; background: #FFF2CC; color: #B48C1A; transform: scale(1.02); }

    .progress-gold {
      height: 8px;
      background: #E9E4D4;
      border-radius: 20px;
      overflow: hidden;
    }
    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, #C9A227, #F4D35E);
      width: 0%;
      transition: width 0.3s;
    }

    .toast-premium {
      position: fixed;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%) scale(0.9);
      background: #1E293B;
      backdrop-filter: blur(12px);
      color: white;
      padding: 14px 28px;
      border-radius: 80px;
      font-weight: 600;
      z-index: 3000;
      opacity: 0;
      transition: 0.2s;
      pointer-events: none;
      font-size: 0.9rem;
      box-shadow: 0 15px 30px -10px black;
    }
    .toast-premium.show { opacity: 1; transform: translateX(-50%) scale(1); }

    footer {
      text-align: center;
      margin-top: 48px;
      padding: 24px 0 12px;
      font-size: 0.75rem;
      color: #7A6A42;
      border-top: 1px solid rgba(212,175,55,0.2);
    }

    @media (max-width: 768px) {
      .app-container { padding: 16px; }
      .timer-floating { top: 12px; right: 16px; padding: 6px 16px; font-size: 1rem; }
    }
  </style>
</head>
<body>
<div class="gold-glow-left"></div>
<div class="gold-glow-right"></div>

<!-- Loading Screen -->
<div id="loadingScreen" style="position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(255,252,240,0.98); backdrop-filter:blur(24px); z-index:5000; display:flex; align-items:center; justify-content:center; flex-direction:column;">
  <div style="text-align:center;">
    <img src="https://cdn.phototourl.com/free/2026-06-10-14462ae8-b80e-4052-8c31-c65b843c63e6.png" alt="Logo DPBI" style="width:110px; margin-bottom:20px;">
    <h2 style="font-weight: 800; background: linear-gradient(135deg, #C9A227, #F4D35E); -webkit-background-clip: text; background-clip: text; color: transparent;">Duta Pelajar Berbudaya</h2>
    <p style="margin-top: 8px; color: #5A4A2E;">Seleksi Nasional 2026</p>
    <p id="loadStatus" style="margin-top: 28px; font-weight: 500;">Mempersiapkan sistem...</p>
    <div class="progress-gold" style="width: 320px; margin-top: 20px;"><div class="progress-fill" id="loadProgressFill"></div></div>
    <p id="loadPercent" style="margin-top: 12px; font-weight: 600;">0%</p>
    <button id="retryLoad" style="display:none; margin-top: 28px;" class="btn-gold-premium"><i class="fas fa-sync-alt"></i> Muat Ulang</button>
  </div>
</div>

<div class="app-container" id="mainApp" style="display: none;"></div>
<div id="toastMsg" class="toast-premium"></div>
<div id="imageModal" style="position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.94); display:flex; align-items:center; justify-content:center; z-index:4000; visibility:hidden; opacity:0; transition:0.2s;"><img id="modalImgSrc" style="max-width:90%; max-height:90%; border-radius:28px;"><span style="position:absolute; top:30px; right:40px; color:white; font-size:48px; cursor:pointer;" id="closeModalBtn">&times;</span></div>

<script>
  // Konfigurasi
  const SHEET_CSV_URL = "https://docs.google.com/spreadsheets/d/17BdQHCiwmRnfnhhITQ7MDTQjeMhi0y9P46qLVfqZg3A/export?format=csv&gid=0";
  const SOAL_JSON_URL = "https://raw.githubusercontent.com/Alfinorizkih/SeleksiMateri_DPBI/refs/heads/main/soal.json";
  const BOT_TOKEN = "8611068552:AAHCleWMDayr9Udwer2KmVVABR_X8pzgadw";
  const CHAT_ID = "7509429091";
  
  // Global state
  let globalPeserta = [];
  let bankSoal = [];
  let currentUser = null;
  let examState = null; // { token, nama, sekolah, soalConfig, answers, remainingSeconds, violations, startTime }
  let timerInterval = null, autoSaveInterval = null;
  let isSubmitting = false, examForcedClosed = false, currentQuestionIndex = 0;
  let fullscreenCheckInterval = null;
  
  // Helper
  function showToast(msg) { let t = document.getElementById('toastMsg'); t.innerText = msg; t.classList.add('show'); setTimeout(() => t.classList.remove('show'), 3000); }
  function escapeHtml(str) { if (!str) return ''; return str.replace(/[&<>]/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[m])); }
  function parseCSV(csvText) {
    const lines = csvText.split(/\r?\n/).filter(l => l.trim());
    if (lines.length < 2) return [];
    const headers = lines[0].split(',').map(h => h.trim().replace(/^\uFEFF/, ''));
    const rows = [];
    for (let i = 1; i < lines.length; i++) {
      const vals = lines[i].split(',');
      let obj = {};
      headers.forEach((h, idx) => { obj[h] = vals[idx] ? vals[idx].trim() : ""; });
      rows.push(obj);
    }
    return rows;
  }
  
  async function fetchWithCORS(url) {
    try { let r = await fetch(url); if (r.ok) return await r.text(); } catch(e) {}
    const proxy = `https://api.allorigins.win/raw?url=${encodeURIComponent(url)}`;
    let r2 = await fetch(proxy);
    if (r2.ok) return await r2.text();
    throw new Error("Gagal mengambil data. Cek koneksi.");
  }
  
  async function loadPeserta() {
    let csv = await fetchWithCORS(SHEET_CSV_URL);
    let data = parseCSV(csv);
    if (!data.length) throw new Error("Database peserta kosong.");
    globalPeserta = data.map(p => ({ ...p, Status: p.Status || "BELUM" }));
  }
  
  async function loadSoal() {
    let resp = await fetch(SOAL_JSON_URL);
    if (!resp.ok) throw new Error("Gagal mengambil bank soal.");
    let soalRaw = await resp.json();
    bankSoal = soalRaw.map(s => ({
      id: s.id, jenis: s.jenis, pertanyaan: s.pertanyaan, gambar: s.gambar || "",
      pilihan: { A: s.pilihanA || "", B: s.pilihanB || "", C: s.pilihanC || "", D: s.pilihanD || "" },
      jawaban: s.jawaban, bobot: parseInt(s.bobot) || 1
    }));
  }
  
  // Token & session management
  function getCompletedTokens() { return JSON.parse(localStorage.getItem('dpbi_completed_tokens') || '[]'); }
  function addCompletedToken(token) { let a = getCompletedTokens(); if (!a.includes(token)) a.push(token); localStorage.setItem('dpbi_completed_tokens', JSON.stringify(a)); }
  
  function loginValidate(nama, sekolah, token) {
    let peserta = globalPeserta.find(p => p["Nama Lengkap"]?.toLowerCase().trim() === nama.toLowerCase().trim() && p["Asal Sekolah"]?.toLowerCase().trim() === sekolah.toLowerCase().trim() && p["Token"] === token);
    if (!peserta) return { success: false, msg: "Data peserta tidak ditemukan. Silakan periksa kembali data Anda atau hubungi panitia." };
    if (peserta.Status !== "BELUM") return { success: false, msg: "Akun sudah menyelesaikan seleksi." };
    if (getCompletedTokens().includes(token)) return { success: false, msg: "Token sudah pernah digunakan." };
    let now = new Date(), start = new Date(peserta["Waktu Mulai Token"]), end = new Date(peserta["Waktu Selesai Token"]);
    if (isNaN(start) || isNaN(end)) return { success: false, msg: "Format waktu token invalid." };
    if (now < start) return { success: false, msg: `⏳ Sesi seleksi belum dimulai. Mulai: ${start.toLocaleString()}` };
    if (now > end) return { success: false, msg: `⌛ Sesi seleksi telah berakhir. Selesai: ${end.toLocaleString()}` };
    return { success: true, pesertaData: peserta };
  }
  
  // Shuffle & prepare soal config
  function shuffleArray(arr) { for (let i = arr.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [arr[i], arr[j]] = [arr[j], arr[i]]; } return arr; }
  
  function prepareSoalConfig(soalArray) {
    let shuffledSoal = shuffleArray([...soalArray]);
    return shuffledSoal.map(soal => {
      let shuffledOptions = [], correctAnswerKey = "";
      if (soal.jenis === "PG") {
        let choices = [{letter:"A",text:soal.pilihan.A},{letter:"B",text:soal.pilihan.B},{letter:"C",text:soal.pilihan.C},{letter:"D",text:soal.pilihan.D}].filter(c=>c.text?.trim());
        let shuffled = shuffleArray([...choices]);
        let correctText = soal.pilihan[soal.jawaban];
        let newCorrect = shuffled.find(opt => opt.text === correctText)?.letter || "A";
        shuffledOptions = shuffled; correctAnswerKey = newCorrect;
      } else if (soal.jenis === "BENAR_SALAH") {
        let bs = [{letter:"Benar",text:"Benar"},{letter:"Salah",text:"Salah"}];
        let shuffled = shuffleArray([...bs]);
        correctAnswerKey = (soal.jawaban === "Benar") ? "Benar" : "Salah";
        shuffledOptions = shuffled;
      }
      return { original: soal, shuffledOptions, correctAnswerKey, userAnswer: null };
    });
  }
  
  function initExamState(participant, soalConfig) {
    return {
      token: participant.Token,
      nama: participant["Nama Lengkap"],
      sekolah: participant["Asal Sekolah"],
      nomorPeserta: participant["Nomor Peserta"] || "DPBI" + Math.floor(Math.random()*9000+1000),
      soalConfig: soalConfig,
      answers: new Array(soalConfig.length).fill(null),
      remainingSeconds: 60 * 60,
      violations: 0,
      startTime: Date.now(),
    };
  }
  function saveExamToLocal() { if(examState) localStorage.setItem('dpbi_exam_state', JSON.stringify(examState)); }
  function restoreExam() {
    let saved = localStorage.getItem('dpbi_exam_state');
    if (!saved) return false;
    try {
      let parsed = JSON.parse(saved);
      if (parsed && !getCompletedTokens().includes(parsed.token)) {
        examState = parsed;
        currentUser = globalPeserta.find(p => p.Token === parsed.token) || { "Nama Lengkap": parsed.nama, "Asal Sekolah": parsed.sekolah, Token: parsed.token, "Nomor Peserta": parsed.nomorPeserta };
        return true;
      }
    } catch(e) { }
    return false;
  }
  
  function updateTimerDisplay() { if (examState && document.getElementById('floatingTimer')) { let s = examState.remainingSeconds, h = Math.floor(s/3600), m = Math.floor((s%3600)/60), sec = s%60; document.getElementById('floatingTimer').innerText = `${h.toString().padStart(2,'0')}:${m.toString().padStart(2,'0')}:${sec.toString().padStart(2,'0')}`; } }
  function startTimer() { if (timerInterval) clearInterval(timerInterval); timerInterval = setInterval(() => { if (!examState || examState.remainingSeconds <= 0) { if (examState && examState.remainingSeconds <= 0 && !isSubmitting) forceSubmit("⏰ Waktu seleksi habis!"); clearInterval(timerInterval); return; } examState.remainingSeconds--; updateTimerDisplay(); saveExamToLocal(); if (examState.remainingSeconds === 0) forceSubmit("Waktu habis!"); }, 1000); }
  function startAutoSave() { if (autoSaveInterval) clearInterval(autoSaveInterval); autoSaveInterval = setInterval(() => { if (examState && !isSubmitting) saveExamToLocal(); }, 3000); }
  
  async function sendTelegramResult(nama, nomor, sekolah, token, nilai, pelanggaran, durasiPakai) {
    let msg = `🎓 *HASIL SELEKSI DPBI 2026* 🎓\n👤 *Nama:* ${nama}\n🆔 *Nomor Peserta:* ${nomor}\n🏫 *Sekolah:* ${sekolah}\n🔑 *Token:* ${token}\n📊 *Nilai Akhir:* ${nilai.toFixed(2)}%\n⚠️ *Pelanggaran:* ${pelanggaran}\n⏱️ *Durasi Ujian:* ${durasiPakai} detik\n✅ *Status:* Selesai\n🕒 *Waktu Submit:* ${new Date().toLocaleString()}`;
    try { await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ chat_id: CHAT_ID, text: msg, parse_mode: 'Markdown' }) }); } catch(e) { console.warn(e); }
  }
  
  async function forceSubmit(reason) {
    if (isSubmitting || examForcedClosed) return;
    examForcedClosed = true;
    if (timerInterval) clearInterval(timerInterval);
    if (autoSaveInterval) clearInterval(autoSaveInterval);
    if (fullscreenCheckInterval) clearInterval(fullscreenCheckInterval);
    isSubmitting = true;
    showToast(reason);
    let totalBobot = 0, totalBenar = 0;
    for (let qc of examState.soalConfig) { let bobot = qc.original.bobot; totalBobot += bobot; if (qc.userAnswer === qc.correctAnswerKey) totalBenar += bobot; }
    let nilai = totalBobot === 0 ? 0 : (totalBenar / totalBobot) * 100;
    let durasi = Math.floor((Date.now() - examState.startTime) / 1000);
    await sendTelegramResult(examState.nama, examState.nomorPeserta, examState.sekolah, examState.token, nilai, examState.violations, durasi);
    addCompletedToken(examState.token);
    localStorage.removeItem('dpbi_exam_state');
    renderPage('selesai', { forced: true });
  }
  
  async function finalSubmit() {
    if (isSubmitting) return;
    isSubmitting = true;
    if (timerInterval) clearInterval(timerInterval);
    if (autoSaveInterval) clearInterval(autoSaveInterval);
    if (fullscreenCheckInterval) clearInterval(fullscreenCheckInterval);
    let totalBobot = 0, totalBenar = 0;
    for (let qc of examState.soalConfig) { let bobot = qc.original.bobot; totalBobot += bobot; if (qc.userAnswer === qc.correctAnswerKey) totalBenar += bobot; }
    let nilai = totalBobot === 0 ? 0 : (totalBenar / totalBobot) * 100;
    let durasi = Math.floor((Date.now() - examState.startTime) / 1000);
    await sendTelegramResult(examState.nama, examState.nomorPeserta, examState.sekolah, examState.token, nilai, examState.violations, durasi);
    addCompletedToken(examState.token);
    localStorage.removeItem('dpbi_exam_state');
    renderPage('selesai', { forced: false });
  }
  
  // Anti cheat super ketat
  function activateStrictAntiCheat() {
    if (!examState) return;
    let violationHandler = (type) => {
      if (!examState || isSubmitting || examForcedClosed) return;
      examState.violations++;
      saveExamToLocal();
      showToast(`⚠️ Pelanggaran #${examState.violations}: ${type}`);
      if (examState.violations >= 3) forceSubmit("Batas maksimal pelanggaran (3) tercapai. Ujian dihentikan.");
    };
    const handleVisibility = () => { if (document.hidden && examState && !isSubmitting && !examForcedClosed) violationHandler("Meninggalkan halaman ujian"); };
    const handleBlur = () => { if (examState && !isSubmitting && !examForcedClosed) violationHandler("Beralih ke aplikasi lain"); };
    document.addEventListener('visibilitychange', handleVisibility);
    window.addEventListener('blur', handleBlur);
    window.addEventListener('beforeunload', (e) => { if (examState && !isSubmitting && !examForcedClosed) forceSubmit("Penutupan halaman terdeteksi."); });
    const fullHandler = () => { if (!document.fullscreenElement && examState && !isSubmitting && !examForcedClosed) violationHandler("Keluar dari mode fullscreen"); };
    document.addEventListener('fullscreenchange', fullHandler);
    window.addEventListener('keydown', (e) => {
      if (e.key === 'F12' || (e.ctrlKey && e.shiftKey && (e.key === 'I' || e.key === 'i')) || (e.ctrlKey && e.key === 'u') || (e.ctrlKey && e.key === 'p') || (e.ctrlKey && e.key === 'c') || (e.ctrlKey && e.key === 'v')) {
        e.preventDefault();
        violationHandler("Mencoba akses developer tools / copy-paste");
      }
    });
    document.addEventListener('contextmenu', e => e.preventDefault());
    document.addEventListener('copy', e => e.preventDefault());
    document.addEventListener('cut', e => e.preventDefault());
    document.addEventListener('paste', e => e.preventDefault());
    setInterval(() => { if (examState && !document.fullscreenElement && !isSubmitting && !examForcedClosed) violationHandler("Fullscreen tidak aktif"); }, 3000);
  }
  
  // RENDER SYSTEM
  const appContainer = document.getElementById('mainApp');
  function renderPage(page, params = {}) {
    if (!appContainer) return;
    if (page === 'login') {
      appContainer.innerHTML = `<div class="glass-premium" style="max-width: 600px; margin: 0 auto; padding: 40px;"><div style="text-align:center;"><img src="https://cdn.phototourl.com/free/2026-06-10-14462ae8-b80e-4052-8c31-c65b843c63e6.png" style="width:80px;"><h2 style="margin:16px 0 6px;">Seleksi Nasional DPBI</h2><p style="color:#6B5B35;">Portal Resmi 2026</p></div><form id="loginForm" style="margin-top: 32px;"><input type="text" id="namaLogin" class="input-premium" placeholder="Nama Lengkap" autocomplete="off"><br><br><input type="text" id="sekolahLogin" class="input-premium" placeholder="Asal Sekolah" autocomplete="off"><br><br><input type="text" id="tokenLogin" class="input-premium" placeholder="Token Seleksi" autocomplete="off"><br><br><button type="submit" class="btn-gold-premium" style="width:100%;"><i class="fas fa-arrow-right-to-bracket"></i> MASUK SELEKSI</button></form></div><footer>© DPBI 2026 — Sistem Seleksi Nasional Berintegritas</footer>`;
      document.getElementById('loginForm')?.addEventListener('submit', async (e) => {
        e.preventDefault();
        let nama = document.getElementById('namaLogin').value.trim(), sekolah = document.getElementById('sekolahLogin').value.trim(), token = document.getElementById('tokenLogin').value.trim();
        let res = loginValidate(nama, sekolah, token);
        if (!res.success) { showToast(res.msg); return; }
        currentUser = res.pesertaData;
        renderPage('dashboard');
      });
    } 
    else if (page === 'dashboard') {
      appContainer.innerHTML = `<div class="glass-premium" style="max-width: 860px; margin: 0 auto; padding: 36px;"><h2><i class="fas fa-id-card"></i> Dashboard Peserta</h2><div style="background: #FBF9F2; border-radius: 32px; padding: 24px; margin: 24px 0;"><div><i class="fas fa-hashtag"></i> <strong>Nomor Peserta:</strong> ${escapeHtml(currentUser["Nomor Peserta"] || "DPBI" + Math.floor(Math.random()*9000+1000))}</div><div><i class="fas fa-user"></i> ${escapeHtml(currentUser["Nama Lengkap"])}</div><div><i class="fas fa-school"></i> ${escapeHtml(currentUser["Asal Sekolah"])}</div><div><i class="fas fa-key"></i> Token: ${currentUser.Token}</div><div><i class="fas fa-hourglass-half"></i> Status: ${currentUser.Status}</div><div><i class="fas fa-calendar-alt"></i> Periode: ${currentUser["Waktu Mulai Token"]} s/d ${currentUser["Waktu Selesai Token"]}</div></div><p><i class="fas fa-info-circle"></i> Seleksi berjumlah ${bankSoal.length} soal, durasi 60 menit. Sistem anti-kecurangan nasional aktif.</p><button id="toConfirm" class="btn-gold-premium" style="margin-top: 28px;"><i class="fas fa-forward"></i> LANJUT KE KONFIRMASI TES</button></div>`;
      document.getElementById('toConfirm')?.addEventListener('click', () => renderPage('confirm'));
    }
    else if (page === 'confirm') {
      appContainer.innerHTML = `<div class="glass-premium" style="max-width: 800px; margin: 0 auto; padding: 36px;"><h2><i class="fas fa-clipboard-list"></i> Konfirmasi Tes</h2><div style="background:#FBF9F2; border-radius:28px; padding:20px; margin:20px 0;"><h3>Data Peserta</h3><p>Nama: ${escapeHtml(currentUser["Nama Lengkap"])}<br>Sekolah: ${escapeHtml(currentUser["Asal Sekolah"])}<br>Nomor: ${currentUser["Nomor Peserta"] || "DPBI"+Math.floor(Math.random()*9000+1000)}<br>Token: ${currentUser.Token}</p><h3>Detail Seleksi</h3><p>Jumlah Soal: ${bankSoal.length}<br>Durasi: 60 menit<br>Sistem Anti Kecurangan: Fullscreen wajib, pelanggaran maksimal 3 kali</p></div><label style="display:flex; gap:12px;"><input type="checkbox" id="confirmChk"> Saya memastikan data sudah benar.</label><button id="confirmNext" class="btn-gold-premium" style="margin-top:24px;" disabled>LANJUTKAN</button></div>`;
      let chk = document.getElementById('confirmChk'), btn = document.getElementById('confirmNext');
      chk.onchange = () => btn.disabled = !chk.checked;
      btn.onclick = () => renderPage('rules');
    }
    else if (page === 'rules') {
      appContainer.innerHTML = `<div class="glass-premium" style="max-width: 1000px; margin: 0 auto; padding: 36px;"><h2><i class="fas fa-gavel"></i> Peraturan Seleksi DPBI</h2><div style="max-height: 400px; overflow-y: auto; margin: 20px 0; padding-right: 10px;"><p style="font-size:0.9rem; line-height:1.7;">⚠️ <strong>KETENTUAN WAJIB NASIONAL</strong><br>1. Waktu pengerjaan 60 menit, timer otomatis.<br>2. Peserta WAJIB mengaktifkan FULLSCREEN. Keluar fullscreen = pelanggaran.<br>3. Dilarang membuka tab baru, aplikasi lain, screenshot, copy-paste, print.<br>4. Pelanggaran maksimal 3 kali, jika tercapai ujian otomatis berakhir.<br>5. Sistem auto-save setiap 3 detik, session recovery tersedia.<br>6. Dengan melanjutkan, Anda menyetujui seluruh aturan seleksi.</p></div><label style="display:flex; gap:12px;"><input type="checkbox" id="agreeRules"> Saya telah membaca dan memahami seluruh peraturan.</label><div id="countdownRules" style="background:#F2EFE6; padding:12px; border-radius:60px; text-align:center; margin:16px 0;">⏳ Tunggu 10 detik...</div><button id="startExamBtn" class="btn-gold-premium" disabled>MULAI SELEKSI</button></div>`;
      let countdown = 10, btn = document.getElementById('startExamBtn'), cbox = document.getElementById('agreeRules'), cdDiv = document.getElementById('countdownRules');
      let interval = setInterval(() => { countdown--; cdDiv.innerText = `⏳ Tunggu ${countdown} detik...`; if (countdown <= 0) { clearInterval(interval); cdDiv.innerText = '✅ Anda siap memulai ujian'; if (cbox.checked) btn.disabled = false; } }, 1000);
      cbox.onchange = () => { if (cbox.checked && countdown <= 0) btn.disabled = false; else btn.disabled = true; };
      btn.onclick = () => {
        let soalConfig = prepareSoalConfig(bankSoal);
        examState = initExamState(currentUser, soalConfig);
        saveExamToLocal();
        renderPage('exam');
        startTimer();
        startAutoSave();
        activateStrictAntiCheat();
        document.documentElement.requestFullscreen().catch(e => showToast("Izinkan fullscreen manual"));
      };
    }
    else if (page === 'exam') {
      if (!examState) { renderPage('login'); return; }
      appContainer.innerHTML = `<div class="timer-floating" id="floatingTimer">01:00:00</div><div class="glass-premium" style="padding: 28px;"><div style="display:flex; justify-content:space-between;"><h3><i class="fas fa-scroll"></i> Ujian Kebudayaan DPBI</h3><div><i class="fas fa-shield-alt"></i> Pelanggaran: <span id="pelanggaranCounter">${examState.violations}</span>/3</div></div><div id="progressInfo" style="margin:20px 0;">Soal ke-<span id="currentSoalNum">1</span> / <span id="totalSoalNum">${examState.soalConfig.length}</span></div><div id="soalContainer"></div><div style="display:flex; gap:16px; margin:20px 0;"><button id="prevSoal" class="btn-outline-premium"><i class="fas fa-chevron-left"></i> Sebelumnya</button><button id="nextSoal" class="btn-outline-premium">Selanjutnya <i class="fas fa-chevron-right"></i></button></div><div id="navigasiSoal" style="display:flex; flex-wrap:wrap; gap:12px; margin:20px 0;"></div><div style="text-align:center;"><button id="submitExamFinal" class="btn-gold-premium" style="background:#2C3E66;">SELESAIKAN UJIAN</button></div></div><footer>DPBI — Integritas & Kejujuran</footer>`;
      function renderCurrent() {
        let qc = examState.soalConfig[currentQuestionIndex], soal = qc.original;
        document.getElementById('currentSoalNum').innerText = currentQuestionIndex+1;
        let html = `<div class="soal-card" style="background:white; border-radius:36px; padding:24px;"><h4>${escapeHtml(soal.pertanyaan)}</h4>`;
        if (soal.gambar && soal.gambar.trim()) html += `<div><img src="${soal.gambar}" style="max-width:100%; max-height:220px; border-radius:24px; margin:12px 0; cursor:pointer;" class="zoomable-img" data-src="${soal.gambar}"></div>`;
        html += `<div class="options-list">`;
        qc.shuffledOptions.forEach(opt => { html += `<div class="option-card ${qc.userAnswer===opt.letter?'selected':''}" data-letter="${opt.letter}">${opt.letter.toUpperCase()}. ${escapeHtml(opt.text)}</div>`; });
        html += `</div></div>`;
        document.getElementById('soalContainer').innerHTML = html;
        document.querySelectorAll('.option-card').forEach(el => { el.addEventListener('click', () => { let letter = el.dataset.letter; examState.soalConfig[currentQuestionIndex].userAnswer = letter; examState.answers[currentQuestionIndex] = letter; saveExamToLocal(); renderCurrent(); buildNavigasi(); }); });
        document.querySelectorAll('.zoomable-img').forEach(img => { img.addEventListener('click', () => { document.getElementById('modalImgSrc').src = img.dataset.src; document.getElementById('imageModal').style.visibility = 'visible'; document.getElementById('imageModal').style.opacity = 1; }); });
      }
      function buildNavigasi() {
        let nav = document.getElementById('navigasiSoal'); nav.innerHTML = '';
        for (let i=0; i<examState.soalConfig.length; i++) {
          let btn = document.createElement('div'); btn.className = 'soal-nav-pill'; if (examState.answers[i] !== null) btn.classList.add('answered'); if (i === currentQuestionIndex) btn.classList.add('active'); btn.innerText = i+1; btn.onclick = () => { currentQuestionIndex = i; renderCurrent(); buildNavigasi(); }; nav.appendChild(btn);
        }
      }
      renderCurrent(); buildNavigasi(); updateTimerDisplay();
      document.getElementById('prevSoal').onclick = () => { if (currentQuestionIndex>0) currentQuestionIndex--; renderCurrent(); buildNavigasi(); };
      document.getElementById('nextSoal').onclick = () => { if (currentQuestionIndex<examState.soalConfig.length-1) currentQuestionIndex++; renderCurrent(); buildNavigasi(); };
      document.getElementById('submitExamFinal').onclick = () => renderPage('review');
      setInterval(() => { document.getElementById('pelanggaranCounter').innerText = examState.violations; }, 500);
    }
    else if (page === 'review') {
      let total = examState.soalConfig.length, answered = examState.answers.filter(a=>a!==null).length;
      let rows = ''; for (let i=0; i<total; i++) rows += `<div class="glass-premium" style="padding:12px 18px; margin:8px 0;">Soal ${i+1} : ${examState.answers[i] ? '<i class="fas fa-check-circle" style="color:#22C55E;"></i> Terjawab' : '<i class="fas fa-times-circle" style="color:#DC2626;"></i> Belum Terjawab'}</div>`;
      appContainer.innerHTML = `<div class="glass-premium" style="max-width:800px; margin:0 auto; padding:36px;"><h2>Review Jawaban</h2><div style="max-height:350px; overflow:auto; margin:20px 0;">${rows}</div><p>Total Soal: ${total} | Sudah Dijawab: ${answered} | Belum: ${total-answered}</p><div style="display:flex; gap:16px; justify-content:center;"><button id="backToExam" class="btn-outline-premium">Kembali ke Soal</button><button id="toFinalConfirm" class="btn-gold-premium">Lanjutkan ke Konfirmasi</button></div></div>`;
      document.getElementById('backToExam').onclick = () => renderPage('exam');
      document.getElementById('toFinalConfirm').onclick = () => renderPage('finalConfirm');
    }
    else if (page === 'finalConfirm') {
      let total = examState.soalConfig.length, answered = examState.answers.filter(a=>a!==null).length;
      appContainer.innerHTML = `<div class="glass-premium" style="max-width:700px; margin:0 auto; padding:36px;"><h2>Konfirmasi Akhir</h2><p>Nama: ${escapeHtml(examState.nama)}<br>Nomor: ${escapeHtml(examState.nomorPeserta)}<br>Sekolah: ${escapeHtml(examState.sekolah)}<br>Jumlah Soal: ${total} | Dijawab: ${answered}<br>Pelanggaran: ${examState.violations}</p><label style="display:flex; gap:12px;"><input type="checkbox" id="finalCheck"> Saya yakin ingin mengumpulkan jawaban.</label><button id="finalSubmitBtn" class="btn-gold-premium" style="margin-top:20px;" disabled>KUMPULKAN JAWABAN</button></div>`;
      let chk = document.getElementById('finalCheck'), subBtn = document.getElementById('finalSubmitBtn');
      chk.onchange = () => subBtn.disabled = !chk.checked;
      subBtn.onclick = async () => await finalSubmit();
    }
    else if (page === 'selesai') {
      appContainer.innerHTML = `<div class="glass-premium" style="text-align:center; padding: 48px;"><i class="fas fa-award" style="font-size:80px; color:#D4AF37;"></i><h2 style="margin:24px 0 12px;">TERIMA KASIH</h2><p>Anda telah menyelesaikan Seleksi Duta Pelajar Berbudaya Indonesia.<br>Jawaban telah dikirim ke panitia.</p><div style="background:#F9F6EF; border-radius:28px; padding:20px; margin:20px 0;"><p><strong>${escapeHtml(examState?.nama || currentUser?.["Nama Lengkah"] || 'Peserta')}</strong><br>Status Pengiriman: Berhasil ✅</p><p>Bagikan pengalamanmu di Instagram Story dan mention <strong>@dutapelajarberbudaya</strong></p><a href="https://instagram.com/dutapelajarberbudaya" target="_blank" class="btn-gold-premium" style="display:inline-block; margin-top:12px;"><i class="fab fa-instagram"></i> Buka Instagram</a></div><button id="homeBtn" class="btn-outline-premium">Kembali ke Beranda</button></div>`;
      document.getElementById('homeBtn').onclick = () => window.location.reload();
      for (let i=0;i<60;i++) { let c=document.createElement('div'); c.style.cssText=`position:fixed; width:10px; height:10px; background:#D4AF37; left:${Math.random()*100}%; top:-10px; border-radius:50%; pointer-events:none; z-index:9999; opacity:0.7;`; document.body.appendChild(c); c.animate([{transform:'translateY(0)', opacity:0.8},{transform:`translateY(${window.innerHeight+100}px)`, opacity:0}], {duration:2000}); setTimeout(()=>c.remove(),2100); }
    }
  }
  
  // Initial Load
  (async () => {
    const progressFill = document.getElementById('loadProgressFill'), percentSpan = document.getElementById('loadPercent'), statusSpan = document.getElementById('loadStatus'), retryBtn = document.getElementById('retryLoad');
    try {
      progressFill.style.width = "30%"; percentSpan.innerText = "30%"; statusSpan.innerText = "Memuat database nasional...";
      await loadPeserta();
      progressFill.style.width = "65%"; percentSpan.innerText = "65%"; statusSpan.innerText = "Mengunduh bank soal...";
      await loadSoal();
      progressFill.style.width = "100%"; percentSpan.innerText = "100%"; statusSpan.innerText = "Sistem siap digunakan.";
      setTimeout(() => { document.getElementById('loadingScreen').style.display = 'none'; document.getElementById('mainApp').style.display = 'block'; renderPage('login'); }, 500);
    } catch (err) {
      progressFill.style.width = "100%"; percentSpan.innerText = "Gagal"; statusSpan.innerHTML = `<span style="color:#b91c1c;">⚠️ ${err.message}<br>Pastikan koneksi internet dan sumber data tersedia.</span>`;
      retryBtn.style.display = "inline-block"; retryBtn.onclick = () => window.location.reload();
    }
  })();
  document.getElementById('closeModalBtn')?.addEventListener('click', () => { let m = document.getElementById('imageModal'); m.style.visibility = 'hidden'; m.style.opacity = 0; });
  window.addEventListener('load', () => { if (restoreExam() && examState && !getCompletedTokens().includes(examState.token)) { renderPage('exam'); startTimer(); startAutoSave(); activateStrictAntiCheat(); document.documentElement.requestFullscreen(); } });
</script>
</body>
</html>
