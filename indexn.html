<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>DPBI 2026 | Seleksi Nasional Duta Pelajar Berbudaya</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background: linear-gradient(135deg, #FDFBF7 0%, #F6F3EC 100%);
      min-height: 100vh;
      position: relative;
      overflow-x: hidden;
    }

    /* Luxury Ornamental Glow */
    .premium-bg {
      position: fixed;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 0;
    }
    .premium-bg .glow-1 {
      position: absolute;
      top: -15%;
      left: -10%;
      width: 70%;
      height: 70%;
      background: radial-gradient(circle, rgba(212,175,55,0.12) 0%, rgba(255,255,240,0) 70%);
      border-radius: 50%;
    }
    .premium-bg .glow-2 {
      position: absolute;
      bottom: -15%;
      right: -10%;
      width: 65%;
      height: 65%;
      background: radial-gradient(circle, rgba(201,162,39,0.08) 0%, rgba(255,250,235,0) 70%);
      border-radius: 50%;
    }
    .premium-bg .gold-dust {
      position: absolute;
      top: 20%;
      right: 5%;
      width: 300px;
      height: 300px;
      background: radial-gradient(circle, #F4D35E 0%, rgba(244,211,94,0) 70%);
      filter: blur(80px);
      opacity: 0.2;
    }

    .app-container {
      position: relative;
      z-index: 10;
      max-width: 1440px;
      margin: 0 auto;
      padding: 28px 36px;
    }

    /* Glassmorphism Premium */
    .glass-premium {
      background: rgba(255, 255, 255, 0.82);
      backdrop-filter: blur(18px);
      border-radius: 32px;
      box-shadow: 0 20px 40px -14px rgba(0, 0, 0, 0.08), 0 1px 1px rgba(255, 255, 255, 0.6);
      border: 1px solid rgba(212, 175, 55, 0.25);
      transition: all 0.3s cubic-bezier(0.2, 0.9, 0.4, 1.1);
    }

    .glass-premium:hover {
      box-shadow: 0 25px 45px -12px rgba(201, 162, 39, 0.2);
      border-color: rgba(212, 175, 55, 0.45);
    }

    /* Gold Button */
    .btn-gold {
      background: linear-gradient(105deg, #C9A227 0%, #D4AF37 45%, #F4D35E 100%);
      border: none;
      padding: 14px 32px;
      font-weight: 700;
      border-radius: 48px;
      color: white;
      transition: all 0.25s ease;
      box-shadow: 0 12px 24px -10px rgba(201, 162, 39, 0.4);
      cursor: pointer;
      font-size: 1rem;
      letter-spacing: 0.5px;
    }
    .btn-gold:hover {
      transform: translateY(-2px);
      box-shadow: 0 20px 30px -8px rgba(201, 162, 39, 0.6);
      background: linear-gradient(105deg, #B48C1A, #D4AF37, #F0D26A);
    }
    .btn-outline-gold {
      background: transparent;
      border: 2px solid #D4AF37;
      color: #B48C1A;
      padding: 12px 28px;
      border-radius: 48px;
      font-weight: 600;
      cursor: pointer;
      transition: 0.2s;
    }
    .btn-outline-gold:hover {
      background: rgba(212, 175, 55, 0.1);
      transform: translateY(-2px);
    }

    /* Input Premium */
    .input-luxury {
      border: 1.5px solid rgba(212, 175, 55, 0.4);
      border-radius: 60px;
      padding: 14px 24px;
      font-size: 1rem;
      width: 100%;
      background: rgba(255, 255, 255, 0.95);
      transition: 0.2s;
      font-family: 'Plus Jakarta Sans', sans-serif;
    }
    .input-luxury:focus {
      outline: none;
      border-color: #D4AF37;
      box-shadow: 0 0 0 4px rgba(212, 175, 55, 0.2);
    }

    /* Timer Pill */
    .timer-pill {
      position: fixed;
      top: 24px;
      right: 36px;
      background: rgba(0, 0, 0, 0.75);
      backdrop-filter: blur(12px);
      padding: 10px 24px;
      border-radius: 60px;
      color: #FFDF8C;
      font-weight: 800;
      font-size: 1.3rem;
      z-index: 200;
      font-family: monospace;
      border: 1px solid #D4AF37;
      box-shadow: 0 8px 20px rgba(0,0,0,0.2);
      letter-spacing: 2px;
    }

    /* Option Card */
    .option-card {
      background: #FEFCF8;
      border-radius: 24px;
      padding: 16px 24px;
      margin: 14px 0;
      cursor: pointer;
      border: 1px solid #EFE6D6;
      transition: all 0.2s;
      font-weight: 500;
    }
    .option-card.selected {
      border: 2px solid #D4AF37;
      background: linear-gradient(120deg, #FFF9EC, #FFF4E0);
      box-shadow: 0 8px 20px rgba(201, 162, 39, 0.2);
    }

    .nav-pill {
      background: #F2F0EA;
      border-radius: 40px;
      padding: 10px 0;
      font-weight: 700;
      text-align: center;
      cursor: pointer;
      min-width: 52px;
      transition: 0.15s;
    }
    .nav-pill.answered { background: #D4AF37; color: white; box-shadow: 0 4px 12px rgba(212,175,55,0.4); }
    .nav-pill.active { border: 2px solid #C9A227; background: #FFF2CC; color: #A67C1E; transform: scale(1.02); }

    .progress-gold {
      height: 8px;
      background: #E9E4D4;
      border-radius: 20px;
      overflow: hidden;
    }
    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, #C9A227, #F4D35E);
      width: 0%;
      transition: width 0.3s;
    }

    .toast-luxury {
      position: fixed;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%) scale(0.9);
      background: rgba(30, 41, 59, 0.95);
      backdrop-filter: blur(12px);
      color: white;
      padding: 12px 28px;
      border-radius: 80px;
      font-weight: 600;
      z-index: 3000;
      opacity: 0;
      transition: 0.2s;
      pointer-events: none;
      font-size: 0.9rem;
      letter-spacing: 0.3px;
    }
    .toast-luxury.show { opacity: 1; transform: translateX(-50%) scale(1); }

    footer {
      text-align: center;
      margin-top: 60px;
      padding: 28px 0 20px;
      font-size: 0.75rem;
      color: #8B7A5C;
      border-top: 1px solid rgba(212,175,55,0.2);
      background: rgba(255,255,245,0.7);
      backdrop-filter: blur(5px);
      border-radius: 40px 40px 0 0;
    }

    @media (max-width: 768px) {
      .app-container { padding: 16px; }
      .timer-pill { top: 12px; right: 16px; padding: 6px 16px; font-size: 1rem; }
    }
  </style>
</head>
<body>
<div class="premium-bg">
  <div class="glow-1"></div>
  <div class="glow-2"></div>
  <div class="gold-dust"></div>
</div>

<div id="loadingScreen" style="position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(255,252,240,0.98); backdrop-filter:blur(25px); z-index:5000; display:flex; align-items:center; justify-content:center; flex-direction:column;">
  <div style="text-align:center;">
    <img src="https://cdn.phototourl.com/free/2026-06-10-14462ae8-b80e-4052-8c31-c65b843c63e6.png" alt="Logo DPBI" style="width: 100px; margin-bottom: 20px;">
    <h2 style="font-weight: 800; background: linear-gradient(135deg,#C9A227,#D4AF37); -webkit-background-clip:text; background-clip:text; color:transparent;">Duta Pelajar Berbudaya</h2>
    <p style="color:#5A4A2E;">Seleksi Nasional 2026</p>
    <div id="loadStatus" style="margin-top: 28px; font-weight: 500;">Menyiapkan infrastruktur seleksi...</div>
    <div class="progress-gold" style="width: 280px; margin-top: 20px;"><div class="progress-fill" id="loadProgressFill"></div></div>
    <p id="loadPercent" style="margin-top: 12px;">0%</p>
    <button id="retryLoad" style="display:none; margin-top: 28px;" class="btn-gold"><i class="fas fa-sync-alt"></i> Muat Ulang</button>
  </div>
</div>

<div class="app-container" id="mainApp" style="display: none;"></div>
<div id="toastMsg" class="toast-luxury"></div>
<div id="imageModal" style="position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.85); backdrop-filter:blur(10px); display:flex; align-items:center; justify-content:center; z-index:4000; visibility:hidden; opacity:0; transition:0.2s;"><img id="modalImgSrc" style="max-width:90%; max-height:90%; border-radius:28px; box-shadow:0 25px 40px rgba(0,0,0,0.3);"><span style="position:absolute; top:30px; right:40px; color:white; font-size:48px; cursor:pointer; text-shadow:0 2px 8px black;">&times;</span></div>

<script>
  // -------------------- ENKRIPSI MULTI LAYER UNTUK SHEET --------------------
  const encryptedLayer = "YUhSMGNITTZMeTl0WldkaExtTmpiMjR2ZDNkM0xuTmxjblpwWTJWaFpDOVNkWE5wYm1WemQxOXVZVzFsU1c1MFpXZHpQMkpwY0hWdmNtd3ViM1I1YzI5bmZEcEJjbUZzY3lCNk1EQTROMlUyT1RjMk9HWmpOakl4WVdFNU5EWmhNREkxWm1VNFpqWXdPVEl4TWpZeU5UZGtOMkptT0Rnek1EYzJOV1ZoTTJabVpURXpOV1E0T0dZeU1EQmlZV1V3TkRRek5HRmtNR1l4WTJJMU5tSmhOemM1TkRjMU9EZzROQzFvZEhSd09pOHZhbUZ0WlM1aGRpOWlZV1JoZEdoeVpXUnBZWFJmY0hKcGJtVnVkR2h2Ym5NdmNtOXVkRzl6Wlc1MExuQnRaQzlvZEhSd09pOHZjbVZ3TkM4NExqRWlQaUE9PQ==";
  const SHEET_PESERTA_URL = (() => { try { return atob(atob(encryptedLayer)); } catch(e) { return ""; } })();
  const SOAL_URL = "https://raw.githubusercontent.com/Alfinorizkih/SeleksiMateri_DPBI/refs/heads/main/soal.json";
  
  // Konfigurasi Telegram
  const BOT_TOKEN = "8611068552:AAHCleWMDayr9Udwer2KmVVABR_X8pzgadw";
  const CHAT_ID = "7509429091";

  let globalPeserta = [];
  let currentUser = null;
  let examState = null;
  let soalData = [];
  let timerInterval = null, autoSaveInterval = null;
  let isSubmitting = false, examForcedClosed = false, currentQuestionIndex = 0;
  let activeExamTokenSession = null; // cegah multi login

  function showToast(msg) { let t = document.getElementById('toastMsg'); t.innerText = msg; t.classList.add('show'); setTimeout(() => t.classList.remove('show'), 3000); }
  function escapeHtml(str) { if (!str) return ''; return str.replace(/[&<>]/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[m])); }

  async function fetchWithCors(url) {
    const proxyList = [
      `https://api.allorigins.win/raw?url=${encodeURIComponent(url)}`,
      `https://corsproxy.io/?${encodeURIComponent(url)}`
    ];
    for (let proxy of proxyList) {
      try { let r = await fetch(proxy); if (r.ok) return await r.text(); } catch(e) {}
    }
    throw new Error("Gagal akses data nasional. Periksa koneksi.");
  }

  async function loadPesertaFromSheet() {
    let csv = await fetchWithCors(SHEET_PESERTA_URL);
    const lines = csv.split(/\r?\n/).filter(l => l.trim());
    if (lines.length < 2) throw new Error("Data peserta kosong.");
    const headers = lines[0].split(',').map(h => h.trim().replace(/^\uFEFF/, ''));
    let rows = [];
    for (let i=1; i<lines.length; i++) {
      let vals = lines[i].split(',');
      let obj = {};
      headers.forEach((h, idx) => { obj[h] = vals[idx] ? vals[idx].trim() : ""; });
      rows.push(obj);
    }
    return rows.map(p => ({ ...p, Status: p.Status || "BELUM" }));
  }

  async function loadSoalFromGithub() {
    let resp = await fetch(SOAL_URL);
    if (!resp.ok) throw new Error("Gagal mengambil paket soal nasional.");
    let soal = await resp.json();
    if (!soal.length) throw new Error("Soal tidak ditemukan.");
    return soal;
  }

  // Helper acak array
  function shuffleArray(arr) { for (let i = arr.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [arr[i], arr[j]] = [arr[j], arr[i]]; } return arr; }

  function prepareExamConfig(soals) {
    let shuffledSoal = shuffleArray([...soals]);
    return shuffledSoal.map(soal => {
      let shuffledOptions = [];
      let correctKey = "";
      if (soal.jenis === "Pilihan Ganda") {
        let choices = Object.entries(soal.pilihan || {}).map(([letter, text]) => ({ letter, text }));
        let shuffled = shuffleArray([...choices]);
        let correctText = soal.pilihan[soal.jawaban];
        let newCorrect = shuffled.find(opt => opt.text === correctText)?.letter || "A";
        shuffledOptions = shuffled;
        correctKey = newCorrect;
      } else {
        let bs = [{letter:"Benar",text:"Benar"},{letter:"Salah",text:"Salah"}];
        shuffledOptions = shuffleArray([...bs]);
        correctKey = (soal.jawaban === "Benar") ? "Benar" : "Salah";
      }
      return { original: soal, shuffledOptions, correctAnswerKey: correctKey, userAnswer: null };
    });
  }

  function initExam(participant, soalConfig) {
    return {
      token: participant.Token,
      nama: participant["Nama Lengkap"],
      sekolah: participant["Asal Sekolah"],
      soalConfig: soalConfig,
      answers: new Array(soalConfig.length).fill(null),
      remainingSeconds: 60 * 60,
      violations: 0,
      startTime: Date.now(),
    };
  }

  function saveExamLocal() { localStorage.setItem('dpbi_exam_state', JSON.stringify(examState)); }
  function restoreExamLocal() {
    let saved = localStorage.getItem('dpbi_exam_state');
    if (!saved) return false;
    try {
      let parsed = JSON.parse(saved);
      if (parsed && !getCompletedTokens().includes(parsed.token)) {
        examState = parsed;
        currentUser = globalPeserta.find(p => p.Token === parsed.token) || { "Nama Lengkap": parsed.nama, "Asal Sekolah": parsed.sekolah, Token: parsed.token };
        return true;
      }
    } catch(e) {}
    return false;
  }

  function getCompletedTokens() { return JSON.parse(localStorage.getItem('dpbi_completed_tokens') || '[]'); }
  function addCompletedToken(token) { let a = getCompletedTokens(); if (!a.includes(token)) a.push(token); localStorage.setItem('dpbi_completed_tokens', JSON.stringify(a)); }

  function validateLogin(nama, sekolah, token) {
    let peserta = globalPeserta.find(p => p["Nama Lengkap"]?.toLowerCase().trim() === nama.toLowerCase().trim() && p["Asal Sekolah"]?.toLowerCase().trim() === sekolah.toLowerCase().trim() && p["Token"] === token);
    if (!peserta) return { success: false, msg: "Nama, sekolah atau token tidak sesuai." };
    if (peserta.Status !== "BELUM") return { success: false, msg: "Akun sudah menyelesaikan seleksi." };
    if (getCompletedTokens().includes(token)) return { success: false, msg: "Token sudah digunakan." };
    let now = new Date(), start = new Date(peserta["Waktu Mulai Token"]), end = new Date(peserta["Waktu Selesai Token"]);
    if (isNaN(start) || isNaN(end)) return { success: false, msg: "Periode token invalid." };
    if (now < start || now > end) return { success: false, msg: "Token hanya berlaku pada jadwal yang ditentukan." };
    return { success: true, pesertaData: peserta };
  }

  async function sendTelegramResult(nama, sekolah, nilai, pelanggaran) {
    let msg = `🏆 *HASIL SELEKSI DPBI 2026* 🏆\n👤 *Nama:* ${nama}\n🏫 *Sekolah:* ${sekolah}\n📊 *Nilai Akhir:* ${nilai.toFixed(2)}%\n⚠️ *Pelanggaran:* ${pelanggaran}\n✅ *Status:* Selesai\n🕒 *Waktu:* ${new Date().toLocaleString()}`;
    try { await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ chat_id: CHAT_ID, text: msg, parse_mode: 'Markdown' }) }); } catch(e) { console.warn(e); }
  }

  // ANTI CHEAT TOTAL
  let antiCheatActive = false;
  function activateSuperSecure() {
    if (!examState || antiCheatActive) return;
    antiCheatActive = true;
    const forceEnd = (reason) => { if (!isSubmitting && !examForcedClosed) forceSubmit(reason); };
    document.addEventListener('visibilitychange', () => { if (document.hidden && examState && !isSubmitting && !examForcedClosed) forceSubmit("❌ PELANGGARAN: Berpindah tab/window. Ujian ditutup."); });
    window.addEventListener('blur', () => { if (examState && !isSubmitting && !examForcedClosed) forceSubmit("⚠️ PELANGGARAN: Keluar dari jendela ujian."); });
    document.addEventListener('fullscreenchange', () => { if (!document.fullscreenElement && examState && !isSubmitting && !examForcedClosed) forceSubmit("Keluar dari fullscreen, ujian diakhiri."); });
    window.addEventListener('keydown', (e) => {
      if (e.key === 'F12' || (e.ctrlKey && e.shiftKey && (e.key === 'I' || e.key === 'i')) || (e.ctrlKey && e.key === 'u') || (e.ctrlKey && e.key === 'p') || (e.ctrlKey && e.key === 'c') || (e.ctrlKey && e.key === 'v') || (e.ctrlKey && e.key === 's') || (e.metaKey && e.key === 'p')) {
        e.preventDefault();
        if (examState && !isSubmitting && !examForcedClosed) { examState.violations++; saveExamLocal(); if (examState.violations >= 3) forceSubmit("Batas maksimal pelanggaran (3) tercapai."); else showToast(`Pelanggaran ke-${examState.violations}`); }
      }
    });
    document.addEventListener('contextmenu', e => e.preventDefault());
    document.addEventListener('copy', e => e.preventDefault());
    document.addEventListener('cut', e => e.preventDefault());
    document.addEventListener('paste', e => e.preventDefault());
  }

  async function forceSubmit(reason) {
    if (isSubmitting || examForcedClosed) return;
    examForcedClosed = true;
    clearInterval(timerInterval); clearInterval(autoSaveInterval);
    isSubmitting = true;
    showToast(reason);
    let totalBobot = 0, totalBenar = 0;
    for (let qc of examState.soalConfig) { let bobot = parseInt(qc.original.bobot) || 1; totalBobot += bobot; if (qc.userAnswer === qc.correctAnswerKey) totalBenar += bobot; }
    let nilai = totalBobot === 0 ? 0 : (totalBenar / totalBobot) * 100;
    await sendTelegramResult(examState.nama, examState.sekolah, nilai, examState.violations);
    addCompletedToken(examState.token);
    localStorage.removeItem('dpbi_exam_state');
    renderPage('selesai', { forced: true });
  }

  async function finalSubmit() {
    if (isSubmitting) return;
    isSubmitting = true;
    clearInterval(timerInterval); clearInterval(autoSaveInterval);
    let totalBobot = 0, totalBenar = 0;
    for (let qc of examState.soalConfig) { let bobot = parseInt(qc.original.bobot) || 1; totalBobot += bobot; if (qc.userAnswer === qc.correctAnswerKey) totalBenar += bobot; }
    let nilai = totalBobot === 0 ? 0 : (totalBenar / totalBobot) * 100;
    await sendTelegramResult(examState.nama, examState.sekolah, nilai, examState.violations);
    addCompletedToken(examState.token);
    localStorage.removeItem('dpbi_exam_state');
    renderPage('selesai', { forced: false });
  }

  function updateTimerDisplay() { if (examState && document.getElementById('floatingTimer')) { let s = examState.remainingSeconds, h = Math.floor(s/3600), m = Math.floor((s%3600)/60), sec = s%60; document.getElementById('floatingTimer').innerText = `${h.toString().padStart(2,'0')}:${m.toString().padStart(2,'0')}:${sec.toString().padStart(2,'0')}`; } }
  function startTimer() { if (timerInterval) clearInterval(timerInterval); timerInterval = setInterval(() => { if (!examState || examState.remainingSeconds <= 0) { if (examState && examState.remainingSeconds <= 0 && !isSubmitting) forceSubmit("⏰ Waktu habis!"); clearInterval(timerInterval); return; } examState.remainingSeconds--; updateTimerDisplay(); saveExamLocal(); if (examState.remainingSeconds === 0) forceSubmit("Waktu seleksi selesai."); }, 1000); }
  function startAutoSave() { if (autoSaveInterval) clearInterval(autoSaveInterval); autoSaveInterval = setInterval(() => { if (examState && !isSubmitting) saveExamLocal(); }, 800); }

  // Render engine
  function renderPage(page, params = {}) {
    const container = document.getElementById('mainApp');
    if (!container) return;
    if (page === 'login') {
      container.innerHTML = `
        <div class="glass-premium" style="max-width: 620px; margin: 5vh auto; padding: 48px; text-align:center;">
          <img src="https://cdn.phototourl.com/free/2026-06-10-14462ae8-b80e-4052-8c31-c65b843c63e6.png" style="width: 80px;">
          <h1 style="font-weight:800; margin-top: 18px; background: linear-gradient(135deg,#C9A227,#D4AF37); -webkit-background-clip:text; background-clip:text; color:transparent;">DPBI 2026</h1>
          <p style="color:#5D4A2E;">Portal Resmi Seleksi Nasional</p>
          <form id="loginForm" style="margin-top: 32px;">
            <input type="text" id="namaLogin" class="input-luxury" placeholder="Nama Lengkap (sesuai database)" autocomplete="off"><br><br>
            <input type="text" id="sekolahLogin" class="input-luxury" placeholder="Asal Sekolah" autocomplete="off"><br><br>
            <input type="text" id="tokenLogin" class="input-luxury" placeholder="Token Seleksi" autocomplete="off"><br><br>
            <button type="submit" class="btn-gold" style="width:100%;"><i class="fas fa-arrow-right-to-bracket"></i> MASUK SELEKSI</button>
          </form>
        </div>
        <footer>© 2026 Duta Pelajar Berbudaya Indonesia · Seleksi Nasional Berintegritas</footer>
      `;
      document.getElementById('loginForm')?.addEventListener('submit', async (e) => {
        e.preventDefault();
        let nama = document.getElementById('namaLogin').value.trim(), sekolah = document.getElementById('sekolahLogin').value.trim(), token = document.getElementById('tokenLogin').value.trim();
        let res = validateLogin(nama, sekolah, token);
        if (!res.success) { showToast(res.msg); return; }
        currentUser = res.pesertaData;
        renderPage('dashboard');
      });
    }
    else if (page === 'dashboard') {
      let nomorPeserta = 'DPBI' + Math.floor(Math.random() * 9000 + 1000);
      container.innerHTML = `
        <div class="glass-premium" style="max-width: 960px; margin: 20px auto; padding: 36px;">
          <div style="display:flex; justify-content:space-between; align-items:center;"><img src="https://cdn.phototourl.com/free/2026-06-10-14462ae8-b80e-4052-8c31-c65b843c63e6.png" style="height:48px;"><div><i class="fas fa-crown" style="color:#D4AF37;"></i> <span style="font-weight:700;">Halo, ${escapeHtml(currentUser["Nama Lengkap"])}</span></div></div>
          <div style="background: linear-gradient(145deg,#FFFBF0,#FFF7E8); border-radius: 32px; padding: 28px; margin: 28px 0;">
            <h3><i class="fas fa-id-card"></i> Kartu Identitas Peserta</h3>
            <div style="display:grid; grid-template-columns:1fr 1fr; gap:16px; margin-top:20px;"><div><strong>Nama</strong><br>${escapeHtml(currentUser["Nama Lengkap"])}</div><div><strong>Sekolah</strong><br>${escapeHtml(currentUser["Asal Sekolah"])}</div><div><strong>Token</strong><br>${currentUser.Token}</div><div><strong>No Peserta</strong><br>${nomorPeserta}</div><div><strong>Periode Token</strong><br>${currentUser["Waktu Mulai Token"]} s/d ${currentUser["Waktu Selesai Token"]}</div><div><strong>Status</strong><br><span style="color:#22C55E;">Aktif / BELUM</span></div></div>
          </div>
          <div class="progress-gold" style="margin:20px 0;"><div class="progress-fill" style="width:0%"></div></div>
          <button id="toConfirmDashboard" class="btn-gold"><i class="fas fa-forward"></i> LANJUT KE KONFIRMASI</button>
        </div>
      `;
      document.getElementById('toConfirmDashboard')?.addEventListener('click', () => renderPage('confirm'));
    }
    else if (page === 'confirm') {
      let nomor = 'DPBI' + Math.floor(Math.random()*9000+1000);
      container.innerHTML = `<div class="glass-premium" style="max-width:800px; margin:auto; padding:36px;"><h2>Konfirmasi Data</h2><div style="margin:24px 0;"><p>Nama: ${escapeHtml(currentUser["Nama Lengkap"])}<br>Sekolah: ${escapeHtml(currentUser["Asal Sekolah"])}<br>Token: ${currentUser.Token}<br>Nomor Peserta: ${nomor}</p><hr style="margin:20px 0;"><p><strong>Jumlah Soal:</strong> ${soalData.length}<br><strong>Durasi:</strong> 60 menit<br>Sistem anti kecurangan aktif (fullscreen, blokir tab).</p></div><label><input type="checkbox" id="confCb"> Saya memastikan data sudah benar.</label><br><button id="confirmNextBtn" class="btn-gold" style="margin-top:28px;" disabled>LANJUTKAN</button></div>`;
      let cb = document.getElementById('confCb'), btn = document.getElementById('confirmNextBtn');
      cb.onchange = () => btn.disabled = !cb.checked;
      btn.onclick = () => renderPage('rules');
    }
    else if (page === 'rules') {
      container.innerHTML = `<div class="glass-premium" style="max-width:1000px; margin:auto; padding:36px;"><h2><i class="fas fa-gavel"></i> Peraturan Seleksi DPBI</h2><div style="max-height:450px; overflow:auto; margin:24px 0; padding-right:12px;"><p>⚠️ <strong>Ketentuan Wajib:</strong><br>1. Wajib Fullscreen selama ujian, keluar fullscreen = ujian otomatis berakhir.<br>2. Dilarang membuka tab baru / aplikasi lain.<br>3. Maksimal pelanggaran 3x.<br>4. Jawaban tersimpan otomatis.<br>5. Dilarang copy-paste, screenshot, atau menggunakan AI.<br>6. Dengan melanjutkan, Anda setuju seluruh peraturan.</p></div><label><input type="checkbox" id="ruleCb"> Saya membaca dan mematuhi peraturan.</label><div id="countdownRule" style="background:#F2EFE6; border-radius:60px; padding:12px; margin:20px 0; text-align:center;">⏳ Mohon tunggu 10 detik</div><button id="startExamFinalBtn" class="btn-gold" disabled>MULAI SELEKSI</button></div>`;
      let count = 10, interval = setInterval(() => { count--; document.getElementById('countdownRule').innerText = `⏳ Tunggu ${count} detik...`; if (count <=0) { clearInterval(interval); document.getElementById('countdownRule').innerText = '✅ Siap memulai ujian'; let cb = document.getElementById('ruleCb'); let startBtn = document.getElementById('startExamFinalBtn'); if (cb.checked) startBtn.disabled = false; } }, 1000);
      document.getElementById('ruleCb').onchange = function() { if (this.checked && count<=0) document.getElementById('startExamFinalBtn').disabled = false; else document.getElementById('startExamFinalBtn').disabled = true; };
      document.getElementById('startExamFinalBtn').onclick = () => {
        let configSoal = prepareExamConfig(soalData);
        examState = initExam(currentUser, configSoal);
        saveExamLocal();
        renderPage('exam');
        startTimer(); startAutoSave();
        activateSuperSecure();
        document.documentElement.requestFullscreen().catch(()=>showToast("Izinkan fullscreen untuk melanjutkan"));
      };
    }
    else if (page === 'exam') {
      container.innerHTML = `<div class="timer-pill" id="floatingTimer">01:00:00</div><div class="glass-premium" style="padding:28px;"><div style="display:flex; justify-content:space-between;"><h3>Ujian Kebudayaan</h3><span>Pelanggaran: <span id="violationCount">0</span>/3</span></div><div id="progressText" style="margin:16px 0;">Soal <span id="currentIdx">1</span> / <span id="totalSoalLen">${examState.soalConfig.length}</span></div><div id="soalArea"></div><div style="display:flex; gap:16px; margin:24px 0;"><button id="prevSoalBtn" class="btn-outline-gold">◀ Sebelumnya</button><button id="nextSoalBtn" class="btn-outline-gold">Selanjutnya ▶</button></div><div id="navGrid" style="display:flex; flex-wrap:wrap; gap:12px; margin:20px 0;"></div><button id="submitFinalExam" class="btn-gold" style="background:#2C3E66;">SELESAIKAN UJIAN</button></div>`;
      document.getElementById('violationCount').innerText = examState.violations;
      updateTimerDisplay();
      function renderCurrent() {
        let qc = examState.soalConfig[currentQuestionIndex];
        let soal = qc.original;
        let html = `<div class="soal-card" style="background:white; border-radius:28px; padding:24px;"><h4>${escapeHtml(soal.pertanyaan)}</h4>`;
        if (soal.gambar && soal.gambar.trim()) html += `<div style="margin:16px 0;"><img src="${soal.gambar}" style="max-width:100%; max-height:220px; border-radius:20px; cursor:pointer;" class="imgZoomable" data-src="${soal.gambar}"></div>`;
        html += `<div>`;
        qc.shuffledOptions.forEach(opt => { html += `<div class="option-card ${qc.userAnswer===opt.letter ? 'selected' : ''}" data-val="${opt.letter}">${opt.letter.toUpperCase()}. ${escapeHtml(opt.text)}</div>`; });
        html += `</div></div>`;
        document.getElementById('soalArea').innerHTML = html;
        document.querySelectorAll('.option-card').forEach(el => { el.addEventListener('click', (e) => { let letter = el.dataset.val; examState.soalConfig[currentQuestionIndex].userAnswer = letter; examState.answers[currentQuestionIndex] = letter; saveExamLocal(); renderCurrent(); buildNav(); }); });
        document.querySelectorAll('.imgZoomable').forEach(img => { img.addEventListener('click', () => { document.getElementById('modalImgSrc').src = img.dataset.src; document.getElementById('imageModal').style.visibility = 'visible'; document.getElementById('imageModal').style.opacity = 1; }); });
        document.getElementById('currentIdx').innerText = currentQuestionIndex+1;
      }
      function buildNav() {
        let nav = document.getElementById('navGrid'); nav.innerHTML = '';
        for (let i=0;i<examState.soalConfig.length;i++) {
          let pill = document.createElement('div'); pill.className = 'nav-pill'; if (examState.answers[i] !== null) pill.classList.add('answered'); if (i===currentQuestionIndex) pill.classList.add('active'); pill.innerText = i+1; pill.onclick = () => { currentQuestionIndex = i; renderCurrent(); buildNav(); }; nav.appendChild(pill);
        }
      }
      renderCurrent(); buildNav();
      document.getElementById('prevSoalBtn').onclick = () => { if (currentQuestionIndex > 0) { currentQuestionIndex--; renderCurrent(); buildNav(); } };
      document.getElementById('nextSoalBtn').onclick = () => { if (currentQuestionIndex < examState.soalConfig.length-1) { currentQuestionIndex++; renderCurrent(); buildNav(); } };
      document.getElementById('submitFinalExam').onclick = () => renderPage('review');
    }
    else if (page === 'review') {
      let total = examState.soalConfig.length, answered = examState.answers.filter(a=>a!==null).length;
      let rows = ''; for(let i=0;i<total;i++) rows += `<div style="padding:8px; border-bottom:1px solid #EFE6D6;">Soal ${i+1} : ${examState.answers[i] ? '<i class="fas fa-check-circle" style="color:#22C55E;"></i> Terjawab' : '<i class="fas fa-times-circle" style="color:#DC2626;"></i> Belum'}</div>`;
      container.innerHTML = `<div class="glass-premium" style="max-width:800px; margin:auto; padding:36px;"><h2>Review Jawaban</h2><div style="max-height:300px; overflow:auto; margin:20px 0;">${rows}</div><p>Total: ${total} | Terjawab: ${answered} | Belum: ${total-answered}</p><div style="display:flex; gap:16px;"><button id="backToExamReview" class="btn-outline-gold">Kembali ke Soal</button><button id="toConfirmFinal" class="btn-gold">Lanjut Konfirmasi</button></div></div>`;
      document.getElementById('backToExamReview').onclick = () => renderPage('exam');
      document.getElementById('toConfirmFinal').onclick = () => renderPage('finalConfirm');
    }
    else if (page === 'finalConfirm') {
      let answered = examState.answers.filter(a=>a!==null).length;
      container.innerHTML = `<div class="glass-premium" style="max-width:700px; margin:auto; padding:36px;"><h2>Konfirmasi Akhir</h2><p>Nama: ${escapeHtml(examState.nama)}<br>Sekolah: ${escapeHtml(examState.sekolah)}<br>Jumlah Soal: ${examState.soalConfig.length} | Dijawab: ${answered}<br>Pelanggaran: ${examState.violations}</p><label><input type="checkbox" id="finalConfirmCb"> Saya yakin ingin mengumpulkan jawaban.</label><br><button id="finalSubmitAction" class="btn-gold" style="margin-top:28px;" disabled>KUMPULKAN JAWABAN</button></div>`;
      let cb = document.getElementById('finalConfirmCb'), btn = document.getElementById('finalSubmitAction');
      cb.onchange = () => btn.disabled = !cb.checked;
      btn.onclick = () => finalSubmit();
    }
    else if (page === 'selesai') {
      container.innerHTML = `<div class="glass-premium" style="text-align:center; padding:56px; max-width:700px; margin:auto;"><i class="fas fa-award" style="font-size:80px; color:#D4AF37;"></i><h2 style="margin:20px 0;">TERIMA KASIH</h2><p>Anda telah menyelesaikan Seleksi Duta Pelajar Berbudaya Indonesia 2026.<br>Jawaban telah dikirim ke panitia.</p><div style="background:#F9F6EF; border-radius:28px; padding:24px; margin:28px 0;"><p><strong>${escapeHtml(examState?.nama || currentUser?.["Nama Lengkap"])}</strong><br>Status: Berhasil Terkirim ✅</p><p>Bagikan pengalamanmu di Instagram Story dan mention <strong>@dutapelajarberbudaya</strong></p><a href="https://instagram.com/dutapelajarberbudaya" target="_blank" class="btn-gold" style="display:inline-block;">📱 Buka Instagram</a></div><button id="homeReset" class="btn-outline-gold">Kembali ke Beranda</button></div>`;
      document.getElementById('homeReset').onclick = () => window.location.reload();
      for (let i=0;i<60;i++){ let c=document.createElement('div'); c.style.cssText=`position:fixed; width:10px; height:10px; background:#D4AF37; left:${Math.random()*100}%; top:-10px; border-radius:50%; pointer-events:none;`; document.body.appendChild(c); c.animate([{transform:'translateY(0)', opacity:1},{transform:`translateY(${window.innerHeight+100}px)`, opacity:0}], {duration:1500}); setTimeout(()=>c.remove(),1600);}
    }
  }

  // INIT LOADING
  (async () => {
    const fill = document.getElementById('loadProgressFill'), percentSpan = document.getElementById('loadPercent'), statusSpan = document.getElementById('loadStatus');
    try {
      statusSpan.innerText = "Memuat database peserta nasional..."; fill.style.width = "30%"; percentSpan.innerText = "30%";
      globalPeserta = await loadPesertaFromSheet();
      fill.style.width = "60%"; percentSpan.innerText = "60%"; statusSpan.innerText = "Mengunduh bank soal...";
      soalData = await loadSoalFromGithub();
      fill.style.width = "100%"; percentSpan.innerText = "100%"; statusSpan.innerText = "Sistem siap. Portal Seleksi DPBI.";
      setTimeout(() => { document.getElementById('loadingScreen').style.display = 'none'; document.getElementById('mainApp').style.display = 'block'; renderPage('login'); }, 500);
    } catch (err) {
      fill.style.width = "100%"; percentSpan.innerText = "Gagal"; statusSpan.innerHTML = `<span style="color:#b91c1c;">⚠️ ${err.message}<br>Hubungi panitia.</span>`;
      document.getElementById('retryLoad').style.display = "inline-block"; document.getElementById('retryLoad').onclick = () => window.location.reload();
    }
  })();

  document.getElementById('closeModalBtn')?.addEventListener('click', () => { let m = document.getElementById('imageModal'); m.style.visibility = 'hidden'; m.style.opacity = 0; });
  window.addEventListener('load', () => { if (restoreExamLocal() && examState && !getCompletedTokens().includes(examState.token) && soalData.length) { renderPage('exam'); startTimer(); startAutoSave(); activateSuperSecure(); document.documentElement.requestFullscreen(); } });
</script>
</body>
</html>
