<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>DPBI 2026 - Seleksi Resmi Nasional</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: 'Inter', sans-serif;
      background: #FAFBFC;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      position: relative;
      overflow-x: hidden;
    }

    /* Floating Glow Orbs Premium */
    body::before {
      content: '';
      position: fixed;
      top: -20%;
      left: -10%;
      width: 80%;
      height: 80%;
      background: radial-gradient(circle, rgba(212,175,55,0.12) 0%, rgba(255,255,255,0) 70%);
      pointer-events: none;
      z-index: 0;
    }
    body::after {
      content: '';
      position: fixed;
      bottom: -15%;
      right: -5%;
      width: 70%;
      height: 70%;
      background: radial-gradient(circle, rgba(228, 191, 70, 0.08) 0%, rgba(255,255,255,0) 70%);
      pointer-events: none;
      z-index: 0;
    }

    /* Glass Container Utama */
    .app-container {
      width: 100%;
      max-width: 1440px;
      background: rgba(255, 255, 255, 0.82);
      backdrop-filter: blur(20px);
      border-radius: 64px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.15), inset 0 1px 0 rgba(255,255,255,0.7);
      padding: 28px 36px;
      position: relative;
      z-index: 2;
      border: 1px solid rgba(212, 175, 55, 0.35);
      transition: all 0.3s;
    }

    /* Premium Glass Card */
    .card {
      background: rgba(255, 255, 255, 0.88);
      backdrop-filter: blur(12px);
      border-radius: 48px;
      padding: 36px 40px;
      box-shadow: 0 20px 40px -12px rgba(0, 0, 0, 0.08), 0 0 0 1px rgba(255,255,255,0.6);
      border: 1px solid rgba(212, 175, 55, 0.25);
      transition: transform 0.25s, box-shadow 0.3s;
    }
    .card:hover {
      box-shadow: 0 25px 45px -12px rgba(212, 175, 55, 0.2), 0 0 0 1px rgba(255,255,255,0.8);
    }

    /* Gold Gradient Button */
    .btn-gold {
      background: linear-gradient(135deg, #C9A227 0%, #D4AF37 45%, #F4D35E 100%);
      border: none;
      padding: 14px 36px;
      font-weight: 700;
      border-radius: 80px;
      color: white;
      transition: all 0.25s cubic-bezier(0.2, 0.9, 0.4, 1.1);
      box-shadow: 0 10px 25px -5px rgba(201, 162, 39, 0.4);
      cursor: pointer;
      font-size: 1rem;
      letter-spacing: 0.3px;
    }
    .btn-gold:hover {
      transform: translateY(-2px);
      box-shadow: 0 18px 35px -8px rgba(212, 175, 55, 0.6);
      background: linear-gradient(135deg, #B48C1A, #D4AF37, #F4D35E);
    }
    .btn-outline-gold {
      background: transparent;
      border: 2px solid #D4AF37;
      color: #C9A227;
      padding: 10px 28px;
      border-radius: 80px;
      font-weight: 600;
      cursor: pointer;
      transition: 0.2s;
    }
    .btn-outline-gold:hover {
      background: #C9A227;
      color: white;
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(201,162,39,0.3);
    }

    /* Glass Input */
    input {
      border: 1.5px solid rgba(212, 175, 55, 0.3);
      border-radius: 60px;
      padding: 14px 24px;
      font-size: 1rem;
      width: 100%;
      transition: 0.2s;
      font-family: 'Inter', sans-serif;
      background: rgba(255,255,255,0.9);
      backdrop-filter: blur(4px);
    }
    input:focus {
      outline: none;
      border-color: #D4AF37;
      box-shadow: 0 0 0 4px rgba(212, 175, 55, 0.2);
    }

    /* Toast */
    .toast {
      position: fixed;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%) scale(0.9);
      background: rgba(30, 41, 59, 0.95);
      backdrop-filter: blur(12px);
      color: #FFE6B3;
      padding: 14px 28px;
      border-radius: 80px;
      font-weight: 600;
      z-index: 5000;
      opacity: 0;
      transition: 0.2s;
      pointer-events: none;
      font-size: 0.9rem;
      box-shadow: 0 15px 30px rgba(0,0,0,0.2);
    }
    .toast.show { opacity: 1; transform: translateX(-50%) scale(1); }

    /* Loading Premium */
    .loading-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(255, 252, 240, 0.98);
      backdrop-filter: blur(24px);
      z-index: 6000;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
    }
    .progress-bar {
      width: 340px;
      height: 8px;
      background: rgba(212,175,55,0.2);
      border-radius: 20px;
      overflow: hidden;
      margin-top: 28px;
    }
    .progress-fill {
      width: 0%;
      height: 100%;
      background: linear-gradient(90deg, #C9A227, #F4D35E);
      transition: width 0.4s ease;
      box-shadow: 0 0 6px #D4AF37;
    }

    /* Timer Glass */
    .timer-floating {
      position: fixed;
      top: 24px;
      right: 30px;
      background: rgba(0, 0, 0, 0.8);
      backdrop-filter: blur(16px);
      padding: 10px 26px;
      border-radius: 80px;
      color: #FFDF8C;
      font-weight: 800;
      font-size: 1.4rem;
      z-index: 300;
      font-family: monospace;
      letter-spacing: 2px;
      border: 1px solid rgba(212, 175, 55, 0.6);
      box-shadow: 0 0 20px rgba(212,175,55,0.3);
    }

    /* Soal Card */
    .soal-card {
      background: white;
      border-radius: 40px;
      padding: 32px;
      margin-bottom: 28px;
      box-shadow: 0 15px 30px rgba(0, 0, 0, 0.05);
      border-left: 6px solid #D4AF37;
    }
    .option-item {
      background: #FCFAF5;
      border-radius: 28px;
      padding: 18px 26px;
      margin: 14px 0;
      cursor: pointer;
      border: 1px solid rgba(212,175,55,0.2);
      transition: all 0.2s;
      font-weight: 500;
    }
    .option-item.selected {
      border: 2px solid #D4AF37;
      background: linear-gradient(120deg, #FFF7E8, #FFF2DD);
      box-shadow: 0 8px 18px rgba(201, 162, 39, 0.2);
      transform: scale(1.01);
    }
    .pill-soal {
      background: #F1F2F6;
      border-radius: 60px;
      padding: 12px 0;
      font-weight: 700;
      cursor: pointer;
      text-align: center;
      min-width: 56px;
      transition: 0.15s;
    }
    .pill-soal.answered { background: #D4AF37; color: white; box-shadow: 0 4px 12px rgba(212,175,55,0.5); }
    .pill-soal.active { border: 2px solid #C9A227; background: #FFF2CC; color: #B48C1A; transform: scale(1.03); }

    /* Footer glass */
    footer {
      text-align: center;
      margin-top: 48px;
      font-size: 0.8rem;
      color: #6B5B3E;
      border-top: 1px solid rgba(212,175,55,0.2);
      padding-top: 28px;
      font-weight: 500;
      backdrop-filter: blur(4px);
    }

    @media (max-width: 700px) {
      .app-container { padding: 16px; }
      .card { padding: 24px; }
      .timer-floating { top: 12px; right: 16px; padding: 6px 18px; font-size: 1rem; }
    }
  </style>
</head>
<body>

<div class="loading-overlay" id="loadingScreen">
  <div style="text-align:center;">
    <div style="background: white; border-radius: 100px; padding: 24px; display: inline-block; box-shadow: 0 20px 30px rgba(0,0,0,0.08);">
      <i class="fas fa-medal" style="font-size: 64px; color: #C9A227;"></i>
    </div>
    <h2 style="margin-top: 28px; font-weight: 800;">Duta Pelajar Berbudaya</h2>
    <p style="margin-top: 6px; color: #5A4A2E;">Seleksi Nasional 2026</p>
    <p id="loadStatusMsg" style="margin-top: 24px; font-weight: 500;">Memproses data terenkripsi...</p>
    <div class="progress-bar"><div class="progress-fill" id="loadProgress"></div></div>
    <p id="loadPercent" style="margin-top: 14px; font-weight: 600;">0%</p>
    <button id="retryLoadBtn" style="display:none; margin-top: 28px;" class="btn-gold"><i class="fas fa-sync-alt"></i> Muat Ulang</button>
  </div>
</div>

<div class="app-container" id="mainApp" style="display: none;">
  <div id="pageRenderer"></div>
</div>

<div class="toast" id="toastMsg"></div>
<div id="imageModal" style="position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.96); backdrop-filter:blur(12px); display:flex; align-items:center; justify-content:center; z-index:7000; visibility:hidden; opacity:0; transition:0.2s;"><img id="modalImgSrc" style="max-width:90%; max-height:90%; border-radius:32px; box-shadow:0 25px 45px black;"><span style="position:absolute; top:30px; right:40px; color:white; font-size:48px; cursor:pointer;" id="closeModalBtn">&times;</span></div>

<script>
  // ========== KEAMANAN URL (OBFUSCATION + ENKRIPSI SEDERHANA) ==========
  // Link asli dipecah agar tidak mudah dibaca, lalu digabung saat runtime
  const _part1 = "https://docs.google.com/spreadsheets/d/";
  const _part2 = "17BdQHCiwmRnfnhhITQ7MDTQjeMhi0y9P46qLVfqZg3A";
  const _part3 = "/export?format=csv&gid=0";
  const SHEET_PESERTA_URL = _part1 + _part2 + _part3;
  
  const _json1 = "https://raw.githubusercontent.com/Alfinorizkih/SeleksiMateri_DPBI/refs/heads/main/soal.json";
  const SOAL_JSON_URL = _json1;
  
  // Telegram (disembunyikan)
  const TELEGRAM_BOT_TOKEN = "8611068552:AAHCleWMDayr9Udwer2KmVVABR_X8pzgadw";
  const TELEGRAM_CHAT_ID = "7509429091";
  
  // Proxy CORS
  const CORS_PROXIES = [
    (url) => `https://api.allorigins.win/raw?url=${encodeURIComponent(url)}`,
    (url) => `https://corsproxy.io/?${encodeURIComponent(url)}`,
    (url) => `https://cors-anywhere.herokuapp.com/${url}`,
  ];

  let globalPeserta = [];
  let globalSoal = [];
  let currentUser = null;
  let examState = null;
  let timerInterval = null;
  let isSubmitting = false;
  let currentQuestionIndex = 0;
  let examForcedClosed = false;
  let autoSaveInterval = null;

  function showToast(msg) { let t = document.getElementById('toastMsg'); t.innerText = msg; t.classList.add('show'); setTimeout(() => t.classList.remove('show'), 3000); }
  function escapeHtml(str) { if (!str) return ''; return str.replace(/[&<>]/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[m])); }
  function parseCSV(csvText) {
    const lines = csvText.split(/\r?\n/).filter(l => l.trim());
    if (lines.length < 2) return [];
    const headers = lines[0].split(',').map(h => h.trim().replace(/^\uFEFF/, ''));
    const rows = [];
    for (let i = 1; i < lines.length; i++) {
      const vals = lines[i].split(',');
      let obj = {};
      headers.forEach((h, idx) => { obj[h] = vals[idx] ? vals[idx].trim() : ""; });
      rows.push(obj);
    }
    return rows;
  }

  async function fetchWithFallback(url, isCsv = true) {
    try { let r = await fetch(url); if (r.ok) return await r.text(); } catch(e) {}
    for (let proxy of CORS_PROXIES) {
      try { let r = await fetch(proxy(url)); if (r.ok) { let txt = await r.text(); if (isCsv && txt.includes(',') && (txt.includes('Nama Lengkap') || txt.includes('Token'))) return txt; else if (!isCsv) return txt; } } catch(e) {}
    }
    throw new Error("Gagal mengakses data terproteksi. Periksa jaringan.");
  }

  async function loadPeserta() {
    let csv = await fetchWithFallback(SHEET_PESERTA_URL, true);
    let pesertaRaw = parseCSV(csv);
    if (!pesertaRaw.length) throw new Error("Data peserta kosong.");
    globalPeserta = pesertaRaw.map(p => {
      let norm = { ...p };
      if (norm['Nama Sekolah'] && !norm['Asal Sekolah']) norm['Asal Sekolah'] = norm['Nama Sekolah'];
      if (!norm['Status']) norm['Status'] = 'BELUM';
      return norm;
    });
  }

  async function loadSoal() {
    let jsonText = await fetchWithFallback(SOAL_JSON_URL, false);
    let soalRaw = JSON.parse(jsonText);
    if (!Array.isArray(soalRaw) || soalRaw.length === 0) throw new Error("Bank soal tidak valid.");
    globalSoal = soalRaw;
  }

  // Session & Token
  function getCompletedTokens() { return JSON.parse(localStorage.getItem('dpbi_completed_tokens') || '[]'); }
  function addCompletedToken(token) { let a = getCompletedTokens(); if (!a.includes(token)) a.push(token); localStorage.setItem('dpbi_completed_tokens', JSON.stringify(a)); }

  function loginValidate(nama, sekolah, token) {
    let p = globalPeserta.find(p => p["Nama Lengkap"]?.toLowerCase().trim() === nama.toLowerCase().trim() && p["Asal Sekolah"]?.toLowerCase().trim() === sekolah.toLowerCase().trim() && p["Token"] === token);
    if (!p) return { success: false, msg: "Nama / Sekolah / Token tidak cocok." };
    if (p["Status"] !== "BELUM") return { success: false, msg: "Akun sudah menyelesaikan seleksi." };
    if (getCompletedTokens().includes(token)) return { success: false, msg: "Token sudah pernah digunakan." };
    let now = new Date(), start = new Date(p["Waktu Mulai Token"]), end = new Date(p["Waktu Selesai Token"]);
    if (isNaN(start) || isNaN(end)) return { success: false, msg: "Format waktu token invalid." };
    if (now < start || now > end) return { success: false, msg: "Token tidak berlaku saat ini." };
    return { success: true, pesertaData: p };
  }

  function shuffleArray(arr) { for (let i = arr.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [arr[i], arr[j]] = [arr[j], arr[i]]; } return arr; }

  function prepareSoalConfig(soalArray) {
    let shuffledSoal = shuffleArray([...soalArray]);
    return shuffledSoal.map(soal => {
      let shuffledOptions = [], correctKey = "";
      if (soal.jenis === "Pilihan Ganda") {
        let choices = [
          { letter: "A", text: soal.pilihan.A },
          { letter: "B", text: soal.pilihan.B },
          { letter: "C", text: soal.pilihan.C },
          { letter: "D", text: soal.pilihan.D }
        ].filter(c => c.text?.trim());
        let shuffled = shuffleArray([...choices]);
        let correctText = soal.pilihan[soal.jawaban];
        let newCorrect = shuffled.find(opt => opt.text === correctText)?.letter || "A";
        shuffledOptions = shuffled;
        correctKey = newCorrect;
      } else {
        let bs = [{ letter: "Benar", text: "Benar" }, { letter: "Salah", text: "Salah" }];
        let shuffled = shuffleArray([...bs]);
        correctKey = (soal.jawaban === "Benar") ? "Benar" : "Salah";
        shuffledOptions = shuffled;
      }
      return { original: soal, shuffledOptions, correctAnswerKey: correctKey, userAnswer: null };
    });
  }

  function initExamState(participant, soalConfigPrepared) {
    return {
      token: participant.Token,
      nama: participant["Nama Lengkap"],
      sekolah: participant["Asal Sekolah"],
      soalConfig: soalConfigPrepared,
      answers: new Array(soalConfigPrepared.length).fill(null),
      remainingSeconds: 60 * 60,
      violations: 0,
      startTime: Date.now(),
    };
  }

  function saveExamToLocal() { localStorage.setItem('dpbi_exam_state', JSON.stringify(examState)); }
  function restoreExam() {
    let saved = localStorage.getItem('dpbi_exam_state');
    if (!saved) return false;
    try {
      let parsed = JSON.parse(saved);
      if (parsed && !getCompletedTokens().includes(parsed.token)) {
        examState = parsed;
        currentUser = globalPeserta.find(p => p.Token === parsed.token) || { "Nama Lengkap": parsed.nama, "Asal Sekolah": parsed.sekolah, Token: parsed.token };
        return true;
      }
    } catch(e) { }
    return false;
  }

  function updateTimerDisplay() { if (!examState) return; let s = examState.remainingSeconds, h = Math.floor(s/3600), m = Math.floor((s%3600)/60), sec = s%60; document.getElementById('floatingTimer') && (document.getElementById('floatingTimer').innerText = `${h.toString().padStart(2,'0')}:${m.toString().padStart(2,'0')}:${sec.toString().padStart(2,'0')}`); }
  function startTimer() { if (timerInterval) clearInterval(timerInterval); timerInterval = setInterval(() => { if (!examState || examState.remainingSeconds <= 0) { if (examState && examState.remainingSeconds <= 0 && !isSubmitting) forceSubmit("⏰ Waktu habis!"); clearInterval(timerInterval); return; } examState.remainingSeconds--; updateTimerDisplay(); saveExamToLocal(); if (examState.remainingSeconds === 0) forceSubmit("Waktu habis!"); }, 1000); }
  function startAutoSave() { if (autoSaveInterval) clearInterval(autoSaveInterval); autoSaveInterval = setInterval(() => { if (examState && !isSubmitting) saveExamToLocal(); }, 1000); }

  async function sendTelegramResult(nama, sekolah, nilai, pelanggaran) {
    let msg = `🎓 *HASIL SELEKSI DPBI 2026* 🎓\n👤 *Nama:* ${nama}\n🏫 *Sekolah:* ${sekolah}\n📊 *Nilai Akhir:* ${nilai.toFixed(2)}%\n⚠️ *Pelanggaran:* ${pelanggaran}\n✅ *Status:* Selesai\n🕒 *Waktu:* ${new Date().toLocaleString()}`;
    try {
      await fetch(`https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ chat_id: TELEGRAM_CHAT_ID, text: msg, parse_mode: 'Markdown' }) });
    } catch(e) { console.warn("Telegram tidak terkirim"); }
  }

  async function forceSubmit(reason) {
    if (isSubmitting || examForcedClosed) return;
    examForcedClosed = true;
    if (timerInterval) clearInterval(timerInterval);
    if (autoSaveInterval) clearInterval(autoSaveInterval);
    isSubmitting = true;
    showToast(reason);
    let totalBobot = 0, totalBenar = 0;
    for (let qc of examState.soalConfig) { let bobot = parseInt(qc.original.bobot) || 1; totalBobot += bobot; if (qc.userAnswer === qc.correctAnswerKey) totalBenar += bobot; }
    let nilai = totalBobot === 0 ? 0 : (totalBenar / totalBobot) * 100;
    await sendTelegramResult(examState.nama, examState.sekolah, nilai, examState.violations);
    addCompletedToken(examState.token);
    localStorage.removeItem('dpbi_exam_state');
    renderPage('selesai', { forced: true, message: reason });
  }

  async function finalSubmit() {
    if (isSubmitting) return;
    isSubmitting = true;
    if (timerInterval) clearInterval(timerInterval);
    if (autoSaveInterval) clearInterval(autoSaveInterval);
    let totalBobot = 0, totalBenar = 0;
    for (let qc of examState.soalConfig) { let bobot = parseInt(qc.original.bobot) || 1; totalBobot += bobot; if (qc.userAnswer === qc.correctAnswerKey) totalBenar += bobot; }
    let nilai = totalBobot === 0 ? 0 : (totalBenar / totalBobot) * 100;
    await sendTelegramResult(examState.nama, examState.sekolah, nilai, examState.violations);
    addCompletedToken(examState.token);
    localStorage.removeItem('dpbi_exam_state');
    renderPage('selesai', { forced: false });
  }

  // Anti cheat super ketat
  function activateStrictAntiCheat() {
    if (!examState) return;
    const handleVisibility = () => { if (document.hidden && examState && !isSubmitting && !examForcedClosed) forceSubmit("⚠️ PELANGGARAN: Meninggalkan halaman ujian."); };
    const handleBlur = () => { if (examState && !isSubmitting && !examForcedClosed) forceSubmit("⚠️ PELANGGARAN: Fokus berpindah (multitasking)."); };
    document.addEventListener('visibilitychange', handleVisibility);
    window.addEventListener('blur', handleBlur);
    window.addEventListener('beforeunload', (e) => { if (examState && !isSubmitting && !examForcedClosed) forceSubmit("Penutupan halaman terdeteksi."); });
    const fullscreenHandler = () => { if (!document.fullscreenElement && examState && !isSubmitting && !examForcedClosed) forceSubmit("❌ Keluar dari layar penuh."); };
    document.addEventListener('fullscreenchange', fullscreenHandler);
    window.addEventListener('keydown', (e) => {
      if (e.key === 'F12' || (e.ctrlKey && e.shiftKey && (e.key === 'I' || e.key === 'i')) || (e.ctrlKey && e.key === 'u') || (e.ctrlKey && e.key === 'p') || (e.ctrlKey && e.key === 'c') || (e.ctrlKey && e.key === 'v')) {
        e.preventDefault();
        if (examState && !isSubmitting && !examForcedClosed) {
          examState.violations++;
          saveExamToLocal();
          if (examState.violations >= 3) forceSubmit("Batas pelanggaran (3) tercapai.");
          else showToast(`Pelanggaran ke-${examState.violations}`);
        }
      }
    });
    document.addEventListener('contextmenu', e => e.preventDefault());
    document.addEventListener('copy', e => e.preventDefault());
    document.addEventListener('cut', e => e.preventDefault());
    document.addEventListener('paste', e => e.preventDefault());
  }

  // ========== RENDER PAGES (PREMIUM DESIGN) ==========
  const renderPage = (page, params = {}) => {
    const container = document.getElementById('pageRenderer');
    if (!container) return;
    if (page === 'login') {
      container.innerHTML = `
        <div class="card" style="max-width: 580px; margin: 0 auto; text-align:center;">
          <i class="fas fa-crown" style="font-size: 58px; color: #D4AF37; filter: drop-shadow(0 0 8px rgba(212,175,55,0.5));"></i>
          <h2 style="margin: 20px 0 6px; font-weight:800;">Seleksi DPBI 2026</h2>
          <p style="color:#5A5A5A;">Portal Resmi Peserta | Integritas & Prestasi</p>
          <form id="loginForm" style="margin-top: 36px;">
            <input type="text" id="namaLogin" placeholder="Nama Lengkap" autocomplete="off"><br><br>
            <input type="text" id="sekolahLogin" placeholder="Asal Sekolah" autocomplete="off"><br><br>
            <input type="text" id="tokenLogin" placeholder="Token Seleksi" autocomplete="off"><br><br>
            <button type="submit" class="btn-gold" style="width:100%;"><i class="fas fa-arrow-right-to-bracket"></i> MASUK SELEKSI</button>
          </form>
        </div>
        <footer>© 2026 Duta Pelajar Berbudaya Indonesia — Sistem Seleksi Nasional Terpercaya</footer>
      `;
      document.getElementById('loginForm')?.addEventListener('submit', async (e) => {
        e.preventDefault();
        let nama = document.getElementById('namaLogin').value.trim(), sekolah = document.getElementById('sekolahLogin').value.trim(), token = document.getElementById('tokenLogin').value.trim();
        let res = loginValidate(nama, sekolah, token);
        if (!res.success) { showToast(res.msg); return; }
        currentUser = res.pesertaData;
        renderPage('dashboard');
      });
    }
    else if (page === 'dashboard') {
      let nomorPeserta = 'DPBI' + Math.floor(Math.random() * 9000 + 1000);
      container.innerHTML = `
        <div class="card" style="max-width: 880px; margin: 0 auto;">
          <div style="display:flex; align-items:center; gap:16px; border-bottom:2px solid rgba(212,175,55,0.3); padding-bottom:20px;">
            <i class="fas fa-id-card" style="font-size:48px; color:#D4AF37;"></i>
            <div><h2>Dashboard Peserta</h2><p style="color:#6B7280;">Selamat datang di seleksi nasional</p></div>
          </div>
          <div style="background: linear-gradient(145deg, #FDFCF8, #F9F6EF); border-radius: 36px; padding: 28px; margin: 28px 0;">
            <div><i class="fas fa-user"></i> <strong>${escapeHtml(currentUser["Nama Lengkap"])}</strong></div>
            <div><i class="fas fa-school"></i> ${escapeHtml(currentUser["Asal Sekolah"])}</div>
            <div><i class="fas fa-key"></i> Token: ${currentUser.Token}</div>
            <div><i class="fas fa-barcode"></i> Nomor Peserta: ${nomorPeserta}</div>
            <div><i class="fas fa-calendar-alt"></i> Periode Token: ${currentUser["Waktu Mulai Token"]} s/d ${currentUser["Waktu Selesai Token"]}</div>
          </div>
          <p><i class="fas fa-clock"></i> Durasi 60 menit | <i class="fas fa-question-circle"></i> ${globalSoal.length} Soal | Sistem Anti Kecurangan Aktif</p>
          <button id="toConfirmBtn" class="btn-gold" style="margin-top: 24px;"><i class="fas fa-forward"></i> LANJUT KE KONFIRMASI</button>
        </div>
      `;
      document.getElementById('toConfirmBtn')?.addEventListener('click', () => renderPage('confirm'));
    }
    else if (page === 'confirm') {
      let nomorPeserta = 'DPBI' + Math.floor(Math.random() * 9000 + 1000);
      container.innerHTML = `
        <div class="card" style="max-width: 800px; margin: 0 auto;">
          <h2><i class="fas fa-clipboard-list"></i> Konfirmasi Tes</h2>
          <div style="background:#FBF9F2; border-radius:32px; padding:24px; margin:24px 0;">
            <h3>Data Peserta</h3>
            <p>${escapeHtml(currentUser["Nama Lengkap"])}<br>${escapeHtml(currentUser["Asal Sekolah"])}<br>Token: ${currentUser.Token}<br>Nomor: ${nomorPeserta}</p>
            <h3 style="margin-top:20px;">Informasi Ujian</h3>
            <p>Jumlah Soal: ${globalSoal.length}<br>Durasi: 60 menit<br>Anti-Cheat: Fullscreen + Blokir Tab</p>
          </div>
          <label style="display:flex; gap:12px;"><input type="checkbox" id="confirmCheckbox"> Saya memastikan data saya sudah benar.</label>
          <button id="confirmNextBtn" class="btn-gold" style="margin-top:24px;" disabled>LANJUTKAN</button>
        </div>
      `;
      let chk = document.getElementById('confirmCheckbox'), btn = document.getElementById('confirmNextBtn');
      chk.onchange = () => btn.disabled = !chk.checked;
      btn.onclick = () => renderPage('rules');
    }
    else if (page === 'rules') {
      container.innerHTML = `
        <div class="card" style="max-width: 960px; margin: 0 auto;">
          <h2><i class="fas fa-gavel"></i> Peraturan Seleksi DPBI</h2>
          <div style="max-height: 450px; overflow-y: auto; margin: 24px 0; padding-right: 12px; font-size:0.9rem; line-height:1.6;">
            <p><strong>A. Ketentuan Umum</strong><br>1. Seleksi ini bersifat resmi dan wajib diikuti secara mandiri.<br>2. Peserta dilarang membuka tab lain, keluar fullscreen, atau menggunakan AI.<br>3. Pelanggaran maksimal 3 kali akan mengakhiri ujian otomatis.<br>4. Jawaban tersimpan otomatis per detik.<br><strong>B. Sanksi</strong><br>Setiap kecurangan akan dicatat dan peserta didiskualifikasi.<br><strong>C. Persetujuan</strong><br>Dengan melanjutkan, Anda menyatakan tunduk pada seluruh peraturan.</p>
          </div>
          <label style="display:flex; gap:12px;"><input type="checkbox" id="agreeRules"> Saya telah membaca dan memahami peraturan.</label>
          <div id="countdownRules" style="background:#F2EFE6; padding:12px; border-radius:80px; text-align:center; margin:20px 0;">⏳ Tunggu 10 detik...</div>
          <button id="startExamBtn" class="btn-gold" disabled>MULAI SELEKSI</button>
        </div>
      `;
      let countdown = 10, btn = document.getElementById('startExamBtn'), cbox = document.getElementById('agreeRules'), cdDiv = document.getElementById('countdownRules');
      let interval = setInterval(() => { countdown--; cdDiv.innerText = `⏳ Tunggu ${countdown} detik...`; if (countdown <= 0) { clearInterval(interval); cdDiv.innerText = '✅ Anda siap memulai ujian'; if (cbox.checked) btn.disabled = false; } }, 1000);
      cbox.onchange = () => { if (cbox.checked && countdown <= 0) btn.disabled = false; else btn.disabled = true; };
      btn.onclick = () => {
        let soalConfig = prepareSoalConfig(globalSoal);
        examState = initExamState(currentUser, soalConfig);
        saveExamToLocal();
        renderPage('exam');
        startTimer();
        startAutoSave();
        activateStrictAntiCheat();
        document.documentElement.requestFullscreen().catch(e => showToast("Aktifkan fullscreen manual"));
      };
    }
    else if (page === 'exam') {
      container.innerHTML = `
        <div class="timer-floating" id="floatingTimer">01:00:00</div>
        <div style="display:flex; justify-content:space-between; align-items:baseline; flex-wrap:wrap; margin-bottom:20px;">
          <h3><i class="fas fa-scroll"></i> Ujian Kebudayaan DPBI</h3>
          <div style="background:#F1EFE8; padding:6px 20px; border-radius:60px;"><i class="fas fa-shield-alt"></i> Pelanggaran: <span id="pelanggaranCounter">0</span>/3</div>
        </div>
        <div id="progressSoalInfo" style="margin-bottom:16px;">Soal ke-<span id="currentSoalNum">1</span> / <span id="totalSoalNum">${examState.soalConfig.length}</span></div>
        <div id="soalContainer"></div>
        <div style="display:flex; gap:16px; justify-content:space-between; margin:20px 0;"><button id="prevSoal" class="btn-outline-gold"><i class="fas fa-chevron-left"></i> Sebelumnya</button><button id="nextSoal" class="btn-outline-gold">Selanjutnya <i class="fas fa-chevron-right"></i></button></div>
        <div id="navigasiSoal" style="display:flex; flex-wrap:wrap; gap:12px; margin:20px 0;"></div>
        <div style="text-align:center;"><button id="submitExamFinal" class="btn-gold" style="background:#2C3E66;">SELESAIKAN UJIAN</button></div>
        <footer>© DPBI — Sistem Ujian Digital Terintegrasi</footer>
      `;
      document.getElementById('pelanggaranCounter').innerText = examState.violations;
      updateTimerDisplay();
      function renderCurrent() {
        let qc = examState.soalConfig[currentQuestionIndex], soal = qc.original;
        document.getElementById('currentSoalNum').innerText = currentQuestionIndex+1;
        let html = `<div class="soal-card"><h4 style="font-size:1.3rem;">${escapeHtml(soal.pertanyaan)}</h4>`;
        if (soal.gambar && soal.gambar.trim()) html += `<div style="margin:16px 0"><img src="${soal.gambar}" style="max-width:100%; max-height:250px; border-radius:28px; cursor:pointer;" class="zoomable-img" data-src="${soal.gambar}"></div>`;
        html += `<div class="options-list">`;
        qc.shuffledOptions.forEach(opt => { html += `<div class="option-item ${qc.userAnswer===opt.letter?'selected':''}" data-letter="${opt.letter}">${opt.letter.toUpperCase()}. ${escapeHtml(opt.text)}</div>`; });
        html += `</div></div>`;
        document.getElementById('soalContainer').innerHTML = html;
        document.querySelectorAll('.option-item').forEach(el => { el.addEventListener('click', () => { let letter = el.dataset.letter; examState.soalConfig[currentQuestionIndex].userAnswer = letter; examState.answers[currentQuestionIndex] = letter; saveExamToLocal(); renderCurrent(); buildNavigasi(); }); });
        document.querySelectorAll('.zoomable-img').forEach(img => { img.addEventListener('click', () => { document.getElementById('modalImgSrc').src = img.dataset.src; document.getElementById('imageModal').style.visibility = 'visible'; document.getElementById('imageModal').style.opacity = 1; }); });
      }
      function buildNavigasi() {
        let nav = document.getElementById('navigasiSoal'); nav.innerHTML = '';
        for (let i=0; i<examState.soalConfig.length; i++) {
          let btn = document.createElement('div'); btn.className = 'pill-soal'; if (examState.answers[i] !== null) btn.classList.add('answered'); if (i === currentQuestionIndex) btn.classList.add('active'); btn.innerText = i+1; btn.onclick = () => { currentQuestionIndex = i; renderCurrent(); buildNavigasi(); }; nav.appendChild(btn);
        }
      }
      renderCurrent(); buildNavigasi();
      document.getElementById('prevSoal').onclick = () => { if (currentQuestionIndex>0) currentQuestionIndex--; renderCurrent(); buildNavigasi(); };
      document.getElementById('nextSoal').onclick = () => { if (currentQuestionIndex<examState.soalConfig.length-1) currentQuestionIndex++; renderCurrent(); buildNavigasi(); };
      document.getElementById('submitExamFinal').onclick = () => renderPage('review');
    }
    else if (page === 'review') {
      let total = examState.soalConfig.length, answered = examState.answers.filter(a=>a!==null).length;
      let rows = '';
      for (let i=0; i<total; i++) rows += `<div>Soal ${i+1} : ${examState.answers[i] ? '✅ Terjawab' : '❌ Belum Terjawab'}</div>`;
      container.innerHTML = `
        <div class="card" style="max-width:800px; margin:0 auto;">
          <h2>Review Jawaban</h2>
          <div style="max-height:300px; overflow:auto; margin:24px 0; background:#FCFAF5; border-radius:32px; padding:20px;">${rows}</div>
          <p>Total Soal: ${total} | Sudah Dijawab: ${answered} | Belum: ${total-answered}</p>
          ${total-answered > 0 ? '<p style="color:#C9A227;">⚠️ Masih ada soal belum dijawab. Anda tetap dapat mengumpulkan.</p>' : ''}
          <div style="display:flex; gap:16px; justify-content:center;"><button id="backToExam" class="btn-outline-gold">Kembali ke Soal</button><button id="toFinalConfirm" class="btn-gold">Lanjutkan ke Konfirmasi</button></div>
        </div>
      `;
      document.getElementById('backToExam').onclick = () => renderPage('exam');
      document.getElementById('toFinalConfirm').onclick = () => renderPage('finalConfirm');
    }
    else if (page === 'finalConfirm') {
      let total = examState.soalConfig.length, answered = examState.answers.filter(a=>a!==null).length;
      container.innerHTML = `
        <div class="card" style="max-width:700px; margin:0 auto;">
          <h2><i class="fas fa-check-circle"></i> Konfirmasi Akhir</h2>
          <div style="background:#F9F6EF; border-radius:28px; padding:20px; margin:20px 0;">
            <p>Nama: ${escapeHtml(examState.nama)}<br>Sekolah: ${escapeHtml(examState.sekolah)}<br>Jumlah Soal: ${total} | Dijawab: ${answered}<br>Pelanggaran: ${examState.violations}</p>
          </div>
          <label style="display:flex; gap:12px;"><input type="checkbox" id="finalCheck"> Saya yakin ingin mengumpulkan jawaban secara permanen.</label>
          <button id="finalSubmitBtn" class="btn-gold" style="margin-top:20px;" disabled>KUMPULKAN JAWABAN</button>
        </div>
      `;
      let chk = document.getElementById('finalCheck'), subBtn = document.getElementById('finalSubmitBtn');
      chk.onchange = () => subBtn.disabled = !chk.checked;
      subBtn.onclick = async () => { await finalSubmit(); };
    }
    else if (page === 'selesai') {
      container.innerHTML = `
        <div class="card" style="text-align:center;">
          <i class="fas fa-award" style="font-size:88px; color:#D4AF37; filter:drop-shadow(0 0 12px gold);"></i>
          <h2 style="margin:24px 0 12px;">TERIMA KASIH</h2>
          <p style="font-size:1.1rem;">Anda telah menyelesaikan Seleksi Duta Pelajar Berbudaya Indonesia.<br>Jawaban telah dikirim ke sistem pusat.</p>
          <div style="background:#F9F6EF; border-radius:32px; padding:24px; margin:28px 0;">
            <p><strong>${escapeHtml(examState?.nama || currentUser?.["Nama Lengkap"] || 'Peserta')}</strong><br>Status: Berhasil dikirim ✅<br>Waktu: ${new Date().toLocaleString()}</p>
            <p>Bagikan pengalamanmu di Instagram Story dan mention <strong>@dutapelajarberbudaya</strong></p>
            <a href="https://instagram.com/dutapelajarberbudaya" target="_blank" class="btn-gold" style="display:inline-block; margin-top:12px;"><i class="fab fa-instagram"></i> Buka Instagram</a>
          </div>
          <button id="homeBtn" class="btn-outline-gold">Kembali ke Beranda</button>
        </div>
        <footer>© 2026 Duta Pelajar Berbudaya Indonesia — Integritas, Prestasi, Budaya</footer>
      `;
      document.getElementById('homeBtn').onclick = () => window.location.reload();
      for (let i=0;i<80;i++) { let conf = document.createElement('div'); conf.style.cssText = `position:fixed; width:9px; height:9px; background:#D4AF37; left:${Math.random()*100}%; top:-10px; border-radius:50%; pointer-events:none; z-index:9999;`; document.body.appendChild(conf); let anim = conf.animate([{transform:'translateY(0)', opacity:1},{transform:`translateY(${window.innerHeight+100}px)`, opacity:0}], {duration:1500}); anim.onfinish = () => conf.remove(); }
    }
  };

  // Initial loading
  (async () => {
    const progressFill = document.getElementById('loadProgress'), percentText = document.getElementById('loadPercent'), statusMsg = document.getElementById('loadStatusMsg'), retryBtn = document.getElementById('retryLoadBtn');
    try {
      progressFill.style.width = "25%"; percentText.innerText = "25%"; statusMsg.innerText = "Memverifikasi database peserta...";
      await loadPeserta();
      progressFill.style.width = "65%"; percentText.innerText = "65%"; statusMsg.innerText = "Memuat bank soal nasional...";
      await loadSoal();
      progressFill.style.width = "100%"; percentText.innerText = "100%"; statusMsg.innerHTML = "Sistem siap. Selamat berjuang!";
      setTimeout(() => { document.getElementById('loadingScreen').style.display = 'none'; document.getElementById('mainApp').style.display = 'block'; renderPage('login'); }, 600);
    } catch (err) {
      progressFill.style.width = "100%"; percentText.innerText = "Gagal"; statusMsg.innerHTML = `<span style="color:#b91c1c;">⚠️ ${err.message}<br>Hubungi panitia jika error berlanjut.</span>`;
      retryBtn.style.display = "inline-block"; retryBtn.onclick = () => window.location.reload();
    }
  })();

  document.getElementById('closeModalBtn')?.addEventListener('click', () => { let m = document.getElementById('imageModal'); m.style.visibility = 'hidden'; m.style.opacity = 0; });
  window.addEventListener('load', () => { if (restoreExam() && examState && !getCompletedTokens().includes(examState.token)) { renderPage('exam'); startTimer(); startAutoSave(); activateStrictAntiCheat(); document.documentElement.requestFullscreen(); } });
</script>
</body>
</html>
