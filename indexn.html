<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>DPBI 2026 · Seleksi Nasional Duta Pelajar Berbudaya</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/lz-string@1.5.0/lz-string.min.js"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: 'Plus Jakarta Sans', 'Inter', sans-serif;
      background: #F7F7F5;
      color: #1F2937;
      line-height: 1.5;
      overflow-x: hidden;
    }

    /* Luxury Glassmorphism Gold */
    .glass-premium {
      background: rgba(255, 255, 255, 0.75);
      backdrop-filter: blur(28px);
      border-radius: 40px;
      border: 1px solid rgba(255, 255, 255, 0.6);
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.06), 0 0 0 0.5px rgba(212, 175, 55, 0.2);
      transition: all 0.3s ease;
    }

    .gold-glow {
      box-shadow: 0 8px 28px -8px rgba(212, 175, 55, 0.3);
    }

    .btn-primary {
      background: linear-gradient(135deg, #C9A227 0%, #D4AF37 60%, #E9C957 100%);
      border: none;
      padding: 14px 32px;
      font-weight: 700;
      border-radius: 60px;
      color: #1F2937;
      cursor: pointer;
      transition: all 0.25s ease;
      font-size: 1rem;
      letter-spacing: -0.2px;
      box-shadow: 0 4px 12px rgba(212, 175, 55, 0.3);
    }

    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 24px -8px rgba(212, 175, 55, 0.5);
      filter: brightness(1.02);
    }

    .btn-outline {
      background: transparent;
      border: 1.5px solid #D4AF37;
      color: #A67C1E;
      padding: 10px 24px;
      border-radius: 60px;
      font-weight: 600;
      cursor: pointer;
      transition: 0.2s;
    }

    .btn-outline:hover {
      background: rgba(212, 175, 55, 0.1);
      border-color: #C9A227;
    }

    .input-field {
      width: 100%;
      padding: 16px 24px;
      background: white;
      border: 1px solid #E5E0D0;
      border-radius: 60px;
      font-family: 'Plus Jakarta Sans', monospace;
      transition: 0.2s;
      font-size: 1rem;
    }

    .input-field:focus {
      outline: none;
      border-color: #D4AF37;
      box-shadow: 0 0 0 4px rgba(212, 175, 55, 0.15);
    }

    /* Layout */
    .container-premium {
      max-width: 1400px;
      margin: 0 auto;
      padding: 32px 48px;
    }

    @media (max-width: 768px) {
      .container-premium {
        padding: 20px 24px;
      }
    }

    /* Sidebar & Exam Layout */
    .exam-layout {
      display: flex;
      gap: 32px;
      align-items: flex-start;
    }

    .exam-sidebar {
      flex: 0 0 300px;
      position: sticky;
      top: 28px;
    }

    .exam-content {
      flex: 1;
    }

    @media (max-width: 900px) {
      .exam-layout {
        flex-direction: column;
      }
      .exam-sidebar {
        flex: auto;
        width: 100%;
        position: relative;
      }
    }

    .option-card {
      background: white;
      border-radius: 28px;
      padding: 18px 24px;
      margin: 12px 0;
      border: 1px solid #F0EBDC;
      transition: all 0.2s;
      cursor: pointer;
      font-weight: 500;
    }

    .option-card:hover {
      border-color: #D4AF37;
      background: #FFFCF5;
      transform: translateX(6px);
    }

    .option-card.selected {
      border: 2px solid #D4AF37;
      background: linear-gradient(105deg, #FFF9E8, #FFF4E0);
      box-shadow: 0 8px 20px rgba(212, 175, 55, 0.2);
    }

    .nav-pill {
      background: #F0EFEA;
      border-radius: 48px;
      padding: 8px 0;
      text-align: center;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s;
    }

    .nav-pill.answered {
      background: #D4AF37;
      color: #1F2937;
      box-shadow: 0 4px 12px rgba(212, 175, 55, 0.3);
    }

    .nav-pill.active {
      border: 2px solid #A67C1E;
      background: #FFF2DA;
      transform: scale(1.02);
    }

    .toast-message {
      position: fixed;
      bottom: 32px;
      left: 50%;
      transform: translateX(-50%) scale(0.95);
      background: #1E293B;
      backdrop-filter: blur(16px);
      color: white;
      padding: 12px 32px;
      border-radius: 60px;
      font-weight: 600;
      z-index: 7000;
      opacity: 0;
      transition: 0.2s;
      pointer-events: none;
      white-space: nowrap;
    }

    .toast-message.show {
      opacity: 1;
      transform: translateX(-50%) scale(1);
    }

    footer {
      text-align: center;
      margin-top: 60px;
      padding: 24px 0 16px;
      font-size: 0.75rem;
      color: #9CA3AF;
      border-top: 1px solid rgba(212, 175, 55, 0.2);
    }

    /* gambar zoom */
    .exam-image {
      max-width: 100%;
      max-height: 260px;
      border-radius: 28px;
      margin: 16px 0;
      cursor: pointer;
      border: 1px solid rgba(212, 175, 55, 0.3);
    }

    /* modal */
    .image-modal {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.92);
      backdrop-filter: blur(20px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 9000;
      visibility: hidden;
      opacity: 0;
      transition: 0.2s;
    }

    /* loader premium */
    .loader-premium {
      position: fixed;
      inset: 0;
      background: #FAFAF8;
      backdrop-filter: blur(40px);
      z-index: 10000;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
  </style>
</head>
<body>

<script>
  // ---------------------- DATA DUMMY PESERTA (RESMI) ----------------------

    { nama: "Demo User", sekolah: "SMA Teladan", token: "DEMO2026", start: "2026-06-11T00:00:00", end: "2027-12-31T23:59:59" }

  // ---------------------- BANK SOAL PREMIUM 20 SOAL ----------------------
  const BANK_SOAL = [
    { id:1, jenis:"Pilihan Ganda", pertanyaan:"Apa ibu kota Indonesia?", gambar:"", pilihan:{A:"Jakarta",B:"Bandung",C:"Surabaya",D:"Medan"}, jawaban:"A", bobot:5 },

    { id:5, jenis:"Pilihan Ganda", pertanyaan:"Sumpah Pemuda diperingati setiap tanggal?", gambar:"", pilihan:{A:"28 Oktober",B:"17 Agustus",C:"20 Mei",D:"22 Juni"}, jawaban:"A", bobot:5 },
    { id:6, jenis:"Benar Salah", pertanyaan:"Rendang berasal dari Sumatera Utara.", gambar:"", pilihan:{A:"Benar",B:"Salah"}, jawaban:"Salah", bobot:5 },

    { id:9, jenis:"Benar Salah", pertanyaan:"Bahasa Indonesia merupakan bahasa resmi ketiga di ASEAN.", gambar:"", pilihan:{A:"Benar",B:"Salah"}, jawaban:"Salah", bobot:5 },
    { id:10, jenis:"Pilihan Ganda", pertanyaan:"Upacara adat Ngaben berasal dari daerah?", gambar:"", pilihan:{A:"Bali",B:"Toraja",C:"Flores",D:"Lombok"}, jawaban:"A", bobot:5 },
    { id:11, jenis:"Pilihan Ganda", pertanyaan:"Keris dimasukkan dalam daftar UNESCO sebagai?", gambar:"", pilihan:{A:"Masterpiece",B:"Karya Agung",C:"Warisan Lisan",D:"Memori Dunia"}, jawaban:"A", bobot:5 },
    { id:12, jenis:"Benar Salah", pertanyaan:"Wayang kulit adalah budaya asli Indonesia yang sudah diakui dunia.", gambar:"", pilihan:{A:"Benar",B:"Salah"}, jawaban:"Benar", bobot:5 },
    { id:13, jenis:"Pilihan Ganda", pertanyaan:"Lagu 'Rayuan Pulau Kelapa' diciptakan oleh?", gambar:"", pilihan:{A:"WR Supratman",B:"Ismail Marzuki",C:"Husein Mutahar",D:"Cornel Simanjuntak"}, jawaban:"B", bobot:5 },
    { id:14, jenis:"Pilihan Ganda", pertanyaan:"Tradisi Mappanretasi di Sulawesi Selatan adalah?", gambar:"", pilihan:{A:"Upacara Laut",B:"Panen Padi",C:"Potong Rambut",D:"Pernikahan"}, jawaban:"A", bobot:5 },
    { id:15, jenis:"Benar Salah", pertanyaan:"Gado-gado berasal dari Betawi.", gambar:"", pilihan:{A:"Benar",B:"Salah"}, jawaban:"Benar", bobot:5 },
    { id:16, jenis:"Pilihan Ganda", pertanyaan:"Museum Nasional Indonesia terletak di?", gambar:"", pilihan:{A:"Jakarta",B:"Bandung",C:"Surabaya",D:"Medan"}, jawaban:"A", bobot:5 },
    { id:17, jenis:"Pilihan Ganda", pertanyaan:"Bahasa daerah dengan penutur terbanyak di Indonesia?", gambar:"", pilihan:{A:"Jawa",B:"Sunda",C:"Madura",D:"Minang"}, jawaban:"A", bobot:5 },
    { id:18, jenis:"Benar Salah", pertanyaan:"Taman Mini Indonesia Indah (TMII) dibuat pada masa Presiden Soeharto.", gambar:"", pilihan:{A:"Benar",B:"Salah"}, jawaban:"Benar", bobot:5 },
    { id:19, jenis:"Pilihan Ganda", pertanyaan:"Danau terbesar di Indonesia adalah?", gambar:"", pilihan:{A:"Toba",B:"Maninjau",C:"Poso",D:"Singkarak"}, jawaban:"A", bobot:5 },
    { id:20, jenis:"Benar Salah", pertanyaan:"Prambanan adalah candi Buddha terbesar di Indonesia.", gambar:"", pilihan:{A:"Benar",B:"Salah"}, jawaban:"Salah", bobot:5 }
  ];

  // Keamanan sederhana (obfuscate) untuk token Telegram
  const _tokenBot = "ODYxMTA2ODU1MjpBQUhDbGVXTURheXI5VWR3ZXIyS21WVkFCUlhfOHB6Z2Fkdw=="; // base64 token asli, decode
  const _chatId = "NzUwOTQyOTA5MQ==";
  function getTelegramToken() { return atob(_tokenBot); }
  function getTelegramChatId() { return atob(_chatId); }

  // Global state
  let currentUser = null;
  let examState = null;        // { token, nama, sekolah, soalConfig, answers, remainingSeconds, violations, startTime, sessionId, deviceId }
  let timerInterval = null;
  let autoSaveInterval = null;
  let isSubmitting = false;
  let examClosed = false;
  let currentQuestionIndex = 0;

  // Helper
  function showToast(msg, isErr = false) { const t = document.getElementById('toastRoot'); t.innerText = msg; t.classList.add('show'); setTimeout(() => t.classList.remove('show'), 3600); }
  function shuffle(arr) { for (let i = arr.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [arr[i], arr[j]] = [arr[j], arr[i]]; } return arr; }

  // Persiapkan soal acak & mapping jawaban
  function prepareExamSoals(soalList) {
    let shuffled = shuffle([...soalList]);
    return shuffled.map(soal => {
      let shuffledOptions = [];
      let correctAnswerKey = "";
      if (soal.jenis === "Pilihan Ganda") {
        const entries = Object.entries(soal.pilihan);
        let opts = entries.map(([key, val]) => ({ letter: key, text: val }));
        shuffledOptions = shuffle(opts);
        const correctText = soal.pilihan[soal.jawaban];
        correctAnswerKey = shuffledOptions.find(opt => opt.text === correctText)?.letter || soal.jawaban;
      } else { // Benar Salah
        let bs = [{ letter: "Benar", text: "Benar" }, { letter: "Salah", text: "Salah" }];
        shuffledOptions = shuffle(bs);
        correctAnswerKey = soal.jawaban === "Benar" ? "Benar" : "Salah";
      }
      return { original: soal, shuffledOptions, correctAnswerKey, userAnswer: null };
    });
  }

  function initExam(participant, soalConfigs) {
    const deviceId = localStorage.getItem('dpbi_device_id') || Math.random().toString(36).substring(2);
    localStorage.setItem('dpbi_device_id', deviceId);
    return {
      token: participant.token, nama: participant.nama, sekolah: participant.sekolah,
      soalConfig: soalConfigs,
      answers: new Array(soalConfigs.length).fill(null),
      remainingSeconds: 60 * 60, // 1 jam
      violations: 0,
      startTime: Date.now(),
      sessionId: Math.random().toString(36).substring(2, 12),
      deviceId: deviceId
    };
  }

  function saveExamToLocal() { if (examState) localStorage.setItem('dpbi_exam', JSON.stringify(examState)); }
  function restoreExamLocal() { const raw = localStorage.getItem('dpbi_exam'); if (raw) { try { const parsed = JSON.parse(raw); if (parsed && !isExamCompleted(parsed.token)) { examState = parsed; return true; } } catch(e) {} } return false; }
  function isExamCompleted(token) { const comp = JSON.parse(localStorage.getItem('dpbi_completed') || '[]'); return comp.includes(token); }
  function markCompleted(token) { let arr = JSON.parse(localStorage.getItem('dpbi_completed') || '[]'); if (!arr.includes(token)) arr.push(token); localStorage.setItem('dpbi_completed', JSON.stringify(arr)); }

  // validasi login
  function validateLogin(nama, sekolah, token) {
    const p = PARTICIPANTS.find(p => p.nama.toLowerCase() === nama.toLowerCase() && p.sekolah.toLowerCase() === sekolah.toLowerCase() && p.token === token);
    if (!p) return { ok: false, msg: "Nama / sekolah / token tidak cocok dengan database nasional." };
    if (isExamCompleted(token)) return { ok: false, msg: "Token ini telah digunakan untuk menyelesaikan seleksi." };
    const now = new Date(), start = new Date(p.start), end = new Date(p.end);
    if (now < start) return { ok: false, msg: "⏳ Seleksi belum dimulai." };
    if (now > end) return { ok: false, msg: "⌛ Periode seleksi telah berakhir." };
    return { ok: true, pesertaData: p };
  }

  // Force submit
  async function forceSubmit(reason) {
    if (isSubmitting || examClosed) return;
    isSubmitting = true; examClosed = true;
    if (timerInterval) clearInterval(timerInterval);
    if (autoSaveInterval) clearInterval(autoSaveInterval);
    showToast(reason, false);
    await computeAndSendResult();
  }

  async function computeAndSendResult() {
    if (!examState) return;
    let totalBobot = 0, totalBenar = 0;
    for (let qc of examState.soalConfig) {
      let bobot = parseInt(qc.original.bobot) || 1;
      totalBobot += bobot;
      if (qc.userAnswer === qc.correctAnswerKey) totalBenar += bobot;
    }
    const nilai = totalBobot ? (totalBenar / totalBobot) * 100 : 0;
    const durasiMenit = Math.floor((Date.now() - examState.startTime) / 60000);
    const msg = `🏅 SELEKSI NASIONAL DPBI 2026 🏅\n👤 Nama: ${examState.nama}\n🏫 Sekolah: ${examState.sekolah}\n🔑 Token: ${examState.token}\n✅ Bobot Benar: ${totalBenar}\n⭐ Nilai: ${nilai.toFixed(2)}%\n⏱️ Durasi: ${durasiMenit} menit\n⚠️ Pelanggaran: ${examState.violations}\n🕒 Submit: ${new Date().toLocaleString()}`;
    try {
      await fetch(`https://api.telegram.org/bot${getTelegramToken()}/sendMessage`, {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ chat_id: getTelegramChatId(), text: msg, parse_mode: 'Markdown' })
      });
    } catch(e) { console.warn(e); }
    markCompleted(examState.token);
    localStorage.removeItem('dpbi_exam');
    renderPage('success');
  }

  // Unique link (1 device only)
  function generateUniqueLink() {
    if (!examState) return null;
    const deviceId = localStorage.getItem('dpbi_device_id');
    if (!deviceId) return null;
    const exportState = { ...examState, deviceId };
    const compressed = LZString.compressToEncodedURIComponent(JSON.stringify(exportState));
    const url = new URL(window.location.href);
    url.searchParams.set('restore', compressed);
    return url.toString();
  }
  async function tryRestoreFromUrl() {
    const params = new URLSearchParams(window.location.search);
    const code = params.get('restore');
    if (code) {
      try {
        const decompressed = LZString.decompressFromEncodedURIComponent(code);
        if (decompressed) {
          const parsed = JSON.parse(decompressed);
          const currentDevice = localStorage.getItem('dpbi_device_id');
          if (parsed.deviceId && currentDevice === parsed.deviceId && !isExamCompleted(parsed.token)) {
            examState = parsed;
            saveExamToLocal();
            showToast("✅ Sesi dipulihkan (perangkat yang sama)", false);
            renderPage('exam');
            startTimer(); startAutoSave(); activateAntiCheat();
            return true;
          } else showToast("❌ Link hanya dapat digunakan pada perangkat yang sama.", true);
        }
      } catch(e) { showToast("Link restore rusak", true); }
    }
    return false;
  }

  function startTimer() { if (timerInterval) clearInterval(timerInterval); timerInterval = setInterval(() => { if (examState && !isSubmitting && !examClosed && examState.remainingSeconds > 0) { examState.remainingSeconds--; saveExamToLocal(); updateTimerUI(); if (examState.remainingSeconds <= 0) forceSubmit("⏰ Waktu seleksi habis!"); } }, 1000); }
  function startAutoSave() { if (autoSaveInterval) clearInterval(autoSaveInterval); autoSaveInterval = setInterval(() => { if (examState && !isSubmitting) saveExamToLocal(); }, 10000); }
  function updateTimerUI() { const el = document.getElementById('globalTimer'); if (el && examState) { let s = examState.remainingSeconds, h = Math.floor(s/3600), m = Math.floor((s%3600)/60), sec = s%60; el.innerText = `${h.toString().padStart(2,'0')}:${m.toString().padStart(2,'0')}:${sec.toString().padStart(2,'0')}`; } }

  function activateAntiCheat() {
    if (!examState) return;
    const violationInc = () => { if (examState && !isSubmitting && !examClosed) { examState.violations++; saveExamToLocal(); const badge = document.getElementById('violationBadge'); if (badge) badge.innerText = examState.violations; showToast(`⚠️ Pelanggaran (${examState.violations}/3)`); if (examState.violations >= 3) forceSubmit("Batas pelanggaran tercapai. Ujian dihentikan."); } };
    document.addEventListener('visibilitychange', () => { if (document.hidden && examState && !isSubmitting && !examClosed) forceSubmit("❌ Keluar dari halaman seleksi, ujian berakhir."); });
    window.addEventListener('blur', () => { if (examState && !isSubmitting && !examClosed) forceSubmit("Pindah aplikasi = pelanggaran fatal."); });
    document.addEventListener('fullscreenchange', () => { if (!document.fullscreenElement && examState && !isSubmitting && !examClosed) forceSubmit("Keluar fullscreen, ujian dihentikan."); });
    window.addEventListener('keydown', (e) => { if (e.key === 'F12' || (e.ctrlKey && e.shiftKey && (e.key === 'I' || e.key === 'i')) || (e.ctrlKey && e.key === 'u') || (e.ctrlKey && e.key === 'c') || (e.ctrlKey && e.key === 'v')) { e.preventDefault(); violationInc(); } });
    document.addEventListener('contextmenu', e => e.preventDefault()); document.addEventListener('copy', e => e.preventDefault()); document.addEventListener('paste', e => e.preventDefault());
    setInterval(() => { if (examState && !isSubmitting && !examClosed && (window.outerHeight - window.innerHeight > 200 || window.outerWidth - window.innerWidth > 200)) violationInc(); }, 1800);
  }

  // Render Engine
  function renderPage(page, extra = {}) {
    const container = document.getElementById('mainApp');
    if (!container) return;
    if (page === 'login') {
      container.innerHTML = `<div class="container-premium"><div class="glass-premium" style="max-width: 620px; margin: 60px auto; padding: 56px 48px; text-align:center;"><img src="https://cdn.phototourl.com/free/2026-06-10-14462ae8-b80e-4052-8c31-c65b843c63e6.png" style="width: 80px;"><h1 style="margin: 24px 0 8px; font-weight:800;">SELEKSI DUTA PELAJAR BERBUDAYA</h1><p style="color:#6B7280;">Portal Seleksi Peserta</p><form id="loginForm"><input type="text" id="fullname" class="input-field" placeholder="Nama Lengkap" style="margin-top: 32px;"><input type="text" id="school" class="input-field" placeholder="Asal Sekolah" style="margin-top: 20px;"><input type="text" id="token" class="input-field" placeholder="Token Seleksi" style="margin-top: 20px;"><button type="submit" class="btn-primary" style="width:100%; margin-top: 40px;"><i class="fas fa-arrow-right"></i> MASUK SELEKSI</button></form><button id="restoreBtnPortal" class="btn-outline" style="margin-top: 28px;"><i class="fas fa-link"></i> Pulihkan dari Link Unik</button></div></div>`;
      document.getElementById('loginForm').addEventListener('submit', (e) => { e.preventDefault(); const nama = document.getElementById('fullname').value.trim(), sekolah = document.getElementById('school').value.trim(), token = document.getElementById('token').value.trim(); const valid = validateLogin(nama, sekolah, token); if (!valid.ok) return showToast(valid.msg, true); currentUser = valid.pesertaData; renderPage('dashboard'); });
      document.getElementById('restoreBtnPortal').onclick = async () => { if (!(await tryRestoreFromUrl())) showToast("Tidak ada sesi valid", true); };
    } 
    else if (page === 'dashboard') {
      container.innerHTML = `<div class="container-premium"><div class="glass-premium" style="padding: 48px;"><div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap;"><h2><i class="fas fa-id-card" style="color:#D4AF37;"></i> Dashboard Peserta</h2><span class="glass-premium" style="padding:6px 20px;">${new Date().toLocaleDateString('id-ID')}</span></div><div class="glass-premium" style="margin: 36px 0; padding: 32px; background: rgba(255,255,245,0.6);"><p><strong>${escapeHtml(currentUser.nama)}</strong><br>${escapeHtml(currentUser.sekolah)}<br>Token: ${currentUser.token}<br>Sesi: ${currentUser.start} — ${currentUser.end}<br>Status: <span style="color:#2C7A47;">Aktif & Terverifikasi</span></p><hr style="margin:20px 0; border-color:#E5E0D0;"><p>Selamat datang di Seleksi Nasional DPBI 2026. Pastikan koneksi stabil. Jumlah soal: ${BANK_SOAL.length} | Durasi: 60 menit</p></div><button id="toConfirm" class="btn-primary">Lanjut ke Konfirmasi Seleksi →</button></div></div>`;
      document.getElementById('toConfirm').onclick = () => renderPage('confirmation');
    }
    else if (page === 'confirmation') {
      container.innerHTML = `<div class="container-premium"><div class="glass-premium" style="max-width: 880px; margin: 40px auto; padding: 52px;"><h2>Konfirmasi Peserta</h2><div class="glass-premium" style="margin: 32px 0; padding: 28px;"><p><strong>${escapeHtml(currentUser.nama)}</strong><br>${escapeHtml(currentUser.sekolah)}<br>Token: ${currentUser.token}<br>Sesi: Aktif</p><hr><p>📚 Jumlah Soal: ${BANK_SOAL.length}<br>⏱️ Durasi: 60 menit<br>🏷️ Kategori: Kebudayaan & Pengetahuan Umum</p></div><label style="display: flex; gap: 16px; align-items:center;"><input type="checkbox" id="confirmCheck"> Saya menyatakan data diri benar dan siap mengikuti seleksi.</label><button id="toRulesBtn" class="btn-primary" style="margin-top: 36px;" disabled>Lanjut ke Petunjuk</button></div></div>`;
      const chk = document.getElementById('confirmCheck'), btn = document.getElementById('toRulesBtn');
      chk.onchange = () => btn.disabled = !chk.checked;
      btn.onclick = () => renderPage('rules');
    }
    else if (page === 'rules') {
      const rules = [
        { title: "Integritas Peserta", desc: "Mengerjakan secara mandiri tanpa bantuan siapapun." }, { title: "Larangan Perangkat Tambahan", desc: "Dilarang menggunakan perangkat lain, buku, atau media eksternal." },
        { title: "Larangan Keluar Tab", desc: "Wajib fokus di halaman ujian, keluar tab = pelanggaran fatal." }, { title: "Fullscreen Wajib", desc: "Ujian hanya berlangsung dalam mode layar penuh." },
        { title: "Anti Copy & Paste", desc: "Tidak dapat menyalin atau menempel teks." }, { title: "Anti Screenshot", desc: "Sistem mendeteksi akses tangkapan layar." },
        { title: "Deteksi Minimize", desc: "Mengurangi jendela browser dicatat sebagai pelanggaran." }, { title: "Maksimal 3 Pelanggaran", desc: "Jika mencapai 3, ujian otomatis berakhir." },
        { title: "Auto-Save & Pemulihan", desc: "Jawaban tersimpan otomatis, Anda dapat melanjutkan di perangkat yang sama." }, { title: "Link Unik Sesi", desc: "Sesi hanya dapat dipulihkan di perangkat yang sama, tidak dapat dibuka di perangkat lain." },
        { title: "Durasi Mutlak", desc: "Timer 60 menit, jika habis otomatis dikumpulkan." }, { title: "Keputusan Panitia", desc: "Keputusan final sistem bersifat mutlak." }
      ];
      container.innerHTML = `<div class="container-premium"><div class="glass-premium" style="max-width: 1100px; margin: 40px auto; padding: 52px;"><h2>📜 Peraturan Resmi Seleksi DPBI</h2><div style="display:grid; grid-template-columns:repeat(auto-fill, minmax(280px,1fr)); gap:24px; margin:36px 0;">${rules.map(r => `<div class="glass-premium" style="padding:20px;"><h4 style="color:#C9A227;">${r.title}</h4><p style="font-size:0.9rem;">${r.desc}</p></div>`).join('')}</div><div style="background:#FEF9E6; border-radius:32px; padding:20px;"><label><input type="checkbox" id="agreeRules"> Saya telah membaca dan memahami seluruh peraturan.</label><div id="ruleCountdown" style="margin: 24px 0 10px; font-weight:600;">⏳ Harap tunggu 10 detik</div><button id="startExamFinal" class="btn-primary" disabled>MULAI UJIAN NASIONAL</button></div></div></div>`;
      let count = 10, btnStart = document.getElementById('startExamFinal'), cdDiv = document.getElementById('ruleCountdown'), agreeChk = document.getElementById('agreeRules');
      const interval = setInterval(() => { count--; cdDiv.innerText = `⏳ Konfirmasi peraturan (${count} detik) ...`; if (count <= 0) { clearInterval(interval); cdDiv.innerText = "✅ Anda siap memulai seleksi."; if (agreeChk.checked) btnStart.disabled = false; } }, 1000);
      agreeChk.onchange = () => { if (agreeChk.checked && count <= 0) btnStart.disabled = false; else btnStart.disabled = true; };
      btnStart.onclick = async () => { const soalConfig = prepareExamSoals(BANK_SOAL); examState = initExam(currentUser, soalConfig); saveExamToLocal(); renderPage('exam'); startTimer(); startAutoSave(); activateAntiCheat(); try { await document.documentElement.requestFullscreen(); } catch(e) { showToast("Aktifkan fullscreen manual", false); } };
    }
    else if (page === 'exam') {
      if (!examState) { renderPage('login'); return; }
      container.innerHTML = `<div class="container-premium"><div style="position:fixed; top:24px; right:36px; z-index:200;" class="glass-premium" id="globalTimer" style="padding:8px 28px; font-weight:800; letter-spacing:2px;">01:00:00</div><div class="exam-layout"><div class="exam-sidebar glass-premium" style="padding:28px;"><div style="margin-bottom:28px;"><i class="fas fa-user-circle"></i> <strong>${escapeHtml(examState.nama)}</strong><br><span style="font-size:0.8rem;">${escapeHtml(examState.sekolah)}</span></div><hr><div style="margin:20px 0;"><p>📊 Progress Ujian</p><div>Dijawab: <span id="answeredCount">0</span>/${examState.soalConfig.length}</div><div>Belum: <span id="unansweredCount">${examState.soalConfig.length}</span></div><div>⚠️ Pelanggaran: <span id="violationBadge">${examState.violations}</span>/3</div></div><hr><button id="uniqueLinkButton" class="btn-outline" style="width:100%; margin:20px 0;"><i class="fas fa-link"></i> Link Unik (1 Device)</button><button id="submitReviewSide" class="btn-primary" style="width:100%;">Review & Kumpulkan</button></div><div class="exam-content"><div class="glass-premium" style="padding: 32px;"><div id="soalHeader"></div><div id="soalBody"></div><div style="display: flex; justify-content: space-between; margin-top: 32px;"><button id="prevBtn" class="btn-outline"><i class="fas fa-chevron-left"></i> Sebelumnya</button><button id="nextBtn" class="btn-outline">Selanjutnya <i class="fas fa-chevron-right"></i></button></div><div id="navPills" style="display: flex; flex-wrap: wrap; gap: 12px; margin-top: 32px;"></div></div></div></div></div>`;
      updateTimerUI();
      function renderCurrentQuestion() {
        const qc = examState.soalConfig[currentQuestionIndex];
        const soal = qc.original;
        let html = `<h3>Soal ${currentQuestionIndex+1} dari ${examState.soalConfig.length}</h3><div style="margin:24px 0;"><div style="font-size:1.2rem; font-weight:600;">${escapeHtml(soal.pertanyaan)}</div>`;
        if (soal.gambar && soal.gambar.trim()) html += `<img src="${soal.gambar}" class="exam-image" id="zoomableImg" data-src="${soal.gambar}">`;
        html += `<div style="margin-top:28px;">`;
        qc.shuffledOptions.forEach(opt => { html += `<div class="option-card ${qc.userAnswer === opt.letter ? 'selected' : ''}" data-letter="${opt.letter}">${opt.letter}. ${escapeHtml(opt.text)}</div>`; });
        html += `</div></div>`;
        document.getElementById('soalBody').innerHTML = html;
        document.querySelectorAll('.option-card').forEach(el => { el.addEventListener('click', () => { const letter = el.dataset.letter; examState.soalConfig[currentQuestionIndex].userAnswer = letter; examState.answers[currentQuestionIndex] = letter; saveExamToLocal(); renderCurrentQuestion(); buildNavigasi(); updateStats(); }); });
        const imgZoom = document.getElementById('zoomableImg'); if(imgZoom) imgZoom.addEventListener('click', () => { const modal = document.getElementById('imageModal'); document.getElementById('modalImg').src = imgZoom.dataset.src; modal.style.visibility = 'visible'; modal.style.opacity = 1; });
      }
      function buildNavigasi() { const nav = document.getElementById('navPills'); nav.innerHTML = ''; for (let i=0; i<examState.soalConfig.length; i++) { const pill = document.createElement('div'); pill.className = 'nav-pill'; if (examState.answers[i] !== null) pill.classList.add('answered'); if (i === currentQuestionIndex) pill.classList.add('active'); pill.innerText = i+1; pill.onclick = () => { currentQuestionIndex = i; renderCurrentQuestion(); buildNavigasi(); }; nav.appendChild(pill); } }
      function updateStats() { const answered = examState.answers.filter(a => a !== null).length; document.getElementById('answeredCount').innerText = answered; document.getElementById('unansweredCount').innerText = examState.soalConfig.length - answered; document.getElementById('violationBadge').innerText = examState.violations; }
      renderCurrentQuestion(); buildNavigasi(); updateStats();
      document.getElementById('prevBtn').onclick = () => { if (currentQuestionIndex > 0) currentQuestionIndex--; renderCurrentQuestion(); buildNavigasi(); };
      document.getElementById('nextBtn').onclick = () => { if (currentQuestionIndex < examState.soalConfig.length-1) currentQuestionIndex++; renderCurrentQuestion(); buildNavigasi(); };
      document.getElementById('submitReviewSide').onclick = () => renderPage('review');
      document.getElementById('uniqueLinkButton').onclick = () => { const link = generateUniqueLink(); if (link) { navigator.clipboard.writeText(link); showToast("Link unik tersalin! (hanya device yang sama)", false); } else showToast("Gagal", true); };
    }
    else if (page === 'review') {
      let listHtml = ''; for (let i=0; i<examState.soalConfig.length; i++) { const status = examState.answers[i] ? '✓ Terjawab' : '⚠️ Belum'; listHtml += `<div class="glass-premium" style="padding:16px 24px; margin:12px 0; display:flex; justify-content:space-between;"><span>Soal ${i+1}</span><span>${status}</span></div>`; }
      container.innerHTML = `<div class="container-premium"><div class="glass-premium" style="max-width:800px; margin:40px auto; padding:48px;"><h2>Review Jawaban</h2>${listHtml}<div style="margin-top:40px;"><button id="backToExam" class="btn-outline">Kembali ke Ujian</button><button id="confirmFinal" class="btn-primary" style="margin-left:20px;">Kumpulkan Jawaban</button></div></div></div>`;
      document.getElementById('backToExam').onclick = () => renderPage('exam');
      document.getElementById('confirmFinal').onclick = () => renderPage('finalConfirm');
    }
    else if (page === 'finalConfirm') {
      container.innerHTML = `<div class="container-premium"><div class="glass-premium" style="max-width:680px; margin:80px auto; padding:52px; text-align:center;"><i class="fas fa-gavel" style="font-size:64px; color:#D4AF37;"></i><h3>Konfirmasi Akhir</h3><p>Apakah Anda yakin ingin mengumpulkan jawaban? Setelah dikumpulkan tidak dapat diubah kembali.</p><label style="margin:28px 0; display:flex; gap:12px; justify-content:center;"><input type="checkbox" id="finalConfirmChk"> Ya, saya yakin.</label><button id="finalSubmitBtn" class="btn-primary" disabled>KUMPULKAN SEKARANG</button></div></div>`;
      const chk = document.getElementById('finalConfirmChk'), btn = document.getElementById('finalSubmitBtn');
      chk.onchange = () => btn.disabled = !chk.checked;
      btn.onclick = async () => { await computeAndSendResult(); };
    }
    else if (page === 'success') {
      container.innerHTML = `<div class="container-premium"><div class="glass-premium" style="max-width:780px; margin:80px auto; padding:64px; text-align:center;"><div style="background: linear-gradient(145deg, #F5E7A3, #D4AF37); width: 100px; height:100px; border-radius:100px; margin:0 auto 32px; display:flex; align-items:center; justify-content:center;"><i class="fas fa-check" style="font-size:48px; color:#1F2937;"></i></div><h1>Terima Kasih</h1><p style="margin-top:16px;">Jawaban Anda telah berhasil dikirim ke Panitia Nasional DPBI. Proses seleksi akan dilanjutkan ke tahap penilaian.</p><div style="background: #FEF9E6; border-radius:48px; padding:32px; margin: 40px 0;"><i class="fab fa-instagram" style="font-size:42px; color:#C9A227;"></i><p style="font-weight:600;">📸 Screenshoot halaman ini dan unggah ke Instagram Story.<br>Tag <strong>@dutapelajarberbudaya</strong> sebagai bentuk partisipasi.</p><a href="https://instagram.com/dutapelajarberbudaya" target="_blank" class="btn-primary" style="display:inline-block; margin-top:16px;">Buka Instagram</a></div><button id="homeBtn" class="btn-outline">Kembali ke Beranda</button></div></div>`;
      document.getElementById('homeBtn').onclick = () => window.location.reload();
    }
  }

  function escapeHtml(str) { if(!str) return ''; return str.replace(/[&<>]/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[m])); }
  
  // Loading simulation
  window.onload = async () => {
    const progress = document.getElementById('loadProgress'), loadText = document.getElementById('loadText'), retryBtn = document.getElementById('retryLoad');
    try {
      progress.style.width = "40%"; loadText.innerText = "Menjalin database peserta ..."; await new Promise(r => setTimeout(r, 600));
      progress.style.width = "80%"; loadText.innerText = "Memuat bank soal kebudayaan ..."; await new Promise(r => setTimeout(r, 600));
      progress.style.width = "100%"; loadText.innerText = "Sistem Seleksi DPBI siap.";
      await new Promise(r => setTimeout(r, 400));
      document.getElementById('loader').style.display = 'none';
      document.getElementById('mainApp').style.display = 'block';
      if (restoreExamLocal() && examState && !isExamCompleted(examState.token)) { renderPage('exam'); startTimer(); startAutoSave(); activateAntiCheat(); document.documentElement.requestFullscreen().catch(e=>null); } 
      else if (window.location.search.includes('restore')) await tryRestoreFromUrl();
      else renderPage('login');
    } catch(err) { loadText.innerText = "Gagal koneksi sistem. Refresh."; retryBtn.style.display = 'inline-block'; retryBtn.onclick = () => window.location.reload(); }
  };
  document.getElementById('imageModal')?.addEventListener('click', (e) => { const modal = document.getElementById('imageModal'); if (e.target === modal || e.target.tagName === 'SPAN') { modal.style.visibility = 'hidden'; modal.style.opacity = 0; } });
</script>
</body>
</html>
