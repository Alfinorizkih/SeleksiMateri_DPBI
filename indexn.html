<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>DPBI 2026 - Seleksi Nasional Duta Pelajar Berbudaya</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: 'Poppins', sans-serif;
      background: radial-gradient(circle at 10% 20%, rgba(250, 251, 252, 1) 0%, rgba(245, 242, 234, 1) 100%);
      min-height: 100vh;
      position: relative;
      overflow-x: hidden;
    }

    /* background floating orbs */
    .bg-ornament {
      position: fixed;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 0;
    }
    .bg-ornament .orb {
      position: absolute;
      border-radius: 50%;
      filter: blur(80px);
      opacity: 0.4;
    }
    .orb-1 { width: 50vw; height: 50vw; background: #F4D35E; top: -20vh; left: -20vw; }
    .orb-2 { width: 40vw; height: 40vw; background: #E8C76A; bottom: -15vh; right: -15vw; }
    .orb-3 { width: 30vw; height: 30vw; background: #C9A227; top: 40%; left: 60%; opacity: 0.2; }

    /* container utama */
    .app-container {
      position: relative;
      z-index: 10;
      max-width: 1440px;
      margin: 0 auto;
      padding: 28px 36px;
    }

    /* GLASS CARD PREMIUM */
    .glass-premium {
      background: rgba(255, 255, 255, 0.82);
      backdrop-filter: blur(16px);
      border-radius: 36px;
      box-shadow: 0 20px 45px -12px rgba(0, 0, 0, 0.12), 0 1px 2px rgba(255,255,255,0.6);
      border: 1px solid rgba(212, 175, 55, 0.25);
      transition: all 0.3s cubic-bezier(0.2, 0, 0, 1);
    }
    .glass-premium:hover {
      box-shadow: 0 25px 50px -12px rgba(201, 162, 39, 0.2);
      border-color: rgba(212, 175, 55, 0.4);
    }

    /* BUTTON GOLD PREMIUM */
    .btn-gold {
      background: linear-gradient(135deg, #C9A227 0%, #D4AF37 40%, #F4D35E 100%);
      border: none;
      padding: 14px 36px;
      font-weight: 700;
      border-radius: 60px;
      color: white;
      transition: all 0.25s ease;
      box-shadow: 0 12px 24px -8px rgba(201, 162, 39, 0.4);
      cursor: pointer;
      font-size: 1rem;
      letter-spacing: 0.5px;
      font-family: 'Poppins', sans-serif;
    }
    .btn-gold:hover {
      transform: translateY(-2px);
      box-shadow: 0 20px 30px -8px rgba(201, 162, 39, 0.6);
      background: linear-gradient(135deg, #B48C1A, #D4AF37, #E8C76A);
    }
    .btn-gold:active { transform: translateY(1px); }

    .btn-outline-gold {
      background: transparent;
      border: 1.5px solid #D4AF37;
      color: #C9A227;
      padding: 10px 28px;
      border-radius: 60px;
      font-weight: 600;
      cursor: pointer;
      transition: 0.2s;
      backdrop-filter: blur(4px);
    }
    .btn-outline-gold:hover {
      background: rgba(212,175,55,0.15);
      transform: translateY(-2px);
      box-shadow: 0 6px 12px rgba(0,0,0,0.05);
      border-color: #C9A227;
    }

    /* INPUT PREMIUM */
    .input-premium {
      border: 1.5px solid rgba(212,175,55,0.3);
      border-radius: 60px;
      padding: 14px 24px;
      font-size: 1rem;
      width: 100%;
      background: rgba(255,255,255,0.95);
      transition: all 0.2s;
      font-family: 'Poppins', sans-serif;
      outline: none;
    }
    .input-premium:focus {
      border-color: #D4AF37;
      box-shadow: 0 0 0 4px rgba(212, 175, 55, 0.2);
      background: white;
    }

    /* TIMER FLOATING */
    .timer-premium {
      position: fixed;
      top: 28px;
      right: 36px;
      background: rgba(0, 0, 0, 0.85);
      backdrop-filter: blur(12px);
      padding: 10px 24px;
      border-radius: 60px;
      color: #F4D35E;
      font-weight: 800;
      font-size: 1.3rem;
      z-index: 200;
      font-family: monospace;
      border: 1px solid rgba(212, 175, 55, 0.6);
      box-shadow: 0 10px 25px rgba(0,0,0,0.2);
      letter-spacing: 1px;
    }

    /* SOAL CARD */
    .soal-card-premium {
      background: white;
      border-radius: 32px;
      padding: 32px;
      box-shadow: 0 15px 30px rgba(0, 0, 0, 0.05);
      border-left: 6px solid #D4AF37;
    }
    .option-premium {
      background: #FCFAF5;
      border-radius: 28px;
      padding: 16px 24px;
      margin: 14px 0;
      cursor: pointer;
      border: 1px solid #EFE9DB;
      transition: all 0.2s;
      font-weight: 500;
    }
    .option-premium.selected {
      border: 2px solid #D4AF37;
      background: linear-gradient(120deg, #FFF7E8, #FFF2DD);
      box-shadow: 0 8px 18px rgba(201, 162, 39, 0.15);
    }
    .pill-soal-premium {
      background: #F1F2F6;
      border-radius: 60px;
      padding: 10px 0;
      font-weight: 700;
      cursor: pointer;
      text-align: center;
      min-width: 52px;
      transition: 0.15s;
    }
    .pill-soal-premium.answered { background: #D4AF37; color: white; box-shadow: 0 4px 10px rgba(212,175,55,0.4); }
    .pill-soal-premium.active { border: 2px solid #C9A227; background: #FFF2CC; color: #B48C1A; transform: scale(1.02); }

    /* PROGRESS BAR */
    .progress-gold-premium {
      height: 8px;
      background: #E9E4D4;
      border-radius: 20px;
      overflow: hidden;
    }
    .progress-fill-gold {
      height: 100%;
      background: linear-gradient(90deg, #C9A227, #F4D35E);
      width: 0%;
      transition: width 0.3s;
    }

    /* TOAST */
    .toast-premium {
      position: fixed;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%) scale(0.9);
      background: rgba(30, 41, 59, 0.95);
      backdrop-filter: blur(16px);
      color: white;
      padding: 14px 28px;
      border-radius: 80px;
      font-weight: 600;
      z-index: 3000;
      opacity: 0;
      transition: 0.2s;
      pointer-events: none;
      font-size: 0.9rem;
      box-shadow: 0 15px 30px -10px black;
    }
    .toast-premium.show { opacity: 1; transform: translateX(-50%) scale(1); }

    /* MODAL PREMIUM */
    .image-modal {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.94);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 4000;
      visibility: hidden;
      opacity: 0;
      transition: 0.2s;
    }
    .image-modal img { max-width: 90%; max-height: 90%; border-radius: 28px; }

    footer {
      text-align: center;
      margin-top: 48px;
      padding: 24px 0 12px;
      font-size: 0.75rem;
      color: #7A6A42;
      border-top: 1px solid rgba(212,175,55,0.2);
    }

    @media (max-width: 768px) {
      .app-container { padding: 16px; }
      .timer-premium { top: 12px; right: 16px; padding: 6px 16px; font-size: 1rem; }
    }
  </style>
</head>
<body>
<div class="bg-ornament">
  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>
  <div class="orb orb-3"></div>
</div>

<!-- LOADING PREMIUM -->
<div id="loadingScreen" style="position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(255,252,240,0.98); backdrop-filter:blur(20px); z-index:5000; display:flex; align-items:center; justify-content:center; flex-direction:column;">
  <div style="text-align:center;">
    <div style="background: white; border-radius: 100px; padding: 24px; display: inline-block; box-shadow: 0 20px 30px rgba(0,0,0,0.1);">
      <img src="https://cdn.phototourl.com/free/2026-06-10-14462ae8-b80e-4052-8c31-c65b843c63e6.png" alt="Logo DPBI" style="width: 80px;">
    </div>
    <h2 style="margin-top: 28px; font-weight: 800;">Duta Pelajar Berbudaya</h2>
    <p style="margin-top: 8px; color: #5A4A2E;">Seleksi Nasional 2026</p>
    <p id="loadStatus" style="margin-top: 28px; font-weight: 500;">Mempersiapkan sistem...</p>
    <div class="progress-gold-premium" style="width: 300px; margin-top: 20px;"><div class="progress-fill-gold" id="loadProgressFill"></div></div>
    <p id="loadPercent" style="margin-top: 12px; font-weight: 600;">0%</p>
    <button id="retryLoad" style="display:none; margin-top: 28px;" class="btn-gold"><i class="fas fa-sync-alt"></i> Muat Ulang</button>
  </div>
</div>

<div class="app-container" id="mainApp" style="display: none;">
  <div id="pageRenderer"></div>
</div>

<div id="toastMsg" class="toast-premium"></div>
<div id="imageModal" class="image-modal"><img id="modalImgSrc" alt=""><span style="position:absolute; top:30px; right:40px; color:white; font-size:48px; cursor:pointer;" id="closeModalBtn">&times;</span></div>

<script>
  const encodedSheet = "aHR0cHM6Ly9kb2NzLmdvb2dsZS5jb20vc3ByZWFkc2hlZXRzL2QvMTdCZFFIQ2l3bVJuZm5oaElUUTdNRFRRamVNaGkweTlQNDZxTFZmcVpnM0EvZXhwb3J0P2Zvcm1hdD1jc3YmZ2lkPTA=";
  const SHEET_PESERTA_URL = atob(encodedSheet);
    const SOAL_JSON_URL = "https://raw.githubusercontent.com/Alfinorizkih/SeleksiMateri_DPBI/refs/heads/main/soal.json";
  
  const BOT_TOKEN = "8611068552:AAHCleWMDayr9Udwer2KmVVABR_X8pzgadw";
  const CHAT_ID = "7509429091";
  
  const PROXIES = [
    (url) => `https://api.allorigins.win/raw?url=${encodeURIComponent(url)}`,
    (url) => `https://corsproxy.io/?${encodeURIComponent(url)}`,
    (url) => `https://cors-anywhere.herokuapp.com/${url}`
  ];
  
  let globalPeserta = [];
  let currentUser = null;
  let examState = null; 
  let timerInterval = null, autoSaveInterval = null;
  let isSubmitting = false, examForcedClosed = false, currentQuestionIndex = 0;
  let soalBank = [];
  function showToast(msg) { let t = document.getElementById('toastMsg'); t.innerText = msg; t.classList.add('show'); setTimeout(() => t.classList.remove('show'), 3000); }
  function escapeHtml(str) { if (!str) return ''; return str.replace(/[&<>]/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[m])); }
  function parseCSV(csvText) {
    const lines = csvText.split(/\r?\n/).filter(l => l.trim());
    if (lines.length < 2) return [];
    const headers = lines[0].split(',').map(h => h.trim().replace(/^\uFEFF/, ''));
    const rows = [];
    for (let i = 1; i < lines.length; i++) {
      const vals = lines[i].split(',');
      let obj = {};
      headers.forEach((h, idx) => { obj[h] = vals[idx] ? vals[idx].trim() : ""; });
      rows.push(obj);
    }
    return rows;
  }
  async function fetchWithProxy(url) {
    try { let r = await fetch(url); if (r.ok) return await r.text(); } catch(e) {}
    for (let proxy of PROXIES) {
      try { let r = await fetch(proxy(url)); if (r.ok) { let txt = await r.text(); if (txt.includes(',') && (txt.includes('Nama Lengkap') || txt.includes('Token'))) return txt; } } catch(e) {}
    }
    throw new Error("Gagal mengakses database peserta. Pastikan sheet sudah dipublikasikan ke web (CSV).");
  }
  async function loadPeserta() {
    let csv = await fetchWithProxy(SHEET_PESERTA_URL);
    let pesertaRaw = parseCSV(csv);
    if (!pesertaRaw.length) throw new Error("Data peserta kosong.");
    globalPeserta = pesertaRaw.map(p => {
      if (p['Nama Sekolah'] && !p['Asal Sekolah']) p['Asal Sekolah'] = p['Nama Sekolah'];
      if (!p['Status']) p['Status'] = 'BELUM';
      return p;
    });
  }
  async function loadSoalEksternal() {
    let res = await fetch(SOAL_JSON_URL);
    if (!res.ok) throw new Error("Gagal mengambil soal dari server resmi.");
    let data = await res.json();
    if (!Array.isArray(data) || data.length === 0) throw new Error("Soal tidak valid.");
    // validasi struktur minimal
    soalBank = data.map((q, idx) => ({ ...q, id: idx+1 }));
    return true;
  }
  
  // Token & sesi
  function getCompletedTokens() { return JSON.parse(localStorage.getItem('dpbi_completed_tokens') || '[]'); }
  function addCompletedToken(token) { let a = getCompletedTokens(); if (!a.includes(token)) a.push(token); localStorage.setItem('dpbi_completed_tokens', JSON.stringify(a)); }
  function loginValidate(nama, sekolah, token) {
    let p = globalPeserta.find(p => p["Nama Lengkap"]?.toLowerCase().trim() === nama.toLowerCase().trim() && p["Asal Sekolah"]?.toLowerCase().trim() === sekolah.toLowerCase().trim() && p["Token"] === token);
    if (!p) return { success: false, msg: "Data tidak cocok dengan database nasional." };
    if (p["Status"] !== "BELUM") return { success: false, msg: "Akun sudah menyelesaikan seleksi." };
    if (getCompletedTokens().includes(token)) return { success: false, msg: "Token sudah pernah digunakan." };
    let now = new Date(), start = new Date(p["Waktu Mulai Token"]), end = new Date(p["Waktu Selesai Token"]);
    if (isNaN(start) || isNaN(end)) return { success: false, msg: "Format waktu token invalid." };
    if (now < start || now > end) return { success: false, msg: "Token tidak berlaku dalam periode ini." };
    return { success: true, pesertaData: p };
  }
  
  // Acak fungsi
  function shuffleArray(arr) { for (let i = arr.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [arr[i], arr[j]] = [arr[j], arr[i]]; } return arr; }
  function prepareSoalConfig(soalArray) {
    let shuffledSoal = shuffleArray([...soalArray]);
    return shuffledSoal.map(soal => {
      let shuffledOptions = [], correctKey = "";
      if (soal.jenis === "Pilihan Ganda") {
        let choices = Object.entries(soal.pilihan).map(([letter, text]) => ({ letter, text }));
        let shuffled = shuffleArray([...choices]);
        let correctText = soal.pilihan[soal.jawaban];
        let newCorrect = shuffled.find(opt => opt.text === correctText)?.letter || "A";
        shuffledOptions = shuffled;
        correctKey = newCorrect;
      } else if (soal.jenis === "Benar Salah") {
        let bs = [{letter:"Benar",text:"Benar"},{letter:"Salah",text:"Salah"}];
        shuffledOptions = shuffleArray([...bs]);
        correctKey = (soal.jawaban === "Benar") ? "Benar" : "Salah";
      } else {
        // fallback
        shuffledOptions = [];
      }
      return { original: soal, shuffledOptions, correctAnswerKey: correctKey, userAnswer: null };
    });
  }
  function initExamState(participant, soalConfig) {
    return {
      token: participant.Token,
      nama: participant["Nama Lengkap"],
      sekolah: participant["Asal Sekolah"],
      soalConfig: soalConfig,
      answers: new Array(soalConfig.length).fill(null),
      remainingSeconds: 60 * 60, // 60 menit
      violations: 0,
      startTime: Date.now(),
    };
  }
  function saveExamToLocal() { if(examState) localStorage.setItem('dpbi_exam_state', JSON.stringify(examState)); }
  function restoreExam() {
    let saved = localStorage.getItem('dpbi_exam_state');
    if (!saved) return false;
    try {
      let parsed = JSON.parse(saved);
      if (parsed && !getCompletedTokens().includes(parsed.token)) {
        examState = parsed;
        currentUser = globalPeserta.find(p => p.Token === parsed.token) || { "Nama Lengkap": parsed.nama, "Asal Sekolah": parsed.sekolah, Token: parsed.token };
        return true;
      }
    } catch(e) { }
    return false;
  }
  function updateTimerDisplay() { if (examState && document.getElementById('floatingTimer')) { let s = examState.remainingSeconds, h = Math.floor(s/3600), m = Math.floor((s%3600)/60), sec = s%60; document.getElementById('floatingTimer').innerText = `${h.toString().padStart(2,'0')}:${m.toString().padStart(2,'0')}:${sec.toString().padStart(2,'0')}`; } }
  function startTimer() { if (timerInterval) clearInterval(timerInterval); timerInterval = setInterval(() => { if (!examState || examState.remainingSeconds <= 0) { if (examState && examState.remainingSeconds <= 0 && !isSubmitting) forceSubmit("⏰ Waktu seleksi habis!"); clearInterval(timerInterval); return; } examState.remainingSeconds--; updateTimerDisplay(); saveExamToLocal(); if (examState.remainingSeconds === 0) forceSubmit("Waktu habis!"); }, 1000); }
  function startAutoSave() { if (autoSaveInterval) clearInterval(autoSaveInterval); autoSaveInterval = setInterval(() => { if (examState && !isSubmitting) saveExamToLocal(); }, 1000); }
  async function sendTelegramResult(nama, sekolah, pelanggaran) {
    let msg = `🎓 *HASIL SELEKSI DPBI 2026* 🎓\n👤 *Nama:* ${nama}\n🏫 *Sekolah:* ${sekolah}\n⚠️ *Pelanggaran:* ${pelanggaran}\n✅ *Status:* Selesai\n🕒 *Waktu:* ${new Date().toLocaleString()}\n\n*Catatan:* Nilai diproses internal panitia.`;
    try { await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ chat_id: CHAT_ID, text: msg, parse_mode: 'Markdown' }) }); } catch(e) { }
  }
  async function forceSubmit(reason) {
    if (isSubmitting || examForcedClosed) return;
    examForcedClosed = true;
    if (timerInterval) clearInterval(timerInterval);
    if (autoSaveInterval) clearInterval(autoSaveInterval);
    isSubmitting = true;
    showToast(reason);
    await sendTelegramResult(examState.nama, examState.sekolah, examState.violations);
    addCompletedToken(examState.token);
    localStorage.removeItem('dpbi_exam_state');
    renderPage('selesai', { forced: true });
  }
  async function finalSubmit() {
    if (isSubmitting) return;
    isSubmitting = true;
    if (timerInterval) clearInterval(timerInterval);
    if (autoSaveInterval) clearInterval(autoSaveInterval);
    await sendTelegramResult(examState.nama, examState.sekolah, examState.violations);
    addCompletedToken(examState.token);
    localStorage.removeItem('dpbi_exam_state');
    renderPage('selesai', { forced: false });
  }
  
  // ANTI CHEAT SUPER KETAT
  function activateStrictAntiCheat() {
    if (!examState) return;
    const handleVisibility = () => { if (document.hidden && examState && !isSubmitting && !examForcedClosed) forceSubmit("⚠️ PELANGGARAN: Meninggalkan halaman ujian. Ujian dihentikan."); };
    const handleBlur = () => { if (examState && !isSubmitting && !examForcedClosed) forceSubmit("⚠️ PELANGGARAN: Aplikasi lain terbuka. Ujian dikumpulkan."); };
    document.addEventListener('visibilitychange', handleVisibility);
    window.addEventListener('blur', handleBlur);
    window.addEventListener('beforeunload', (e) => { if (examState && !isSubmitting && !examForcedClosed) forceSubmit("Penutupan halaman terdeteksi."); });
    const fullHandler = () => { if (!document.fullscreenElement && examState && !isSubmitting && !examForcedClosed) forceSubmit("❌ Keluar dari layar penuh. Ujian berakhir."); };
    document.addEventListener('fullscreenchange', fullHandler);
    window.addEventListener('keydown', (e) => {
      if (e.key === 'F12' || (e.ctrlKey && e.shiftKey && (e.key === 'I' || e.key === 'i')) || (e.ctrlKey && e.key === 'u') || (e.ctrlKey && e.key === 'p') || (e.ctrlKey && e.key === 'c') || (e.ctrlKey && e.key === 'v') || (e.ctrlKey && e.key === 's')) {
        e.preventDefault();
        if (examState && !isSubmitting && !examForcedClosed) { examState.violations++; saveExamToLocal(); if (examState.violations >= 3) forceSubmit("Batas pelanggaran (3) tercapai."); else showToast(`Pelanggaran ke-${examState.violations}`); }
      }
      if (e.ctrlKey && e.key === 'Tab') { e.preventDefault(); forceSubmit("Tab switching dilarang."); }
    });
    document.addEventListener('contextmenu', e => e.preventDefault());
    document.addEventListener('copy', e => e.preventDefault());
    document.addEventListener('cut', e => e.preventDefault());
    document.addEventListener('paste', e => e.preventDefault());
  }
  
  // RENDER ENGINE PREMIUM
  function renderPage(page, params = {}) {
    const container = document.getElementById('pageRenderer');
    if (!container) return;
    if (page === 'login') {
      container.innerHTML = `
        <div class="glass-premium" style="max-width: 580px; margin: 0 auto; padding: 48px 40px;">
          <div style="text-align:center;"><img src="https://cdn.phototourl.com/free/2026-06-10-14462ae8-b80e-4052-8c31-c65b843c63e6.png" style="width: 90px; margin-bottom: 10px;"><h2 style="margin: 16px 0 6px;">Seleksi DPBI 2026</h2><p style="color:#6B5B35;">Portal Resmi Peserta</p></div>
          <form id="loginForm" style="margin-top: 32px;">
            <input type="text" id="namaLogin" class="input-premium" placeholder="Nama Lengkap" autocomplete="off"><br><br>
            <input type="text" id="sekolahLogin" class="input-premium" placeholder="Asal Sekolah" autocomplete="off"><br><br>
            <input type="text" id="tokenLogin" class="input-premium" placeholder="Token Seleksi" autocomplete="off"><br><br>
            <button type="submit" class="btn-gold" style="width:100%;"><i class="fas fa-arrow-right-to-bracket"></i> MASUK SELEKSI</button>
          </form>
        </div>
        <footer>© 2026 Duta Pelajar Berbudaya Indonesia — Sistem Seleksi Nasional</footer>
      `;
      document.getElementById('loginForm')?.addEventListener('submit', async (e) => {
        e.preventDefault();
        let nama = document.getElementById('namaLogin').value.trim(), sekolah = document.getElementById('sekolahLogin').value.trim(), token = document.getElementById('tokenLogin').value.trim();
        let res = loginValidate(nama, sekolah, token);
        if (!res.success) { showToast(res.msg); return; }
        currentUser = res.pesertaData;
        renderPage('dashboard');
      });
    } 
    else if (page === 'dashboard') {
      let nomor = 'DPBI' + Math.floor(Math.random() * 9000 + 1000);
      container.innerHTML = `
        <div class="glass-premium" style="max-width: 880px; margin: 0 auto; padding: 40px;">
          <div style="display:flex; align-items:center; gap:20px; flex-wrap:wrap;"><img src="https://cdn.phototourl.com/free/2026-06-10-14462ae8-b80e-4052-8c31-c65b843c63e6.png" style="width: 60px;"><h2>Selamat Datang, ${escapeHtml(currentUser["Nama Lengkap"])}</h2></div>
          <div style="background: linear-gradient(145deg, #FEF7E0, #FFFBF0); border-radius: 32px; padding: 28px; margin: 28px 0;">
            <div><i class="fas fa-id-card"></i> <strong>Nama:</strong> ${escapeHtml(currentUser["Nama Lengkap"])}</div>
            <div><i class="fas fa-school"></i> <strong>Sekolah:</strong> ${escapeHtml(currentUser["Asal Sekolah"])}</div>
            <div><i class="fas fa-key"></i> <strong>Token:</strong> ${currentUser.Token}</div>
            <div><i class="fas fa-barcode"></i> <strong>Nomor Peserta:</strong> ${nomor}</div>
            <div><i class="fas fa-calendar-alt"></i> <strong>Periode Token:</strong> ${currentUser["Waktu Mulai Token"]} s/d ${currentUser["Waktu Selesai Token"]}</div>
            <div><i class="fas fa-flag-checkered"></i> <strong>Status:</strong> ${currentUser.Status}</div>
          </div>
          <p><i class="fas fa-info-circle"></i> Seleksi berjumlah <strong>${soalBank.length}</strong> soal, durasi 60 menit. Sistem anti-kecurangan aktif.</p>
          <button id="toConfirm" class="btn-gold" style="margin-top: 28px;"><i class="fas fa-forward"></i> LANJUT KE KONFIRMASI</button>
        </div>
      `;
      document.getElementById('toConfirm')?.addEventListener('click', () => renderPage('confirm'));
    }
    else if (page === 'confirm') {
      let nomor = 'DPBI' + Math.floor(Math.random() * 9000 + 1000);
      container.innerHTML = `
        <div class="glass-premium" style="max-width: 800px; margin: 0 auto; padding: 40px;">
          <h2><i class="fas fa-clipboard-list"></i> Konfirmasi Tes</h2>
          <div style="background:#FBF9F2; border-radius:28px; padding:20px; margin:20px 0;"><h3>Data Peserta</h3><p>Nama: ${escapeHtml(currentUser["Nama Lengkah"])}<br>Sekolah: ${escapeHtml(currentUser["Asal Sekolah"])}<br>Token: ${currentUser.Token}<br>Nomor: ${nomor}</p><h3>Informasi Tes</h3><p>Jumlah Soal: ${soalBank.length}<br>Jenis: Pilihan Ganda & Benar Salah<br>Durasi: 60 menit<br>Sistem Anti Kecurangan: Fullscreen wajib, pelanggaran otomatis kumpul</p></div>
          <label style="display:flex; gap:12px;"><input type="checkbox" id="confirmChk"> Saya memastikan data saya sudah benar.</label>
          <button id="confirmNext" class="btn-gold" style="margin-top:24px;" disabled>LANJUTKAN</button>
        </div>
      `;
      let chk = document.getElementById('confirmChk'), btn = document.getElementById('confirmNext');
      chk.onchange = () => btn.disabled = !chk.checked;
      btn.onclick = () => renderPage('rules');
    }
    else if (page === 'rules') {
      container.innerHTML = `
        <div class="glass-premium" style="max-width: 1000px; margin: 0 auto; padding: 40px;">
          <h2><i class="fas fa-gavel"></i> Peraturan & Tata Tertib Seleksi DPBI</h2>
          <div style="max-height: 500px; overflow-y: auto; margin: 28px 0; padding-right: 15px;">
            <p style="font-size:0.9rem;line-height:1.6;">⚠️ <strong>KETENTUAN WAJIB</strong><br>1. Waktu 60 menit, timer berjalan.<br>2. Wajib FULLSCREEN, keluar fullscreen = ujian otomatis dikumpul.<br>3. Dilarang membuka tab baru, aplikasi lain, screenshot, copy-paste, atau Alt+Tab.<br>4. Pelanggaran maksimal 3 kali, jika tercapai ujian berakhir.<br>5. Jawaban otomatis tersimpan setiap detik.<br>6. Dengan melanjutkan, Anda menyetujui seluruh aturan.<br><br>Pastikan koneksi stabil dan tidak meninggalkan halaman ujian.</p>
          </div>
          <label style="display:flex; gap:12px;"><input type="checkbox" id="agreeRules"> Saya telah membaca dan memahami seluruh peraturan.</label>
          <div id="countdownRules" style="background:#F2EFE6; padding:12px; border-radius:60px; text-align:center; margin:16px 0;">⏳ Tunggu 10 detik...</div>
          <button id="startExamBtn" class="btn-gold" disabled>MULAI SELEKSI</button>
        </div>
      `;
      let countdown = 10, btn = document.getElementById('startExamBtn'), cbox = document.getElementById('agreeRules'), cdDiv = document.getElementById('countdownRules');
      let interval = setInterval(() => { countdown--; cdDiv.innerText = `⏳ Tunggu ${countdown} detik...`; if (countdown <= 0) { clearInterval(interval); cdDiv.innerText = '✅ Anda siap memulai ujian'; if (cbox.checked) btn.disabled = false; } }, 1000);
      cbox.onchange = () => { if (cbox.checked && countdown <= 0) btn.disabled = false; else btn.disabled = true; };
      btn.onclick = () => {
        let soalConfig = prepareSoalConfig(soalBank);
        examState = initExamState(currentUser, soalConfig);
        saveExamToLocal();
        renderPage('exam');
        startTimer();
        startAutoSave();
        activateStrictAntiCheat();
        document.documentElement.requestFullscreen().catch(e => showToast("Aktifkan fullscreen manual"));
      };
    }
    else if (page === 'exam') {
      container.innerHTML = `
        <div class="timer-premium" id="floatingTimer">01:00:00</div>
        <div class="glass-premium" style="padding: 32px;">
          <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap;"><h3><i class="fas fa-scroll"></i> Ujian Kebudayaan DPBI</h3><div><i class="fas fa-shield-alt"></i> Pelanggaran: <span id="pelanggaranCounter">0</span>/3</div></div>
          <div id="progressInfo" style="margin:20px 0;">Soal ke-<span id="currentSoalNum">1</span> / <span id="totalSoalNum">${examState.soalConfig.length}</span></div>
          <div id="soalContainer"></div>
          <div style="display:flex; gap:16px; justify-content:space-between; margin:20px 0;"><button id="prevSoal" class="btn-outline-gold"><i class="fas fa-chevron-left"></i> Sebelumnya</button><button id="nextSoal" class="btn-outline-gold">Selanjutnya <i class="fas fa-chevron-right"></i></button></div>
          <div id="navigasiSoal" style="display:flex; flex-wrap:wrap; gap:12px; margin:20px 0;"></div>
          <div style="text-align:center;"><button id="submitExamFinal" class="btn-gold" style="background:#2C3E66;">SELESAIKAN UJIAN</button></div>
        </div>
      `;
      document.getElementById('pelanggaranCounter').innerText = examState.violations;
      updateTimerDisplay();
      function renderCurrent() {
        let qc = examState.soalConfig[currentQuestionIndex], soal = qc.original;
        document.getElementById('currentSoalNum').innerText = currentQuestionIndex+1;
        let html = `<div class="soal-card-premium"><h4>${escapeHtml(soal.pertanyaan)}</h4>`;
        if (soal.gambar && soal.gambar.trim()) html += `<div style="margin:20px 0;"><img src="${soal.gambar}" style="max-width:100%; max-height:220px; border-radius:24px; cursor:pointer;" class="zoomable-img" data-src="${soal.gambar}"></div>`;
        html += `<div class="options-list">`;
        qc.shuffledOptions.forEach(opt => { html += `<div class="option-premium ${qc.userAnswer===opt.letter?'selected':''}" data-letter="${opt.letter}">${opt.letter.toUpperCase()}. ${escapeHtml(opt.text)}</div>`; });
        html += `</div></div>`;
        document.getElementById('soalContainer').innerHTML = html;
        document.querySelectorAll('.option-premium').forEach(el => { el.addEventListener('click', () => { let letter = el.dataset.letter; examState.soalConfig[currentQuestionIndex].userAnswer = letter; examState.answers[currentQuestionIndex] = letter; saveExamToLocal(); renderCurrent(); buildNavigasi(); }); });
        document.querySelectorAll('.zoomable-img').forEach(img => { img.addEventListener('click', () => { document.getElementById('modalImgSrc').src = img.dataset.src; document.getElementById('imageModal').style.visibility = 'visible'; document.getElementById('imageModal').style.opacity = 1; }); });
      }
      function buildNavigasi() {
        let nav = document.getElementById('navigasiSoal'); nav.innerHTML = '';
        for (let i=0; i<examState.soalConfig.length; i++) {
          let btn = document.createElement('div'); btn.className = 'pill-soal-premium'; if (examState.answers[i] !== null) btn.classList.add('answered'); if (i === currentQuestionIndex) btn.classList.add('active'); btn.innerText = i+1; btn.onclick = () => { currentQuestionIndex = i; renderCurrent(); buildNavigasi(); }; nav.appendChild(btn);
        }
      }
      renderCurrent(); buildNavigasi();
      document.getElementById('prevSoal').onclick = () => { if (currentQuestionIndex>0) currentQuestionIndex--; renderCurrent(); buildNavigasi(); };
      document.getElementById('nextSoal').onclick = () => { if (currentQuestionIndex<examState.soalConfig.length-1) currentQuestionIndex++; renderCurrent(); buildNavigasi(); };
      document.getElementById('submitExamFinal').onclick = () => renderPage('review');
    }
    else if (page === 'review') {
      let total = examState.soalConfig.length, answered = examState.answers.filter(a=>a!==null).length;
      let rows = '';
      for (let i=0; i<total; i++) rows += `<div style="padding:10px; border-bottom:1px solid #EFE9DB;">Soal ${i+1} : ${examState.answers[i] ? '<i class="fas fa-check-circle" style="color:#22C55E;"></i> Terjawab' : '<i class="fas fa-times-circle" style="color:#DC2626;"></i> Belum Terjawab'}</div>`;
      container.innerHTML = `
        <div class="glass-premium" style="max-width:800px; margin:0 auto; padding:40px;">
          <h2>Review Jawaban</h2>
          <div style="max-height:350px; overflow:auto; margin:20px 0; background:#FBF9F2; border-radius:24px; padding:16px;">${rows}</div>
          <p>Total Soal: ${total} | Sudah Dijawab: ${answered} | Belum: ${total-answered}</p>
          ${total-answered > 0 ? '<p style="color:#C9A227;">⚠️ Masih ada soal belum dijawab. Anda tetap bisa mengumpulkan.</p>' : ''}
          <div style="display:flex; gap:16px; justify-content:center;"><button id="backToExam" class="btn-outline-gold">Kembali ke Soal</button><button id="toFinalConfirm" class="btn-gold">Lanjutkan ke Konfirmasi</button></div>
        </div>
      `;
      document.getElementById('backToExam').onclick = () => renderPage('exam');
      document.getElementById('toFinalConfirm').onclick = () => renderPage('finalConfirm');
    }
    else if (page === 'finalConfirm') {
      let total = examState.soalConfig.length, answered = examState.answers.filter(a=>a!==null).length;
      container.innerHTML = `
        <div class="glass-premium" style="max-width:700px; margin:0 auto; padding:40px;">
          <h2>Konfirmasi Akhir</h2>
          <p>Nama: ${escapeHtml(examState.nama)}<br>Sekolah: ${escapeHtml(examState.sekolah)}<br>Jumlah Soal: ${total} | Dijawab: ${answered}<br>Pelanggaran: ${examState.violations}</p>
          <label style="display:flex; gap:12px;"><input type="checkbox" id="finalCheck"> Saya yakin ingin mengumpulkan jawaban.</label>
          <button id="finalSubmitBtn" class="btn-gold" style="margin-top:20px;" disabled>KUMPULKAN JAWABAN</button>
        </div>
      `;
      let chk = document.getElementById('finalCheck'), subBtn = document.getElementById('finalSubmitBtn');
      chk.onchange = () => subBtn.disabled = !chk.checked;
      subBtn.onclick = async () => await finalSubmit();
    }
    else if (page === 'selesai') {
      container.innerHTML = `
        <div class="glass-premium" style="text-align:center; padding: 56px;">
          <i class="fas fa-award" style="font-size:90px; color:#D4AF37;"></i>
          <h2 style="margin:24px 0 12px;">TERIMA KASIH</h2>
          <p>Anda telah berhasil menyelesaikan Seleksi Duta Pelajar Berbudaya Indonesia.<br>Jawaban telah dikirim ke panitia.</p>
          <div style="background:#F9F6EF; border-radius:28px; padding:28px; margin:20px auto; max-width:400px;">
            <p><strong>${escapeHtml(examState?.nama || currentUser?.["Nama Lengkap"] || 'Peserta')}</strong><br>Status Pengiriman: Berhasil ✅</p>
            <p>Bagikan pengalamanmu di Instagram Story dan mention <strong>@dutapelajarberbudaya</strong></p>
            <a href="https://instagram.com/dutapelajarberbudaya" target="_blank" class="btn-gold" style="display:inline-block; margin-top:12px;"><i class="fab fa-instagram"></i> Buka Instagram</a>
          </div>
          <button id="homeBtn" class="btn-outline-gold">Kembali ke Beranda</button>
        </div>
      `;
      document.getElementById('homeBtn').onclick = () => window.location.reload();
      // confetti sederhana
      for(let i=0;i<60;i++) { let c=document.createElement('div'); c.style.cssText=`position:fixed; width:8px; height:8px; background:#D4AF37; left:${Math.random()*100}%; top:-10px; border-radius:50%; pointer-events:none; z-index:9999;`; document.body.appendChild(c); c.animate([{transform:'translateY(0)', opacity:1},{transform:`translateY(${window.innerHeight+100}px)`, opacity:0}], {duration:1500}); setTimeout(()=>c.remove(),1600); }
    }
  }
  
  // INIT LOADING
  (async () => {
    const progressFill = document.getElementById('loadProgressFill'), percentSpan = document.getElementById('loadPercent'), statusSpan = document.getElementById('loadStatus'), retryBtn = document.getElementById('retryLoad');
    try {
      progressFill.style.width = "20%"; percentSpan.innerText = "20%"; statusSpan.innerText = "Memuat database peserta...";
      await loadPeserta();
      progressFill.style.width = "60%"; percentSpan.innerText = "60%"; statusSpan.innerText = "Mengunduh soal resmi...";
      await loadSoalEksternal();
      progressFill.style.width = "100%"; percentSpan.innerText = "100%"; statusSpan.innerText = "Sistem siap digunakan.";
      setTimeout(() => { document.getElementById('loadingScreen').style.display = 'none'; document.getElementById('mainApp').style.display = 'block'; renderPage('login'); }, 500);
    } catch (err) {
      progressFill.style.width = "100%"; percentSpan.innerText = "Gagal"; statusSpan.innerHTML = `<span style="color:#b91c1c;">⚠️ ${err.message}<br>Pastikan koneksi internet dan file soal.json valid.</span>`;
      retryBtn.style.display = "inline-block"; retryBtn.onclick = () => window.location.reload();
    }
  })();
  document.getElementById('closeModalBtn')?.addEventListener('click', () => { let m = document.getElementById('imageModal'); m.style.visibility = 'hidden'; m.style.opacity = 0; });
  window.addEventListener('load', () => { if (restoreExam() && examState && !getCompletedTokens().includes(examState.token)) { renderPage('exam'); startTimer(); startAutoSave(); activateStrictAntiCheat(); document.documentElement.requestFullscreen(); } });
</script>
</body>
</html>
