<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>DPBI 2026 - Seleksi Resmi Duta Pelajar Berbudaya Indonesia</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700;14..32,800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: 'Inter', sans-serif;
      background: #FAFBFC;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      position: relative;
      overflow-x: hidden;
    }

    /* Floating Glow Orbs */
    .glow-orb {
      position: fixed;
      border-radius: 50%;
      filter: blur(80px);
      z-index: 0;
      pointer-events: none;
    }
    .orb-1 { width: 60vw; height: 60vw; background: radial-gradient(circle, rgba(212,175,55,0.12), transparent); top: -20vh; left: -20vw; }
    .orb-2 { width: 50vw; height: 50vw; background: radial-gradient(circle, rgba(244,211,94,0.1), transparent); bottom: -15vh; right: -15vw; }
    .orb-3 { width: 40vw; height: 40vw; background: radial-gradient(circle, rgba(255,255,255,0.3), transparent); top: 40%; left: 30%; }

    /* Container utama glassmorphism */
    .app-container {
      width: 100%;
      max-width: 1400px;
      background: rgba(255, 255, 255, 0.82);
      backdrop-filter: blur(20px);
      border-radius: 64px;
      box-shadow: 0 30px 60px -20px rgba(0, 0, 0, 0.15), inset 0 1px 0 rgba(255,255,255,0.7);
      padding: 28px 36px;
      position: relative;
      z-index: 10;
      border: 1px solid rgba(212, 175, 55, 0.25);
    }

    /* Card Premium Glass */
    .card {
      background: rgba(255, 255, 255, 0.92);
      backdrop-filter: blur(12px);
      border-radius: 48px;
      padding: 36px 40px;
      box-shadow: 0 20px 40px -12px rgba(0, 0, 0, 0.08), 0 0 0 1px rgba(255,255,255,0.6);
      border: 1px solid rgba(212, 175, 55, 0.3);
      transition: all 0.3s ease;
    }

    /* Button Gold Premium */
    .btn-gold {
      background: linear-gradient(135deg, #C9A227 0%, #D4AF37 50%, #F4D35E 100%);
      border: none;
      padding: 14px 34px;
      font-weight: 700;
      border-radius: 80px;
      color: white;
      transition: all 0.25s cubic-bezier(0.2, 0.9, 0.4, 1.1);
      box-shadow: 0 10px 20px -5px rgba(201, 162, 39, 0.4);
      cursor: pointer;
      font-size: 1rem;
      letter-spacing: 0.3px;
    }
    .btn-gold:hover {
      transform: translateY(-2px);
      box-shadow: 0 18px 30px -6px rgba(201, 162, 39, 0.6);
      background: linear-gradient(135deg, #B48C1A, #D4AF37, #E8C76A);
    }
    .btn-outline-gold {
      background: transparent;
      border: 2px solid #C9A227;
      color: #C9A227;
      padding: 10px 26px;
      border-radius: 80px;
      font-weight: 600;
      cursor: pointer;
      transition: 0.2s;
    }
    .btn-outline-gold:hover {
      background: rgba(201, 162, 39, 0.1);
      transform: translateY(-1px);
      box-shadow: 0 0 12px rgba(212,175,55,0.3);
    }

    /* Input Glass */
    input {
      border: 1.5px solid rgba(212, 175, 55, 0.3);
      border-radius: 60px;
      padding: 14px 24px;
      font-size: 1rem;
      width: 100%;
      transition: 0.2s;
      background: rgba(255,255,255,0.8);
      font-family: 'Inter', sans-serif;
    }
    input:focus {
      outline: none;
      border-color: #D4AF37;
      box-shadow: 0 0 0 4px rgba(212, 175, 55, 0.2);
      background: white;
    }

    /* Toast */
    .toast {
      position: fixed;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%) scale(0.9);
      background: #1F2937;
      backdrop-filter: blur(12px);
      color: white;
      padding: 14px 28px;
      border-radius: 80px;
      font-weight: 600;
      z-index: 4000;
      opacity: 0;
      transition: 0.2s;
      pointer-events: none;
      font-size: 0.9rem;
    }
    .toast.show { opacity: 1; transform: translateX(-50%) scale(1); }

    /* Loading */
    .loading-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(255, 252, 245, 0.98);
      backdrop-filter: blur(24px);
      z-index: 9999;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
    }
    .progress-bar {
      width: 340px;
      height: 8px;
      background: #E9E4D4;
      border-radius: 20px;
      overflow: hidden;
      margin-top: 28px;
    }
    .progress-fill {
      width: 0%;
      height: 100%;
      background: linear-gradient(90deg, #C9A227, #F4D35E);
      transition: width 0.4s;
    }

    /* Timer Premium */
    .timer-floating {
      position: fixed;
      top: 24px;
      right: 30px;
      background: rgba(0, 0, 0, 0.8);
      backdrop-filter: blur(16px);
      padding: 10px 28px;
      border-radius: 80px;
      color: #F4D35E;
      font-weight: 800;
      font-size: 1.3rem;
      z-index: 200;
      font-family: monospace;
      letter-spacing: 2px;
      border: 1px solid rgba(212, 175, 55, 0.6);
      box-shadow: 0 8px 20px rgba(0,0,0,0.2);
    }

    /* Soal & pilihan */
    .soal-card {
      background: white;
      border-radius: 40px;
      padding: 30px;
      margin-bottom: 28px;
      box-shadow: 0 15px 30px rgba(0, 0, 0, 0.05);
      border-left: 8px solid #D4AF37;
    }
    .option-item {
      background: #FCFAF5;
      border-radius: 32px;
      padding: 16px 26px;
      margin: 14px 0;
      cursor: pointer;
      border: 1px solid #EFE9DB;
      transition: all 0.2s;
      font-weight: 500;
    }
    .option-item.selected {
      border: 2px solid #D4AF37;
      background: linear-gradient(120deg, #FFF7E8, #FFF2DD);
      box-shadow: 0 8px 20px rgba(201, 162, 39, 0.2);
    }
    .pill-soal {
      background: #F1F2F6;
      border-radius: 60px;
      padding: 10px 0;
      font-weight: 700;
      cursor: pointer;
      text-align: center;
      min-width: 54px;
      transition: 0.15s;
    }
    .pill-soal.answered { background: #D4AF37; color: white; box-shadow: 0 4px 12px rgba(212,175,55,0.4); }
    .pill-soal.active { border: 2px solid #C9A227; background: #FFF2CC; color: #B48C1A; transform: scale(1.03); }

    footer {
      text-align: center;
      margin-top: 48px;
      font-size: 0.75rem;
      color: #7A6B4E;
      border-top: 1px solid rgba(212,175,55,0.2);
      padding-top: 28px;
      font-weight: 500;
    }

    @media (max-width: 700px) {
      .app-container { padding: 16px; }
      .card { padding: 24px; }
      .timer-floating { top: 12px; right: 16px; padding: 6px 20px; font-size: 1rem; }
    }
  </style>
</head>
<body>
<div class="glow-orb orb-1"></div>
<div class="glow-orb orb-2"></div>
<div class="glow-orb orb-3"></div>

<div class="loading-overlay" id="loadingScreen">
  <div style="text-align:center;">
    <div style="background: white; border-radius: 100px; padding: 24px; display: inline-block; box-shadow: 0 20px 30px rgba(0,0,0,0.08);">
      <i class="fas fa-university" style="font-size: 64px; color: #C9A227;"></i>
    </div>
    <h2 style="margin-top: 28px; font-weight: 800;">Duta Pelajar Berbudaya</h2>
    <p style="margin-top: 8px; color: #6B5B3E;">Seleksi Nasional 2026</p>
    <p id="loadStatusMsg" style="margin-top: 20px; font-weight: 500;">Mempersiapkan sistem...</p>
    <div class="progress-bar"><div class="progress-fill" id="loadProgress"></div></div>
    <p id="loadPercent" style="margin-top: 14px; font-weight: 600;">0%</p>
    <button id="retryLoadBtn" style="display:none; margin-top: 28px;" class="btn-gold"><i class="fas fa-sync-alt"></i> Muat Ulang</button>
  </div>
</div>

<div class="app-container" id="mainApp" style="display: none;">
  <div id="pageRenderer"></div>
</div>

<div class="toast" id="toastMsg"></div>
<div id="imageModal" style="position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.92); display:flex; align-items:center; justify-content:center; z-index:5000; visibility:hidden; opacity:0; transition:0.2s;"><img id="modalImgSrc" style="max-width:90%; max-height:90%; border-radius:32px;"><span style="position:absolute; top:30px; right:40px; color:white; font-size:48px; cursor:pointer;" id="closeModalBtn">&times;</span></div>

<script>
  // ======================= DATA PESERTA (Google Sheets CSV) =======================
  // URL sheet peserta (dienkripsi sederhana agar tidak mudah diubah, tapi tetap fungsional)
  const _part1 = "docs.google.com/spreadsheets/d/17BdQHCiwmRnfnhhITQ7MDTQjeMhi0y9P46qLVfqZg3A/export?format=csv&gid=0";
  const SHEET_PESERTA_URL = "https://" + _part1;
  
  // ======================= DATA SOAL INTERNAL (TIDAK DARI LINK, LANGSUNG HARDCODE = AMAN) =======================
  // Soal premium tidak bisa diakses dari luar, disimpan di dalam kode
  const INTERNAL_SOAL = [
    { id:1, jenis:"Pilihan Ganda", pertanyaan:"Apa ibu kota Indonesia?", gambar:"", pilihan:{ A:"Jakarta", B:"Bandung", C:"Surabaya", D:"Medan" }, jawaban:"A", bobot:5 },
    { id:2, jenis:"Pilihan Ganda", pertanyaan:"Tarian tradisional dari Aceh yang terkenal dengan gerakan syair adalah...", gambar:"https://upload.wikimedia.org/wikipedia/commons/thumb/0/0a/Tari_Saman_Aceh.jpg/320px-Tari_Saman_Aceh.jpg", pilihan:{ A:"Kecak", B:"Saman", C:"Pendet", D:"Jaipong" }, jawaban:"B", bobot:5 },
    { id:3, jenis:"Benar Salah", pertanyaan:"Candi Borobudur terletak di Jawa Timur.", gambar:"https://upload.wikimedia.org/wikipedia/commons/thumb/5/58/Borobudur_North_Side.jpg/320px-Borobudur_North_Side.jpg", pilihan:{ A:"Benar", B:"Salah" }, jawaban:"Salah", bobot:3 },
    { id:4, jenis:"Pilihan Ganda", pertanyaan:"Pahlawan nasional 'Singa dari Singaparna' adalah...", gambar:"", pilihan:{ A:"Soekarno", B:"Hatta", C:"KH. Zainal Mustafa", D:"Cut Nyak Dien" }, jawaban:"C", bobot:5 },
    { id:5, jenis:"Benar Salah", pertanyaan:"Batik diakui UNESCO sebagai warisan budaya takbenda Indonesia.", gambar:"https://upload.wikimedia.org/wikipedia/commons/thumb/9/9a/Batik_Indonesia.jpg/320px-Batik_Indonesia.jpg", pilihan:{ A:"Benar", B:"Salah" }, jawaban:"Benar", bobot:4 },
    { id:6, jenis:"Pilihan Ganda", pertanyaan:"Alat musik bambu khas Jawa Barat adalah...", gambar:"", pilihan:{ A:"Angklung", B:"Gamelan", C:"Sasando", D:"Kolintang" }, jawaban:"A", bobot:5 },
    { id:7, jenis:"Pilihan Ganda", pertanyaan:"Upacara Ngaben berasal dari provinsi...", gambar:"", pilihan:{ A:"Jawa", B:"Sumatra", C:"Bali", D:"NTB" }, jawaban:"C", bobot:4 },
    { id:8, jenis:"Benar Salah", pertanyaan:"Presiden pertama Indonesia adalah Soeharto.", gambar:"", pilihan:{ A:"Benar", B:"Salah" }, jawaban:"Salah", bobot:3 },
    { id:9, jenis:"Pilihan Ganda", pertanyaan:"Rumah adat Honai berasal dari...", gambar:"https://upload.wikimedia.org/wikipedia/commons/thumb/9/9e/Honai_traditional_house.jpg/320px-Honai_traditional_house.jpg", pilihan:{ A:"Papua", B:"NTB", C:"Sulawesi", D:"Maluku" }, jawaban:"A", bobot:5 },
    { id:10, jenis:"Pilihan Ganda", pertanyaan:"Makna 'Bhinneka Tunggal Ika' adalah...", gambar:"", pilihan:{ A:"Bersatu dalam perbedaan", B:"Satu tanah air", C:"Merdeka", D:"Gotong royong" }, jawaban:"A", bobot:5 }
  ];

  // Telegram config
  const BOT_TOKEN = "8611068552:AAHCleWMDayr9Udwer2KmVVABR_X8pzgadw";
  const CHAT_ID = "7509429091";

  // Variabel global
  let globalPeserta = [];
  let currentUser = null;
  let examState = null;
  let timerInterval = null;
  let autoSaveInterval = null;
  let isSubmitting = false;
  let currentQuestionIndex = 0;
  let examForcedClosed = false;

  // Helper functions
  function showToast(msg) { let t = document.getElementById('toastMsg'); t.innerText = msg; t.classList.add('show'); setTimeout(() => t.classList.remove('show'), 3000); }
  function escapeHtml(str) { if (!str) return ''; return str.replace(/[&<>]/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[m])); }
  function parseCSV(csvText) {
    const lines = csvText.split(/\r?\n/).filter(l => l.trim());
    if (lines.length < 2) return [];
    const headers = lines[0].split(',').map(h => h.trim().replace(/^\uFEFF/, ''));
    const rows = [];
    for (let i = 1; i < lines.length; i++) {
      const vals = lines[i].split(',');
      let obj = {};
      headers.forEach((h, idx) => { obj[h] = vals[idx] ? vals[idx].trim() : ""; });
      rows.push(obj);
    }
    return rows;
  }

  async function fetchWithProxy(url) {
    // Coba langsung
    try { let r = await fetch(url); if (r.ok) return await r.text(); } catch(e) {}
    // Proxy cors
    const proxies = [
      `https://api.allorigins.win/raw?url=${encodeURIComponent(url)}`,
      `https://corsproxy.io/?${encodeURIComponent(url)}`,
    ];
    for (let p of proxies) {
      try { let r = await fetch(p); if (r.ok) return await r.text(); } catch(e) {}
    }
    throw new Error("Gagal mengambil data peserta.");
  }

  async function loadPesertaData() {
    const csv = await fetchWithProxy(SHEET_PESERTA_URL);
    const raw = parseCSV(csv);
    if (!raw.length) throw new Error("Data peserta kosong.");
    globalPeserta = raw.map(p => {
      let norm = { ...p };
      if (norm['Nama Sekolah'] && !norm['Asal Sekolah']) norm['Asal Sekolah'] = norm['Nama Sekolah'];
      if (!norm['Status']) norm['Status'] = 'BELUM';
      return norm;
    });
  }

  // Session & token
  function getCompletedTokens() { return JSON.parse(localStorage.getItem('dpbi_completed_tokens') || '[]'); }
  function addCompletedToken(token) { let a = getCompletedTokens(); if (!a.includes(token)) a.push(token); localStorage.setItem('dpbi_completed_tokens', JSON.stringify(a)); }

  function loginValidate(nama, sekolah, token) {
    const p = globalPeserta.find(p => p["Nama Lengkap"]?.toLowerCase().trim() === nama.toLowerCase().trim() && p["Asal Sekolah"]?.toLowerCase().trim() === sekolah.toLowerCase().trim() && p["Token"] === token);
    if (!p) return { success: false, msg: "Nama / Sekolah / Token tidak cocok." };
    if (p["Status"] !== "BELUM") return { success: false, msg: "Akun sudah menyelesaikan seleksi." };
    if (getCompletedTokens().includes(token)) return { success: false, msg: "Token sudah pernah digunakan." };
    const now = new Date(), start = new Date(p["Waktu Mulai Token"]), end = new Date(p["Waktu Selesai Token"]);
    if (isNaN(start) || isNaN(end)) return { success: false, msg: "Format waktu token invalid." };
    if (now < start || now > end) return { success: false, msg: "Token tidak berlaku saat ini." };
    return { success: true, pesertaData: p };
  }

  // Acak soal & opsi
  function shuffleArray(arr) { for (let i = arr.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [arr[i], arr[j]] = [arr[j], arr[i]]; } return arr; }
  function prepareSoalConfig(soalArray) {
    let shuffledSoal = shuffleArray([...soalArray]);
    return shuffledSoal.map(soal => {
      let shuffledOptions = [], correctKey = "";
      if (soal.jenis === "Pilihan Ganda") {
        let choices = [{letter:"A",text:soal.pilihan.A},{letter:"B",text:soal.pilihan.B},{letter:"C",text:soal.pilihan.C},{letter:"D",text:soal.pilihan.D}].filter(c=>c.text?.trim());
        let shuffled = shuffleArray([...choices]);
        let correctText = soal.pilihan[soal.jawaban];
        let newCorrect = shuffled.find(opt => opt.text === correctText)?.letter || "A";
        shuffledOptions = shuffled; correctKey = newCorrect;
      } else {
        let bs = [{letter:"Benar",text:"Benar"},{letter:"Salah",text:"Salah"}];
        let shuffled = shuffleArray([...bs]);
        correctKey = (soal.jawaban === "Benar") ? "Benar" : "Salah";
        shuffledOptions = shuffled;
      }
      return { original: soal, shuffledOptions, correctAnswerKey: correctKey, userAnswer: null };
    });
  }

  function initExamState(participant, soalConfig) {
    return {
      token: participant.Token,
      nama: participant["Nama Lengkap"],
      sekolah: participant["Asal Sekolah"],
      soalConfig: soalConfig,
      answers: new Array(soalConfig.length).fill(null),
      remainingSeconds: 60 * 60,
      violations: 0,
      startTime: Date.now(),
    };
  }

  function saveExamToLocal() { localStorage.setItem('dpbi_exam_state', JSON.stringify(examState)); }
  function restoreExam() {
    let saved = localStorage.getItem('dpbi_exam_state');
    if (!saved) return false;
    try {
      let parsed = JSON.parse(saved);
      if (parsed && !getCompletedTokens().includes(parsed.token)) {
        examState = parsed;
        currentUser = globalPeserta.find(p => p.Token === parsed.token) || { "Nama Lengkap": parsed.nama, "Asal Sekolah": parsed.sekolah, Token: parsed.token };
        return true;
      }
    } catch(e) {}
    return false;
  }

  function updateTimerDisplay() { if(examState) { let s=examState.remainingSeconds, h=Math.floor(s/3600), m=Math.floor((s%3600)/60), sec=s%60; if(document.getElementById('floatingTimer')) document.getElementById('floatingTimer').innerText = `${h.toString().padStart(2,'0')}:${m.toString().padStart(2,'0')}:${sec.toString().padStart(2,'0')}`; } }
  function startTimer() { if(timerInterval) clearInterval(timerInterval); timerInterval = setInterval(() => { if(!examState || examState.remainingSeconds <= 0) { if(examState && examState.remainingSeconds<=0 && !isSubmitting) forceSubmit("⏰ Waktu habis!"); clearInterval(timerInterval); return; } examState.remainingSeconds--; updateTimerDisplay(); saveExamToLocal(); if(examState.remainingSeconds === 0) forceSubmit("Waktu habis!"); }, 1000); }
  function startAutoSave() { if(autoSaveInterval) clearInterval(autoSaveInterval); autoSaveInterval = setInterval(() => { if(examState && !isSubmitting) saveExamToLocal(); }, 1000); }

  async function sendTelegramResult(nama, sekolah, nilai, pelanggaran) {
    let msg = `🎓 *HASIL SELEKSI DPBI 2026* 🎓\n👤 *Nama:* ${nama}\n🏫 *Sekolah:* ${sekolah}\n📊 *Nilai Akhir:* ${nilai.toFixed(2)}%\n⚠️ *Pelanggaran:* ${pelanggaran}\n✅ *Status:* Selesai\n🕒 *Waktu:* ${new Date().toLocaleString()}`;
    try {
      await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ chat_id: CHAT_ID, text: msg, parse_mode: 'Markdown' }) });
    } catch(e) { console.warn("Telegram error"); }
  }

  async function forceSubmit(reason) {
    if (isSubmitting || examForcedClosed) return;
    examForcedClosed = true;
    if (timerInterval) clearInterval(timerInterval);
    if (autoSaveInterval) clearInterval(autoSaveInterval);
    isSubmitting = true;
    showToast(reason);
    let totalBobot=0, totalBenar=0;
    for(let qc of examState.soalConfig) { let bobot = parseInt(qc.original.bobot)||1; totalBobot+=bobot; if(qc.userAnswer===qc.correctAnswerKey) totalBenar+=bobot; }
    let nilai = totalBobot===0?0:(totalBenar/totalBobot)*100;
    await sendTelegramResult(examState.nama, examState.sekolah, nilai, examState.violations);
    addCompletedToken(examState.token);
    localStorage.removeItem('dpbi_exam_state');
    renderPage('selesai', { forced: true, message: reason });
  }

  async function finalSubmit() {
    if (isSubmitting) return;
    isSubmitting = true;
    if (timerInterval) clearInterval(timerInterval);
    if (autoSaveInterval) clearInterval(autoSaveInterval);
    let totalBobot=0, totalBenar=0;
    for(let qc of examState.soalConfig) { let bobot = parseInt(qc.original.bobot)||1; totalBobot+=bobot; if(qc.userAnswer===qc.correctAnswerKey) totalBenar+=bobot; }
    let nilai = totalBobot===0?0:(totalBenar/totalBobot)*100;
    await sendTelegramResult(examState.nama, examState.sekolah, nilai, examState.violations);
    addCompletedToken(examState.token);
    localStorage.removeItem('dpbi_exam_state');
    renderPage('selesai', { forced: false });
  }

  // Anti cheat super ketat
  function activateStrictAntiCheat() {
    if (!examState) return;
    const handleVisibility = () => { if (document.hidden && examState && !isSubmitting && !examForcedClosed) forceSubmit("⚠️ PELANGGARAN: Meninggalkan halaman ujian."); };
    const handleBlur = () => { if (examState && !isSubmitting && !examForcedClosed) forceSubmit("⚠️ PELANGGARAN: Fokus berpindah (multitasking)."); };
    document.addEventListener('visibilitychange', handleVisibility);
    window.addEventListener('blur', handleBlur);
    window.addEventListener('beforeunload', (e) => { if (examState && !isSubmitting && !examForcedClosed) forceSubmit("Penutupan halaman terdeteksi."); });
    const fullscreenHandler = () => { if (!document.fullscreenElement && examState && !isSubmitting && !examForcedClosed) forceSubmit("❌ Keluar dari layar penuh. Ujian dihentikan."); };
    document.addEventListener('fullscreenchange', fullscreenHandler);
    window.addEventListener('keydown', (e) => {
      if (e.key === 'F12' || (e.ctrlKey && e.shiftKey && (e.key === 'I' || e.key === 'i')) || (e.ctrlKey && e.key === 'u') || (e.ctrlKey && e.key === 'p') || (e.ctrlKey && e.key === 'c') || (e.ctrlKey && e.key === 'v') || (e.ctrlKey && e.key === 's')) {
        e.preventDefault();
        if (examState && !isSubmitting && !examForcedClosed) {
          examState.violations++;
          saveExamToLocal();
          if (examState.violations >= 3) forceSubmit("Batas maksimal pelanggaran (3) tercapai.");
          else showToast(`Pelanggaran ke-${examState.violations}`);
        }
      }
    });
    document.addEventListener('contextmenu', e => e.preventDefault());
    document.addEventListener('copy', e => e.preventDefault());
    document.addEventListener('cut', e => e.preventDefault());
    document.addEventListener('paste', e => e.preventDefault());
  }

  // ======================= RENDER SEMUA HALAMAN =======================
  function renderPage(page, params = {}) {
    const container = document.getElementById('pageRenderer');
    if (!container) return;
    if (page === 'login') {
      container.innerHTML = `
        <div class="card" style="max-width: 580px; margin: 0 auto;">
          <div style="text-align:center;"><i class="fas fa-crown" style="font-size: 56px; color: #C9A227;"></i><h2 style="margin: 16px 0 6px;">Seleksi DPBI 2026</h2><p style="color:#5A5A5A;">Portal Resmi Peserta</p></div>
          <form id="loginForm" style="margin-top: 32px;">
            <input type="text" id="namaLogin" placeholder="Nama Lengkap" autocomplete="off"><br><br>
            <input type="text" id="sekolahLogin" placeholder="Asal Sekolah" autocomplete="off"><br><br>
            <input type="text" id="tokenLogin" placeholder="Token Seleksi" autocomplete="off"><br><br>
            <button type="submit" class="btn-gold" style="width:100%;"><i class="fas fa-arrow-right-to-bracket"></i> MASUK SELEKSI</button>
          </form>
        </div>
        <footer>© 2026 Duta Pelajar Berbudaya Indonesia — Sistem Seleksi Nasional</footer>
      `;
      document.getElementById('loginForm')?.addEventListener('submit', async (e) => {
        e.preventDefault();
        let nama = document.getElementById('namaLogin').value.trim(), sekolah = document.getElementById('sekolahLogin').value.trim(), token = document.getElementById('tokenLogin').value.trim();
        let res = loginValidate(nama, sekolah, token);
        if (!res.success) { showToast(res.msg); return; }
        currentUser = res.pesertaData;
        renderPage('dashboard');
      });
    }
    else if (page === 'dashboard') {
      let nomorPeserta = 'DPBI' + Math.floor(Math.random() * 9000 + 1000);
      container.innerHTML = `
        <div class="card" style="max-width: 860px; margin: 0 auto;">
          <h2><i class="fas fa-id-card"></i> Dashboard Peserta</h2>
          <div style="background: rgba(212,175,55,0.08); border-radius: 32px; padding: 28px; margin: 24px 0; border:1px solid rgba(212,175,55,0.2);">
            <div style="font-size:1.2rem;"><i class="fas fa-user"></i> <strong>${escapeHtml(currentUser["Nama Lengkap"])}</strong></div>
            <div><i class="fas fa-school"></i> ${escapeHtml(currentUser["Asal Sekolah"])}</div>
            <div><i class="fas fa-key"></i> Token: ${currentUser.Token}</div>
            <div><i class="fas fa-barcode"></i> Nomor Peserta: ${nomorPeserta}</div>
            <div><i class="fas fa-calendar-alt"></i> Periode Token: ${currentUser["Waktu Mulai Token"]} s/d ${currentUser["Waktu Selesai Token"]}</div>
            <div><i class="fas fa-flag-checkered"></i> Status: ${currentUser.Status}</div>
          </div>
          <p><i class="fas fa-info-circle"></i> Seleksi berjumlah ${INTERNAL_SOAL.length} soal, durasi 60 menit. Sistem anti-kecurangan aktif.</p>
          <button id="toConfirmBtn" class="btn-gold" style="margin-top: 28px;"><i class="fas fa-forward"></i> LANJUT KE KONFIRMASI TES</button>
        </div>
      `;
      document.getElementById('toConfirmBtn')?.addEventListener('click', () => renderPage('confirm'));
    }
    else if (page === 'confirm') {
      let nomor = 'DPBI' + Math.floor(Math.random() * 9000 + 1000);
      container.innerHTML = `
        <div class="card" style="max-width: 800px; margin: 0 auto;">
          <h2><i class="fas fa-clipboard-list"></i> Konfirmasi Tes</h2>
          <div style="background: rgba(212,175,55,0.06); border-radius: 32px; padding: 24px; margin: 24px 0;">
            <h3>Data Peserta</h3>
            <p>Nama: ${escapeHtml(currentUser["Nama Lengkap"])}<br>Sekolah: ${escapeHtml(currentUser["Asal Sekolah"])}<br>Token: ${currentUser.Token}<br>Nomor Peserta: ${nomor}</p>
            <h3 style="margin-top:16px;">Informasi Tes</h3>
            <p>Jumlah Soal: ${INTERNAL_SOAL.length}<br>Jenis: Pilihan Ganda & Benar Salah<br>Durasi: 60 menit<br>Sistem Anti Kecurangan: Fullscreen Wajib, Blokir Tab, Pelanggaran langsung kumpul</p>
          </div>
          <label style="display:flex; gap:12px;"><input type="checkbox" id="confirmCheckbox"> Saya memastikan data saya sudah benar.</label>
          <button id="confirmNextBtn" class="btn-gold" style="margin-top:24px;" disabled>LANJUTKAN</button>
        </div>
      `;
      let chk = document.getElementById('confirmCheckbox'), btn = document.getElementById('confirmNextBtn');
      chk.onchange = () => btn.disabled = !chk.checked;
      btn.onclick = () => renderPage('rules');
    }
    else if (page === 'rules') {
      container.innerHTML = `
        <div class="card" style="max-width: 900px; margin: 0 auto;">
          <h2><i class="fas fa-gavel"></i> Peraturan Seleksi DPBI</h2>
          <div style="max-height: 420px; overflow-y: auto; margin: 24px 0; padding-right: 12px; font-size:0.9rem; line-height:1.6;">
            <p><strong>A. KETENTUAN UMUM</strong><br>1. Seleksi ini bersifat resmi dan wajib diikuti sesuai jadwal.<br>2. Peserta wajib menjaga integritas dan kejujuran.<br>3. Dilarang bekerja sama dalam bentuk apapun.<br><br>
            <strong>B. LARANGAN</strong><br>• Membuka tab/aplikasi lain.<br>• Keluar dari fullscreen.<br>• Copy-paste, screenshot, atau rekam layar.<br>• Menggunakan AI atau mesin pencari.<br><br>
            <strong>C. SANKSI</strong><br>Pelanggaran akan dicatat. Jika mencapai 3 kali, ujian otomatis dikumpulkan dan dinyatakan gugur.<br><br>
            Dengan melanjutkan, Anda menyetujui seluruh aturan.</p>
          </div>
          <label style="display:flex; gap:12px;"><input type="checkbox" id="agreeRules"> Saya telah membaca dan memahami seluruh peraturan.</label>
          <div id="countdownRules" style="background: #F2EFE6; padding: 14px; border-radius: 80px; text-align:center; margin: 20px 0; font-weight:600;">⏳ Tunggu 10 detik...</div>
          <button id="startExamBtn" class="btn-gold" disabled>MULAI SELEKSI</button>
        </div>
      `;
      let countdown=10, btn=document.getElementById('startExamBtn'), cbox=document.getElementById('agreeRules'), cdDiv=document.getElementById('countdownRules');
      let interval = setInterval(()=>{ countdown--; cdDiv.innerText = `⏳ Tunggu ${countdown} detik...`; if(countdown<=0){ clearInterval(interval); cdDiv.innerText='✅ Anda siap memulai ujian'; if(cbox.checked) btn.disabled=false; } },1000);
      cbox.onchange = () => { if(cbox.checked && countdown<=0) btn.disabled=false; else btn.disabled=true; };
      btn.onclick = () => {
        let soalConfig = prepareSoalConfig(INTERNAL_SOAL);
        examState = initExamState(currentUser, soalConfig);
        saveExamToLocal();
        renderPage('exam');
        startTimer();
        startAutoSave();
        activateStrictAntiCheat();
        document.documentElement.requestFullscreen().catch(e=>showToast("Aktifkan fullscreen manual untuk keamanan"));
      };
    }
    else if (page === 'exam') {
      container.innerHTML = `
        <div class="timer-floating" id="floatingTimer">01:00:00</div>
        <div style="display:flex; justify-content:space-between; align-items:baseline; margin-bottom:20px;"><h3><i class="fas fa-scroll"></i> Ujian Kebudayaan DPBI</h3><div><i class="fas fa-shield-alt"></i> Pelanggaran: <span id="pelanggaranCounter">0</span>/3</div></div>
        <div id="progressSoalInfo" style="margin:20px 0;">Soal ke-<span id="currentSoalNum">1</span> / <span id="totalSoalNum">${examState.soalConfig.length}</span></div>
        <div id="soalContainer"></div>
        <div style="display:flex; gap:16px; justify-content:space-between; margin:20px 0;"><button id="prevSoal" class="btn-outline-gold"><i class="fas fa-chevron-left"></i> Sebelumnya</button><button id="nextSoal" class="btn-outline-gold">Selanjutnya <i class="fas fa-chevron-right"></i></button></div>
        <div id="navigasiSoal" style="display:flex; flex-wrap:wrap; gap:12px; margin:20px 0;"></div>
        <div style="text-align:center;"><button id="submitExamFinal" class="btn-gold" style="background:#2C3E66;">SELESAIKAN UJIAN</button></div>
        <footer>© DPBI — Sistem Ujian Digital</footer>
      `;
      document.getElementById('pelanggaranCounter').innerText = examState.violations;
      updateTimerDisplay();
      function renderCurrent() {
        let qc = examState.soalConfig[currentQuestionIndex], soal = qc.original;
        document.getElementById('currentSoalNum').innerText = currentQuestionIndex+1;
        let html = `<div class="soal-card"><h4 style="font-size:1.25rem;">${escapeHtml(soal.pertanyaan)}</h4>`;
        if (soal.gambar && soal.gambar.trim()) html += `<div style="margin:16px 0"><img src="${soal.gambar}" style="max-width:100%; max-height:220px; border-radius:24px; cursor:pointer;" class="zoomable-img" data-src="${soal.gambar}"></div>`;
        html += `<div class="options-list">`;
        qc.shuffledOptions.forEach(opt => { html += `<div class="option-item ${qc.userAnswer===opt.letter?'selected':''}" data-letter="${opt.letter}">${opt.letter.toUpperCase()}. ${escapeHtml(opt.text)}</div>`; });
        html += `</div></div>`;
        document.getElementById('soalContainer').innerHTML = html;
        document.querySelectorAll('.option-item').forEach(el => { el.addEventListener('click', () => { let letter = el.dataset.letter; examState.soalConfig[currentQuestionIndex].userAnswer = letter; examState.answers[currentQuestionIndex] = letter; saveExamToLocal(); renderCurrent(); buildNavigasi(); }); });
        document.querySelectorAll('.zoomable-img').forEach(img => { img.addEventListener('click', () => { document.getElementById('modalImgSrc').src = img.dataset.src; document.getElementById('imageModal').style.visibility = 'visible'; document.getElementById('imageModal').style.opacity = 1; }); });
      }
      function buildNavigasi() {
        let nav = document.getElementById('navigasiSoal'); nav.innerHTML = '';
        for (let i=0; i<examState.soalConfig.length; i++) {
          let btn = document.createElement('div'); btn.className = 'pill-soal'; if (examState.answers[i] !== null) btn.classList.add('answered'); if (i === currentQuestionIndex) btn.classList.add('active'); btn.innerText = i+1; btn.onclick = () => { currentQuestionIndex = i; renderCurrent(); buildNavigasi(); }; nav.appendChild(btn);
        }
      }
      renderCurrent(); buildNavigasi();
      document.getElementById('prevSoal').onclick = () => { if (currentQuestionIndex>0) currentQuestionIndex--; renderCurrent(); buildNavigasi(); };
      document.getElementById('nextSoal').onclick = () => { if (currentQuestionIndex<examState.soalConfig.length-1) currentQuestionIndex++; renderCurrent(); buildNavigasi(); };
      document.getElementById('submitExamFinal').onclick = () => renderPage('review');
    }
    else if (page === 'review') {
      let total = examState.soalConfig.length, answered = examState.answers.filter(a=>a!==null).length;
      let rows = '';
      for (let i=0; i<total; i++) rows += `<div style="padding:8px 0;">Soal ${i+1} : ${examState.answers[i] ? '✅ Terjawab' : '❌ Belum Terjawab'}</div>`;
      container.innerHTML = `
        <div class="card" style="max-width:800px; margin:0 auto;">
          <h2>Review Jawaban</h2>
          <div style="max-height:350px; overflow:auto; margin:24px 0; background:#FCFAF5; border-radius:28px; padding:16px;">${rows}</div>
          <p>Total Soal: ${total} | Sudah Dijawab: ${answered} | Belum: ${total-answered}</p>
          ${total-answered > 0 ? '<p style="color:#C9A227;">⚠️ Masih ada soal belum dijawab.</p>' : ''}
          <div style="display:flex; gap:16px; justify-content:center; margin-top:24px;"><button id="backToExam" class="btn-outline-gold">Kembali ke Soal</button><button id="toFinalConfirm" class="btn-gold">Lanjutkan ke Konfirmasi</button></div>
        </div>
      `;
      document.getElementById('backToExam').onclick = () => renderPage('exam');
      document.getElementById('toFinalConfirm').onclick = () => renderPage('finalConfirm');
    }
    else if (page === 'finalConfirm') {
      let total = examState.soalConfig.length, answered = examState.answers.filter(a=>a!==null).length;
      container.innerHTML = `
        <div class="card" style="max-width:700px; margin:0 auto;">
          <h2>Konfirmasi Akhir</h2>
          <p style="margin:20px 0;">Nama: ${escapeHtml(examState.nama)}<br>Sekolah: ${escapeHtml(examState.sekolah)}<br>Jumlah Soal: ${total} | Dijawab: ${answered}<br>Pelanggaran: ${examState.violations}</p>
          <label style="display:flex; gap:12px;"><input type="checkbox" id="finalCheck"> Saya yakin ingin mengumpulkan jawaban.</label>
          <button id="finalSubmitBtn" class="btn-gold" style="margin-top:24px;" disabled>KUMPULKAN JAWABAN</button>
        </div>
      `;
      let chk = document.getElementById('finalCheck'), subBtn = document.getElementById('finalSubmitBtn');
      chk.onchange = () => subBtn.disabled = !chk.checked;
      subBtn.onclick = async () => { await finalSubmit(); };
    }
    else if (page === 'selesai') {
      container.innerHTML = `
        <div class="card" style="text-align:center;">
          <i class="fas fa-award" style="font-size:80px; color:#D4AF37;"></i>
          <h2 style="margin:24px 0 12px;">TERIMA KASIH</h2>
          <p>Anda telah menyelesaikan Seleksi Duta Pelajar Berbudaya Indonesia.<br>Jawaban telah dikirim ke panitia.</p>
          <div style="background:rgba(212,175,55,0.1); border-radius:32px; padding:24px; margin:24px 0;">
            <p><strong>${escapeHtml(examState?.nama || currentUser?.["Nama Lengkap"] || 'Peserta')}</strong><br>Status Pengiriman: Berhasil ✅</p>
            <p>Bagikan pengalamanmu di Instagram Story dan mention <strong>@dutapelajarberbudaya</strong></p>
            <a href="https://instagram.com/dutapelajarberbudaya" target="_blank" class="btn-gold" style="display:inline-block; margin-top:12px;"><i class="fab fa-instagram"></i> Buka Instagram</a>
          </div>
          <button id="homeBtn" class="btn-outline-gold">Kembali ke Beranda</button>
        </div>
      `;
      document.getElementById('homeBtn').onclick = () => window.location.reload();
      for (let i=0;i<70;i++) { let conf = document.createElement('div'); conf.style.cssText = `position:fixed; width:8px; height:8px; background:#D4AF37; left:${Math.random()*100}%; top:-10px; border-radius:50%; pointer-events:none; z-index:9999;`; document.body.appendChild(conf); let anim = conf.animate([{transform:'translateY(0)', opacity:1},{transform:`translateY(${window.innerHeight+100}px)`, opacity:0}], {duration:1500}); anim.onfinish = () => conf.remove(); }
    }
  }

  // Initial loading
  (async () => {
    const progressFill = document.getElementById('loadProgress'), percentText = document.getElementById('loadPercent'), statusMsg = document.getElementById('loadStatusMsg'), retryBtn = document.getElementById('retryLoadBtn');
    try {
      progressFill.style.width = "30%"; percentText.innerText = "30%"; statusMsg.innerText = "Menghubungkan database peserta...";
      await loadPesertaData();
      progressFill.style.width = "100%"; percentText.innerText = "100%"; statusMsg.innerText = "Sistem siap digunakan.";
      setTimeout(() => { document.getElementById('loadingScreen').style.display = 'none'; document.getElementById('mainApp').style.display = 'block'; renderPage('login'); }, 500);
    } catch (err) {
      progressFill.style.width = "100%"; percentText.innerText = "Gagal"; statusMsg.innerHTML = `<span style="color:#b91c1c;">⚠️ ${err.message}<br>Pastikan sheet peserta dipublikasikan ke web (CSV).</span>`;
      retryBtn.style.display = "inline-block"; retryBtn.onclick = () => window.location.reload();
    }
  })();

  document.getElementById('closeModalBtn')?.addEventListener('click', () => { let m = document.getElementById('imageModal'); m.style.visibility = 'hidden'; m.style.opacity = 0; });
  window.addEventListener('load', () => { if (restoreExam() && examState && !getCompletedTokens().includes(examState.token)) { renderPage('exam'); startTimer(); startAutoSave(); activateStrictAntiCheat(); document.documentElement.requestFullscreen(); } });
</script>
</body>
</html>
