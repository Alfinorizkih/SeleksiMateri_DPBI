<!DOCTYPE html>
<html lang="id">
<head>

  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; -webkit-tap-highlight-color: transparent; }
    body { font-family: 'Plus Jakarta Sans', sans-serif; background: #FCF9F0; min-height: 100vh; overflow-x: hidden; position: relative; }
    .bg-layer { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 0; }
    .bg-grad { background: radial-gradient(circle at 20% 30%, rgba(255,245,215,0.7) 0%, #FCF6E8 100%); }
    .bg-orb-gold { background: radial-gradient(circle, rgba(212,175,55,0.25) 0%, rgba(212,175,55,0) 70%); width: 80vw; height: 80vw; top: -20vh; left: -20vw; position: fixed; border-radius: 50%; filter: blur(110px); }
    .bg-orb-gold-2 { background: radial-gradient(circle, rgba(244,211,94,0.18) 0%, rgba(244,211,94,0) 70%); width: 70vw; height: 70vw; bottom: -30vh; right: -15vw; position: fixed; border-radius: 50%; filter: blur(120px); }
    .bg-noise { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background-image: url('data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIzMDAiIGhlaWdodD0iMzAwIj48ZmlsdGVyIGlkPSJmIj48ZmVUdXJidWxlbmNlIHR5cGU9ImZyYWN0YWxOb2lzZSIgYmFzZUZyZXF1ZW5jeT0iLjYiIG51bU9jdGF2ZXM9IjMiLz48L2ZpbHRlcj48cmVjdCB3aWR0aD0iMTAwJSIgaGVpZ2h0PSIxMDAlIiBmaWx0ZXI9InVybCgjZikiIG9wYWNpdHk9IjAuMDMiLz48L3N2Zz4='); opacity: 0.2; pointer-events: none; }
    .glass-premium { background: rgba(255, 253, 245, 0.88); backdrop-filter: blur(20px); border-radius: 56px; border: 1px solid rgba(212, 175, 55, 0.55); box-shadow: 0 32px 54px -18px rgba(0,0,0,0.12), 0 0 0 0.5px rgba(255,245,210,0.9), inset 0 1px 2px rgba(255,255,245,0.8); transition: all 0.3s ease; }
    .btn-gold-premium { background: linear-gradient(135deg, #C9A227 0%, #D4AF37 50%, #F0D56E 100%); border: none; padding: 14px 38px; font-weight: 700; border-radius: 100px; color: #1E2A2A; cursor: pointer; transition: 0.2s; font-size: 1rem; letter-spacing: -0.2px; box-shadow: 0 12px 24px -12px rgba(201,162,39,0.6); }
    .btn-gold-premium:hover { transform: translateY(-2px); box-shadow: 0 22px 30px -12px rgba(201,162,39,0.8); }
    .btn-outline-gold { background: transparent; border: 1.5px solid #D4AF37; color: #8B691B; padding: 10px 28px; border-radius: 60px; font-weight: 600; cursor: pointer; transition: 0.2s; }
    .btn-outline-gold:hover { background: rgba(212,175,55,0.1); border-color: #C9A227; }
    .input-gold { border: 1.5px solid rgba(212,175,55,0.4); border-radius: 48px; padding: 14px 24px; width: 100%; background: white; font-family: 'Plus Jakarta Sans', monospace; transition: 0.2s; }
    .input-gold:focus { outline: none; border-color: #D4AF37; box-shadow: 0 0 0 4px rgba(212,175,55,0.2); }
    .option-card { background: #FFFBF2; border-radius: 32px; padding: 18px 26px; margin: 14px 0; border: 1px solid #EDE5D2; transition: 0.2s; font-weight: 500; cursor: pointer; }
    .option-card.selected { border: 2px solid #D4AF37; background: linear-gradient(120deg, #FFF7E2, #FFF2DA); box-shadow: 0 12px 22px rgba(172, 136, 45, 0.2); }
    .pill-navigation { background: #F0EDE2; border-radius: 60px; padding: 10px 0; font-weight: 700; text-align: center; min-width: 52px; cursor: pointer; }
    .pill-navigation.answered { background: #D4AF37; color: white; box-shadow: 0 6px 12px rgba(212,175,55,0.4); }
    .pill-navigation.active { border: 2px solid #A67C1E; background: #FFF3DD; transform: scale(1.02); }
    .toast-premium { position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%) scale(0.9); background: #1E293B; backdrop-filter: blur(20px); color: #FFEFC0; padding: 14px 32px; border-radius: 80px; font-weight: 600; z-index: 6000; opacity: 0; transition: 0.2s; pointer-events: none; white-space: nowrap; }
    .toast-premium.show { opacity: 1; transform: translateX(-50%) scale(1); }
    .timer-floating { position: fixed; top: 28px; right: 36px; background: rgba(0, 0, 0, 0.8); backdrop-filter: blur(24px); padding: 12px 28px; border-radius: 60px; color: #FFE5A3; font-weight: 800; font-family: monospace; font-size: 1.4rem; z-index: 250; border: 1px solid #D4AF37; letter-spacing: 2px; }
    footer { text-align: center; margin-top: 60px; padding: 24px 0 16px; font-size: 0.7rem; color: #7C6A44; border-top: 1px solid rgba(212,175,55,0.3); }
    /* Watermark Style */
    .watermark-exam { position: fixed; bottom: 20px; left: 20px; font-size: 11px; color: rgba(212,175,55,0.35); font-weight: 500; letter-spacing: 1px; z-index: 300; pointer-events: none; background: rgba(255,250,235,0.7); padding: 5px 12px; border-radius: 60px; backdrop-filter: blur(4px); }
    .logo-header { display: flex; align-items: center; gap: 16px; margin-bottom: 28px; border-bottom: 1px solid rgba(212,175,55,0.4); padding-bottom: 20px; }
    .logo-header img { height: 56px; width: auto; border-radius: 16px; box-shadow: 0 6px 12px rgba(0,0,0,0.05); }
    .logo-header span { font-weight: 800; font-size: 1.5rem; letter-spacing: -0.3px; background: linear-gradient(135deg, #A67C1E, #D4AF37); -webkit-background-clip: text; background-clip: text; color: transparent; }
    @media (max-width: 760px) { .timer-floating { top: 12px; right: 16px; padding: 6px 20px; font-size: 1rem; } .glass-premium { border-radius: 36px; } .logo-header img { height: 42px; } .logo-header span { font-size: 1.2rem; } }
  </style>
</head>
<body>
<div class="bg-layer bg-grad"></div>
<div class="bg-orb-gold"></div>
<div class="bg-orb-gold-2"></div>
<div class="bg-noise"></div>
<div id="loadingScreen" style="position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(252,249,240,0.98); backdrop-filter:blur(28px); z-index:7000; display:flex; align-items:center; justify-content:center; flex-direction:column;">
  <div style="text-align:center;"><img src="https://cdn.phototourl.com/free/2026-05-19-74f74f8a-99fb-4f67-a5a2-18037fff5cef.png" alt="Logo DPBI" style="width: 120px; height: auto; margin: 0 auto; filter: drop-shadow(0 12px 18px rgba(0,0,0,0.1)); border-radius: 24px;"><h2 style="margin-top: 28px; font-weight:800; letter-spacing:-0.5px; color:#5E4A1A;">SELEKSI DPBI</h2><p style="color:#A58B4A;">Duta Pelajar Berbudaya Indonesia 2026</p><p id="loadStatus" style="margin-top: 34px; font-weight:500;">Memverifikasi sistem nasional...</p><div style="width: 320px; background:#EADFBE; border-radius: 40px; margin-top: 26px; overflow:hidden;"><div id="loadBarFill" style="height: 6px; width:0%; background: linear-gradient(90deg,#C9A227,#F4D35E); transition: width 0.3s ease;"></div></div><p id="loadPercentText" style="margin-top: 12px; font-weight:600;">0%</p><button id="retryLoadBtn" style="display:none; margin-top: 30px;" class="btn-gold-premium">Muat Ulang Portal</button></div></div>
<div id="mainApp" style="display:none; position:relative; z-index:10; max-width:1360px; margin:0 auto; padding:28px 36px;"><div id="pageRenderer"></div><footer>© 2026 Duta Pelajar Berbudaya Indonesia - Computer-Based Test - Platform Seleksi Digital Profesional</footer>
</div>
<div id="globalToast" class="toast-premium"></div>
<div id="imageModal" style="position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.94); backdrop-filter:blur(12px); display:flex; align-items:center; justify-content:center; z-index:8000; visibility:hidden; opacity:0; transition:0.2s;"><img id="modalImage" style="max-width:90%; max-height:90%; border-radius:36px; border:2px solid #D4AF37;"><span style="position:absolute; top:30px; right:40px; color:#D4AF37; font-size:52px; cursor:pointer;" id="closeModalImage">&times;</span></div><script> const SHEET_CSV_URL = "https://docs.google.com/spreadsheets/d/17BdQHCiwmRnfnhhITQ7MDTQjeMhi0y9P46qLVfqZg3A/export?format=csv&gid=0"; const SOAL_JSON_URL = "https://raw.githubusercontent.com/Alfinorizkih/SeleksiMateri_DPBI/refs/heads/main/soal.json"; const BOT_TOKEN = "8611068552:AAHCleWMDayr9Udwer2KmVVABR_X8pzgadw"; const CHAT_ID = "7509429091"; const LOGO_URL = "https://cdn.phototourl.com/free/2026-05-19-74f74f8a-99fb-4f67-a5a2-18037fff5cef.png"; const PROXY_LIST = [(url) => `https://api.allorigins.win/raw?url=${encodeURIComponent(url)}`, (url) => `https://corsproxy.io/?${encodeURIComponent(url)}`  ];
  let globalPeserta = [];
  let bankSoal = [];
  let currentUser = null;
  let examState = null;
  let timerInterval = null, autoSaveInterval = null;
  let isSubmitting = false, examClosed = false;
  let currentQuestionIdx = 0;
  const ACTIVE_SESSIONS_KEY = "dpbi_active_sessions";
  function getActiveSessions() { return JSON.parse(localStorage.getItem(ACTIVE_SESSIONS_KEY) || '{}'); }
  function setActiveSession(token, sessionId, nama) { let sessions = getActiveSessions(); sessions[token] = { sessionId, nama, timestamp: Date.now() }; localStorage.setItem(ACTIVE_SESSIONS_KEY, JSON.stringify(sessions)); }
  function removeActiveSession(token) { let sessions = getActiveSessions(); delete sessions[token]; localStorage.setItem(ACTIVE_SESSIONS_KEY, JSON.stringify(sessions)); }
  function isTokenActiveElsewhere(token, currentSessionId) { let sessions = getActiveSessions(); if(sessions[token] && sessions[token].sessionId !== currentSessionId) return true; return false; }
  function getCompletedTokens() { return JSON.parse(localStorage.getItem('dpbi_completed_tokens') || '[]'); }
  function addCompletedToken(token) { let arr = getCompletedTokens(); if(!arr.includes(token)) arr.push(token); localStorage.setItem('dpbi_completed_tokens', JSON.stringify(arr)); }
  function showToast(msg, isError = false) { let t = document.getElementById('globalToast'); t.innerText = msg; t.classList.add('show'); setTimeout(() => t.classList.remove('show'), 4000); }
  function escapeHtml(str) { if(!str) return ''; return str.replace(/[&<>]/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[m])); }
  function parseCSV(csvText) { const lines = csvText.split(/\r?\n/).filter(l=>l.trim()); if(lines.length<2) return []; const headers = lines[0].split(',').map(h=>h.trim().replace(/^\uFEFF/,'')); return lines.slice(1).map(line=>{ let vals=line.split(','); let obj={}; headers.forEach((h,idx)=>obj[h]=vals[idx]?vals[idx].trim():""); return obj; }); }
  async function fetchWithFallback(url, isJson=false) { try { let r=await fetch(url); if(r.ok) return isJson?await r.json():await r.text(); } catch(e){} for(let proxy of PROXY_LIST){ try{ let resp=await fetch(proxy(url)); if(resp.ok){ let txt=await resp.text(); if(isJson) return JSON.parse(txt); return txt; } } catch(e){} } throw new Error("Gagal mengakses server nasional. Periksa koneksi."); }
  async function loadPeserta() { let csv = await fetchWithFallback(SHEET_CSV_URL, false); let raw = parseCSV(csv); if(!raw.length) throw new Error("Data peserta tidak ditemukan."); globalPeserta = raw.map(p=>({ "Nama Lengkap": p["Nama Lengkap"]||"", "Nama Sekolah": p["Nama Sekolah"]||p["Asal Sekolah"]||"", Token: p.Token||"", "Waktu Mulai Token": p["Waktu Mulai Token"]||"", "Waktu Selesai Token": p["Waktu Selesai Token"]||"" })); }
  
  async function loadSoal() {
    let rawSoal = await fetchWithFallback(SOAL_JSON_URL, true);
    if(!rawSoal.length) throw new Error("Bank soal resmi kosong.");
    bankSoal = rawSoal.map(soal => {
      let jenisNormal = (soal.jenis || "").toLowerCase();
      let isPg = (jenisNormal === "pg" || jenisNormal === "pilihan ganda");
      let isBs = (jenisNormal === "benar_salah" || jenisNormal === "benar salah" || soal.jenis === "BENAR_SALAH");
      let jawabanBenar = soal.jawaban;
      let pilihanObj = soal.pilihan || {};
      let pilihanList = [];
      if(isPg && pilihanObj && typeof pilihanObj === 'object') {
        for(let [key, value] of Object.entries(pilihanObj)) {
          if(value && value.toString().trim() !== "") pilihanList.push({ letter: key.toUpperCase(), text: value.toString() });
        }
      } else if(isBs) {
        pilihanList = [{ letter: "Benar", text: "Benar" }, { letter: "Salah", text: "Salah" }];
      }
      if(pilihanList.length === 0) pilihanList = [{ letter: "A", text: "Tidak ada opsi" }];
      return {
        id: soal.id,
        jenis: isPg ? "PG" : "BENAR_SALAH",
        pertanyaan: soal.pertanyaan || "",
        gambar: soal.gambar || "",
        pilihan: pilihanList,
        jawaban: jawabanBenar,
        bobot: parseInt(soal.bobot) || 1
      };
    });
  }
  function validateLogin(nama, sekolah, token) {
    let peserta = globalPeserta.find(p => p["Nama Lengkap"]?.toLowerCase().trim() === nama.toLowerCase().trim() && p["Nama Sekolah"]?.toLowerCase().trim() === sekolah.toLowerCase().trim() && p.Token === token);
    if(!peserta) return { ok: false, msg: "Data tidak cocok dengan basis data nasional." };
    if(getCompletedTokens().includes(token)) return { ok: false, msg: "Token sudah digunakan. Anda telah menyelesaikan seleksi." };
    let now = new Date(), start = new Date(peserta["Waktu Mulai Token"]), end = new Date(peserta["Waktu Selesai Token"]);
    if(isNaN(start)||isNaN(end)) return { ok: false, msg: "Format waktu token tidak valid." };
    if(now < start) return { ok: false, msg: "Sesi seleksi belum dimulai." };
    if(now > end) return { ok: false, msg: "Sesi seleksi telah berakhir." };
    const sessionIdCandidate = btoa(token+Date.now()+Math.random()).slice(0,24);
    if(isTokenActiveElsewhere(token, sessionIdCandidate)) return { ok: false, msg: "Token sedang digunakan pada perangkat lain. Hanya satu sesi aktif diizinkan." };
    return { ok: true, pesertaData: peserta, sessionId: sessionIdCandidate };
  }
  function shuffleArray(arr) { for(let i=arr.length-1;i>0;i--) { const j=Math.floor(Math.random()*(i+1)); [arr[i],arr[j]]=[arr[j],arr[i]]; } return arr; }
  function prepareSoalConfig(soalList) {
    let shuffledSoal = shuffleArray([...soalList]);
    return shuffledSoal.map(soal => {
      let originalOptions = soal.pilihan; 
      let correctKey = "";
      if(soal.jenis === "PG") {
        correctKey = soal.jawaban.toUpperCase().trim();
      } else if(soal.jenis === "BENAR_SALAH") {
        correctKey = (soal.jawaban === "Benar") ? "Benar" : "Salah";
      }
      return { original: soal, shuffledOptions: originalOptions, correctAnswerKey: correctKey, userAnswer: null };
    });
  }
  function initExamState(participant, soalConfig, nomorPeserta, sessionId) {
    return { token: participant.Token, nama: participant["Nama Lengkap"], sekolah: participant["Nama Sekolah"], soalConfig, answers: new Array(soalConfig.length).fill(null), remainingSeconds: 60*60, violations: 0, startTime: Date.now(), pesertaNomor: nomorPeserta, sessionId: sessionId };
  }
  function saveExamToLocal() { if(examState) localStorage.setItem('dpbi_exam_state', JSON.stringify(examState)); }
  function restoreExamLocal() { let saved = localStorage.getItem('dpbi_exam_state'); if(!saved) return false; try { let parsed = JSON.parse(saved); if(parsed && !getCompletedTokens().includes(parsed.token) && !isTokenActiveElsewhere(parsed.token, parsed.sessionId)) { examState = parsed; return true; } } catch(e){} return false; }
  function updateTimerDisplay() { if(examState && document.getElementById('timerDisplay')) { let s=examState.remainingSeconds,h=Math.floor(s/3600),m=Math.floor((s%3600)/60),sec=s%60; document.getElementById('timerDisplay').innerText=`${h.toString().padStart(2,'0')}:${m.toString().padStart(2,'0')}:${sec.toString().padStart(2,'0')}`; } }
  function startTimer() { if(timerInterval) clearInterval(timerInterval); timerInterval = setInterval(()=>{ if(!examState || examState.remainingSeconds<=0) { if(examState && examState.remainingSeconds<=0 && !isSubmitting) forceSubmit("Waktu seleksi habis."); clearInterval(timerInterval); return; } examState.remainingSeconds--; updateTimerDisplay(); saveExamToLocal(); if(examState.remainingSeconds===0) forceSubmit("Waktu seleksi berakhir!"); },1000); }
  function startAutoSave() { if(autoSaveInterval) clearInterval(autoSaveInterval); autoSaveInterval = setInterval(()=>{ if(examState && !isSubmitting) saveExamToLocal(); },800); }
  function activateAntiCheat() { 
    if(!examState) return; 
    const violationInc = () => { 
      if(examState && !isSubmitting && !examClosed) { 
        examState.violations++; 
        saveExamToLocal(); 
        if(document.getElementById('pelanggaranCounter')) document.getElementById('pelanggaranCounter').innerText = examState.violations; 
        showToast(`⚠️ Pelanggaran ke-${examState.violations} / 3`); 
        if(examState.violations >= 3) forceSubmit("Batas pelanggaran tercapai (3). Ujian dihentikan."); 
      } 
    }; 
    document.addEventListener('visibilitychange', () => { 
      if(document.hidden && examState && !isSubmitting && !examClosed) violationInc(); 
    }); 
    window.addEventListener('blur', () => { 
      if(examState && !isSubmitting && !examClosed) violationInc(); 
    }); 
    document.addEventListener('fullscreenchange', () => { 
      if(!document.fullscreenElement && examState && !isSubmitting && !examClosed) violationInc(); 
    }); 
    window.addEventListener('keydown', (e) => { 
      if(e.key === 'F12' || (e.ctrlKey && e.shiftKey && (e.key==='I'||e.key==='i')) || (e.ctrlKey && e.key==='u') || (e.ctrlKey && e.key==='c') || (e.ctrlKey && e.key==='v')) { 
        e.preventDefault(); 
        violationInc(); 
      } 
    }); 
    document.addEventListener('contextmenu', e=>e.preventDefault()); 
    document.addEventListener('copy', e=>e.preventDefault()); 
    document.addEventListener('paste', e=>e.preventDefault()); 
    setInterval(()=>{ 
      if(examState && !isSubmitting && !examClosed && (window.outerHeight-window.innerHeight>150 || window.outerWidth-window.innerWidth>150)) violationInc(); 
    }, 1800); 
  }
  async function forceSubmit(reason) { if(isSubmitting || examClosed) return; isSubmitting=true; examClosed=true; if(timerInterval) clearInterval(timerInterval); if(autoSaveInterval) clearInterval(autoSaveInterval); showToast(reason); await computeAndSendResult(true); }
  async function computeAndSendResult(isForced=false) { 
    if(!examState) return; 
    let totalBobot=0, totalBenar=0; 
    for(let qc of examState.soalConfig) { 
      let bobot=parseInt(qc.original.bobot)||1; 
      totalBobot+=bobot; 
      if(qc.userAnswer === qc.correctAnswerKey) totalBenar+=bobot; 
    } 
    let nilaiPersen= totalBobot===0?0:(totalBenar/totalBobot)*100; 
    let durasiMenit=Math.floor((Date.now()-examState.startTime)/60000); 
    let msg = `🏅 SELEKSI NASIONAL DPBI 2026 🏅\nNama: ${examState.nama}\nNomor: ${examState.pesertaNomor}\nSekolah: ${examState.sekolah}\nToken: ${examState.token}\n✅ Benar: ${totalBenar}\n⭐ Nilai: ${nilaiPersen.toFixed(2)}%\n⏱️ Durasi: ${durasiMenit} menit\n⚠️ Pelanggaran: ${examState.violations}`; 
    try { await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`,{ method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ chat_id: CHAT_ID, text: msg }) }); } catch(e){} 
    addCompletedToken(examState.token); 
    removeActiveSession(examState.token); 
    localStorage.removeItem('dpbi_exam_state'); 
    renderPage('selesai', { nama: examState.nama, nomor: examState.pesertaNomor, sekolah: examState.sekolah, token: examState.token }); 
  }
  async function finalSubmit() { if(isSubmitting) return; isSubmitting=true; if(timerInterval) clearInterval(timerInterval); if(autoSaveInterval) clearInterval(autoSaveInterval); await computeAndSendResult(false); }
  function renderPage(page, params = {}) {
    const container = document.getElementById('pageRenderer'); if(!container) return;
    const logoHtml = `<div class="logo-header"><img src="${LOGO_URL}" alt="Logo DPBI" onerror="this.style.display='none'"><span>Duta Pelajar Berbudaya Indonesia</span></div>`;
    if(page === 'login') {
      container.innerHTML = `<div class="glass-premium" style="max-width:620px; margin:50px auto; padding:52px 44px;"><div style="text-align:center;">${logoHtml}<h2 style="margin:18px 0 8px;">Portal Resmi Peserta</h2><p style="color:#A08955;">Masukkan data sesuai yang diberikan</p></div><form id="loginForm"><br><input type="text" id="namaLogin" class="input-gold" placeholder="Nama Lengkap"><br><br><input type="text" id="sekolahLogin" class="input-gold" placeholder="Nama Sekolah"><br><br><input type="text" id="tokenLogin" class="input-gold" placeholder="Token Seleksi"><br><br><button type="submit" class="btn-gold-premium" style="width:100%;">Masuk ke Sistem</button></form></div>`;
      document.getElementById('loginForm').addEventListener('submit', async(e) => { e.preventDefault(); let nama = document.getElementById('namaLogin').value.trim(), sekolah = document.getElementById('sekolahLogin').value.trim(), token = document.getElementById('tokenLogin').value.trim(); let valid = validateLogin(nama, sekolah, token); if(!valid.ok) { showToast(valid.msg, true); return; } currentUser = valid.pesertaData; const sessionId = valid.sessionId; setActiveSession(token, sessionId, currentUser["Nama Lengkap"]); renderPage('dashboard', { sessionId }); });
    } else if(page === 'dashboard') { let nomorPeserta = "DPBI"+Math.floor(Math.random()*90000+10000); container.innerHTML = `<div class="glass-premium" style="max-width:1000px; margin:20px auto; padding:48px;">${logoHtml}<h2 style="font-weight:700;">Papan Informasi Peserta</h2><div style="background:#FFFCF0; border-radius:40px; padding:36px; margin:32px 0; border:1px solid #EFE2C6;"><div><strong>${escapeHtml(currentUser["Nama Lengkap"])}</strong></div><div>${escapeHtml(currentUser["Nama Sekolah"])}</div><div>Token: ${currentUser.Token}</div><div>Nomor Peserta: ${nomorPeserta}</div><div>Periode: ${currentUser["Waktu Mulai Token"]} – ${currentUser["Waktu Selesai Token"]}</div><div>Status: Aktif</div></div><p>Total Soal: ${bankSoal.length} · Durasi 60 menit · Sistem Anti-Cheat Premium</p><button id="toConfirmDash" class="btn-gold-premium" style="margin-top:28px;">Lanjut ke Konfirmasi Seleksi</button></div>`; document.getElementById('toConfirmDash').onclick = () => renderPage('confirmTest', { nomorPeserta }); }
    else if(page === 'confirmTest') { let nomor = params.nomorPeserta; container.innerHTML = `<div class="glass-premium" style="max-width:780px; margin:auto; padding:48px;">${logoHtml}<h2>Konfirmasi Seleksi Nasional</h2><div style="background:#FFF9ED; border-radius:36px; padding:30px; margin:28px 0;"><p><strong>${escapeHtml(currentUser["Nama Lengkap"])}</strong><br>Sekolah: ${escapeHtml(currentUser["Nama Sekolah"])}<br>Nomor: ${nomor}<br>Token: ${currentUser.Token}</p><hr style="margin:18px 0;"><p>Jumlah Soal: ${bankSoal.length} | Durasi: 60 menit | Jenis: PG & Benar Salah</p></div><label style="display:flex; gap:14px;"><input type="checkbox" id="confirmChk"> Saya menyatakan data sudah benar dan bersedia mengikuti seleksi dengan jujur.</label><button id="confirmNextBtn" class="btn-gold-premium" style="margin-top:34px;" disabled>Setuju & Lanjutkan</button></div>`; let chk = document.getElementById('confirmChk'), btn = document.getElementById('confirmNextBtn'); chk.onchange = () => btn.disabled = !chk.checked; btn.onclick = () => renderPage('rules', { nomorPeserta: nomor }); }
else if(page === 'rules') { 
  let nomor = params.nomorPeserta; 
  container.innerHTML = `<div class="glass-premium" style="max-width:920px; margin:auto; padding:48px;">${logoHtml}<h2>Peraturan Resmi Seleksi</h2><div style="max-height:400px; overflow-y:auto; margin:28px 0; padding-right:16px;"><h3>A. Ketentuan Umum</h3><ul><li>1. Seleksi dilaksanakan secara mandiri, jujur, dan bertanggung jawab tanpa bantuan pihak lain dalam bentuk apa pun.</li><li>2. Peserta wajib menggunakan data identitas yang sesuai dengan data pendaftaran yang telah dikirimkan kepada panitia.</li><li>3. Akun, token, maupun akses seleksi bersifat pribadi dan tidak boleh dipinjamkan, dibagikan, atau digunakan oleh orang lain.</li><li>4. Setiap peserta hanya diberikan satu kesempatan mengikuti seleksi sesuai jadwal dan sesi yang telah ditentukan.</li><li>5. Panitia berhak melakukan verifikasi data peserta sewaktu-waktu apabila ditemukan indikasi pelanggaran.</li></ul><h3>B. Sebelum Memulai Ujian</h3><ul><li>1. Pastikan perangkat yang digunakan dalam kondisi baik dan memiliki daya baterai yang cukup.</li><li>2. Gunakan koneksi internet yang stabil selama proses seleksi berlangsung.</li><li>3. Disarankan menggunakan browser versi terbaru untuk mendapatkan pengalaman terbaik.</li><li>4. Tutup seluruh aplikasi, tab, atau jendela yang tidak berkaitan dengan pelaksanaan seleksi.</li><li>5. Siapkan waktu yang cukup dan lingkungan yang kondusif agar dapat mengerjakan ujian dengan fokus.</li><li>6. Pastikan seluruh informasi pada kartu peserta telah sesuai sebelum menekan tombol mulai ujian.</li></ul><h3>C. Ketentuan Saat Ujian Berlangsung</h3><ul><li>1. Peserta wajib mengerjakan seluruh soal secara mandiri tanpa bantuan orang lain.</li><li>2. Peserta dilarang bekerja sama, berdiskusi, atau bertukar informasi dengan peserta lain selama seleksi berlangsung.</li><li>3. Peserta dilarang membuka buku, catatan, mesin pencari, media sosial, aplikasi pesan, maupun sumber referensi lainnya.</li><li>4. Peserta dilarang menggunakan perangkat kedua seperti telepon genggam, tablet, laptop tambahan, atau perangkat lain untuk mencari jawaban.</li><li>5. Peserta wajib tetap berada pada halaman ujian selama seleksi berlangsung.</li><li>6. Jawaban yang dipilih akan tersimpan secara otomatis oleh sistem.</li><li>7. Timer akan terus berjalan selama ujian berlangsung dan tidak dapat dihentikan oleh peserta.</li><li>8. Apabila waktu habis, sistem akan mengakhiri ujian secara otomatis dan menyimpan jawaban terakhir yang tersedia.</li></ul><h3>D. Ketentuan Keamanan Sistem</h3><ul><li>1. Mode layar penuh (fullscreen) wajib diaktifkan selama ujian berlangsung.</li><li>2. Sistem dapat mendeteksi perpindahan tab, perpindahan aplikasi, atau aktivitas meninggalkan halaman ujian.</li><li>3. Sistem dapat mendeteksi upaya menyalin (copy), menempel (paste), memotong (cut), maupun klik kanan.</li><li>4. Sistem dapat mendeteksi percobaan membuka alat pengembang browser (Developer Tools).</li><li>5. Sistem dapat mencatat seluruh aktivitas yang dianggap mencurigakan selama ujian berlangsung.</li><li>6. Setiap pelanggaran akan tercatat pada laporan peserta yang diterima panitia.</li></ul><h3>E. Pelanggaran dan Sanksi</h3><ul><li>Berikut aktivitas yang dianggap sebagai pelanggaran:<ul><li>Keluar dari halaman ujian tanpa alasan yang sah.</li><li>Membuka tab atau aplikasi lain selama ujian berlangsung.</li><li>Membagikan token atau akses seleksi kepada pihak lain.</li><li>Menggunakan bantuan orang lain untuk menjawab soal.</li><li>Menggunakan perangkat tambahan untuk mencari jawaban.</li><li>Mengambil, menyebarluaskan, atau memperjualbelikan soal seleksi.</li><li>Melakukan tindakan yang mengganggu keamanan sistem.</li></ul></li><li>Sanksi yang dapat diberikan meliputi:<ul><li>Peringatan otomatis dari sistem.</li><li>Pencatatan pelanggaran dalam laporan peserta.</li><li>Pembatalan hasil seleksi.</li><li>Diskualifikasi dari proses seleksi.</li><li>Larangan mengikuti program atau kegiatan yang diselenggarakan panitia pada periode tertentu.</li></ul></li></ul><h3>F. Ketentuan Pengumpulan Jawaban</h3><ul><li>1. Pastikan seluruh soal telah diperiksa kembali sebelum menekan tombol Kumpulkan Jawaban.</li><li>2. Setelah jawaban dikumpulkan, peserta tidak dapat kembali ke halaman ujian.</li><li>3. Jawaban yang telah dikirim dianggap sebagai jawaban final.</li><li>4. Sistem akan menampilkan bukti penyelesaian ujian setelah proses pengumpulan berhasil.</li></ul><h3>G. Pernyataan Peserta</h3><ul><li>Dengan mengikuti seleksi ini, saya menyatakan bahwa:<ul><li>Data yang saya berikan adalah benar.</li><li>Saya akan mengerjakan seleksi secara jujur dan mandiri.</li><li>Saya memahami seluruh tata tertib yang berlaku.</li><li>Saya bersedia menerima keputusan panitia sebagai keputusan final.</li><li>Saya siap menerima konsekuensi apabila terbukti melakukan pelanggaran selama proses seleksi berlangsung.</li></ul></li></ul><p style="margin-top:16px; font-style:italic;">Kejujuran adalah bagian dari karakter seorang Duta. Tunjukkan integritas terbaik Anda selama mengikuti seleksi ini.</p></div><label><input type="checkbox" id="agreeRulesBox"> Saya telah membaca dan menyetujui seluruh peraturan.</label><div id="countdownRule" style="background:#F5EFE0; border-radius:60px; text-align:center; padding:16px; margin:28px 0; font-weight:bold;">Tunggu 10 detik sebelum memulai</div><button id="startExamBtn" class="btn-gold-premium" disabled>Mulai Seleksi Nasional</button></div>`; 
  let countdown=10, startBtn=document.getElementById('startExamBtn'), cdDiv=document.getElementById('countdownRule'), agree=document.getElementById('agreeRulesBox'); 
  let interval=setInterval(()=>{ countdown--; cdDiv.innerText=`⏳ Harap tunggu ${countdown} detik`; if(countdown<=0){ clearInterval(interval); cdDiv.innerHTML='✅ Siap memulai ujian'; if(agree.checked) startBtn.disabled=false; } },1000); 
  agree.onchange=()=>{ if(agree.checked&&countdown<=0) startBtn.disabled=false; else startBtn.disabled=true; }; 
  startBtn.onclick=async()=>{ let configSoal=prepareSoalConfig(bankSoal); let nomorAkhir = nomor || ("DPBI"+Math.floor(Math.random()*90000)); let sessionId = getActiveSessions()[currentUser.Token]?.sessionId; examState=initExamState(currentUser, configSoal, nomorAkhir, sessionId); saveExamToLocal(); renderPage('exam'); startTimer(); startAutoSave(); activateAntiCheat(); try{ await document.documentElement.requestFullscreen(); }catch(e){ showToast("Aktifkan fullscreen manual untuk melanjutkan"); } }; 
}    else if(page === 'exam') { 
      if(!examState) { renderPage('login'); return; } 
      container.innerHTML = `<div class="timer-floating" id="timerDisplay">01:00:00</div><div class="watermark-exam">DPBI 2026 • Duta Pelajar Berbudaya</div><div class="glass-premium" style="padding:36px;">${logoHtml}<div style="display:flex; justify-content:space-between;"><h3>Ujian Kebudayaan Nusantara</h3><span><span style="background:#D4AF3722; padding:6px 16px; border-radius:80px;">Pelanggaran: <span id="pelanggaranCounter">${examState.violations}</span>/3</span></span></div><div style="margin:20px 0;">Soal ke-<span id="currentSoalSpan">1</span> / ${examState.soalConfig.length}</div><div id="soalContainer"></div><div style="display:flex; gap:20px; margin:20px 0;"><button id="prevSoalBtn" class="btn-outline-gold">Sebelumnya</button><button id="nextSoalBtn" class="btn-outline-gold">Selanjutnya</button></div><div id="navigasiGrid" style="display:flex; flex-wrap:wrap; gap:12px;"></div><div style="margin-top:28px;"><button id="reviewSubmitBtn" class="btn-gold-premium">Review & Kumpulkan Jawaban</button></div></div>`; 
      updateTimerDisplay(); 
      function renderCurrent(){ 
        let qc=examState.soalConfig[currentQuestionIdx], soal=qc.original; 
        document.getElementById('currentSoalSpan').innerText=currentQuestionIdx+1; 
        let html=`<div style="background:white; border-radius:44px; padding:28px; border-left:6px solid #D4AF37;"><h4>${escapeHtml(soal.pertanyaan)}</h4>`; 
        if(soal.gambar && soal.gambar.trim()!="") html+=`<div style="margin:16px 0;"><img src="${soal.gambar}" style="max-width:100%; max-height:200px; border-radius:28px; cursor:pointer;" class="zoomImg" data-src="${soal.gambar}"></div>`; 
        html+=`<div>`; 
        qc.shuffledOptions.forEach(opt=>{ html+=`<div class="option-card ${qc.userAnswer===opt.letter?'selected':''}" data-letter="${opt.letter}">${opt.letter}. ${escapeHtml(opt.text)}</div>`; }); 
        html+=`</div></div>`; 
        document.getElementById('soalContainer').innerHTML=html; 
        document.querySelectorAll('.option-card').forEach(el=>{ el.addEventListener('click',()=>{ let letter=el.dataset.letter; examState.soalConfig[currentQuestionIdx].userAnswer=letter; examState.answers[currentQuestionIdx]=letter; saveExamToLocal(); renderCurrent(); buildNavigasi(); if(document.getElementById('pelanggaranCounter')) document.getElementById('pelanggaranCounter').innerText=examState.violations; }); }); 
        document.querySelectorAll('.zoomImg').forEach(img=>{ img.addEventListener('click',()=>{ document.getElementById('modalImage').src=img.dataset.src; document.getElementById('imageModal').style.visibility='visible'; document.getElementById('imageModal').style.opacity=1; }); }); 
      } 
      function buildNavigasi(){ 
        let nav=document.getElementById('navigasiGrid'); nav.innerHTML=''; 
        for(let i=0;i<examState.soalConfig.length;i++){ 
          let pill=document.createElement('div'); pill.className='pill-navigation'; if(examState.answers[i]!==null) pill.classList.add('answered'); if(i===currentQuestionIdx) pill.classList.add('active'); pill.innerText=i+1; pill.onclick=()=>{ currentQuestionIdx=i; renderCurrent(); buildNavigasi(); }; nav.appendChild(pill); 
        } 
      } 
      renderCurrent(); buildNavigasi(); 
      document.getElementById('prevSoalBtn').onclick=()=>{ if(currentQuestionIdx>0) currentQuestionIdx--; renderCurrent(); buildNavigasi(); }; 
      document.getElementById('nextSoalBtn').onclick=()=>{ if(currentQuestionIdx<examState.soalConfig.length-1) currentQuestionIdx++; renderCurrent(); buildNavigasi(); }; 
      document.getElementById('reviewSubmitBtn').onclick=()=>renderPage('review'); 
    }
    else if(page === 'review') { let total=examState.soalConfig.length, answered=examState.answers.filter(a=>a!==null).length; let rows=''; for(let i=0;i<total;i++) rows+=`<div class="glass-premium" style="padding:14px 24px; margin:12px 0; display:flex; justify-content:space-between;"><span>Soal ${i+1}</span> ${examState.answers[i]?'<span style="color:#2E7D32;">✓ Terjawab</span>':'<span style="color:#B85C1A;">○ Belum</span>'}</div>`; container.innerHTML=`<div class="glass-premium" style="max-width:800px; margin:auto; padding:48px;">${logoHtml}<h2>Review Jawaban</h2><div style="max-height:380px; overflow:auto; margin:28px 0;">${rows}</div><p>Total: ${total} | Dijawab: ${answered} | Kosong: ${total-answered}</p><div style="display:flex; gap:22px; margin-top:34px;"><button id="backExamReview" class="btn-outline-gold">Kembali ke Ujian</button><button id="toFinalConfirmReview" class="btn-gold-premium">Lanjutkan Pengumpulan</button></div></div>`; document.getElementById('backExamReview').onclick=()=>renderPage('exam'); document.getElementById('toFinalConfirmReview').onclick=()=>renderPage('finalConfirm'); }
    else if(page === 'finalConfirm') { let total=examState.soalConfig.length, answered=examState.answers.filter(a=>a!==null).length; container.innerHTML=`<div class="glass-premium" style="max-width:720px; margin:auto; padding:48px;">${logoHtml}<h2>Konfirmasi Akhir</h2><div style="background:#FCF8EA; border-radius:36px; padding:28px;"><p>Nama: ${escapeHtml(examState.nama)}<br>Sekolah: ${escapeHtml(examState.sekolah)}<br>Jawaban: ${answered} dari ${total} soal<br>Pelanggaran: ${examState.violations}</p></div><label style="display:flex; gap:14px; margin:32px 0;"><input type="checkbox" id="finalConfirmChk"> Saya yakin mengumpulkan jawaban secara resmi dan tidak dapat mengubahnya.</label><button id="finalSubmitBtn" class="btn-gold-premium" disabled>Kumpulkan Jawaban Sekarang</button></div>`; let chk=document.getElementById('finalConfirmChk'), subBtn=document.getElementById('finalSubmitBtn'); chk.onchange=()=>subBtn.disabled=!chk.checked; subBtn.onclick=async()=>await finalSubmit(); }
    else if(page === 'selesai') { 
      let namaP = params.nama || examState?.nama || "Peserta", nomorP = params.nomor || examState?.pesertaNomor || "DPBI2026"; 
      container.innerHTML=`<div class="glass-premium" style="text-align:center; padding:68px 40px;">${logoHtml}<div style="color:#D4AF37; font-size:80px;">✅</div><h2 style="margin:24px 0 12px;">Terima Kasih</h2><p>${escapeHtml(namaP)}<br>Nomor: ${nomorP}<br>Jawaban telah dikirim ke Panitia Seleksi Nasional DPBI.</p><div style="background:#FFFBF0; border-radius:48px; padding:32px; margin:36px 0;"><p style="font-weight:600;">Bagikan pencapaianmu di Instagram Story 🎉<br>Tag <strong>@dutapelajarberbudaya</strong></p></div><button id="homeFinishBtn" class="btn-gold-premium">Kembali ke Beranda</button></div>`; 
      document.getElementById('homeFinishBtn').onclick=()=>window.location.reload(); 
    } 
  }
  (async()=>{ const fill=document.getElementById('loadBarFill'), percentSpan=document.getElementById('loadPercentText'), statusSpan=document.getElementById('loadStatus'), retryBtn=document.getElementById('retryLoadBtn'); try{ fill.style.width='30%'; percentSpan.innerText='30%'; statusSpan.innerText='Mengunduh data peserta...'; await loadPeserta(); fill.style.width='70%'; percentSpan.innerText='70%'; statusSpan.innerText='Memuat data soal...'; await loadSoal(); fill.style.width='100%'; percentSpan.innerText='100%'; statusSpan.innerText='Sistem siap.'; setTimeout(()=>{ document.getElementById('loadingScreen').style.display='none'; document.getElementById('mainApp').style.display='block'; if(restoreExamLocal() && examState && !getCompletedTokens().includes(examState.token) && !isTokenActiveElsewhere(examState.token, examState.sessionId)){ renderPage('exam'); startTimer(); startAutoSave(); activateAntiCheat(); document.documentElement.requestFullscreen().catch(e=>null); } else renderPage('login'); },600); } catch(err){ fill.style.width='100%'; percentSpan.innerText='Gagal'; statusSpan.innerHTML=`<span style="color:#b91c1c;">Error: ${err.message}<br>Hubungi panitia.</span>`; retryBtn.style.display='inline-block'; retryBtn.onclick=()=>window.location.reload(); } })();
  document.getElementById('closeModalImage')?.addEventListener('click',()=>{ let m=document.getElementById('imageModal'); m.style.visibility='hidden'; m.style.opacity=0; });
</script>
</body>
